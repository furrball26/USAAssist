<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:#F3EFE7;
    font-family:'Atkinson Hyperlegible',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    color:#14181F;
  }
  a{color:#2B3AA8}
  a:hover{color:#1B2778}
  button{font-family:inherit}
  input{font-family:inherit}
  ::-webkit-scrollbar{width:0;height:0}
  @keyframes popin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

  /* Device / app shell */
  #root{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
  .device{
    width:410px;height:864px;max-height:calc(100vh - 32px);
    background:#14181F;border-radius:52px;padding:10px;
    box-shadow:0 24px 60px rgba(20,24,31,.28);
  }
  .screen{
    width:100%;height:100%;background:#FFFDF8;border-radius:42px;
    overflow:hidden;position:relative;display:flex;flex-direction:column;
  }
  .statusbar{
    height:54px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 26px 8px;font:700 14px 'IBM Plex Mono',monospace;color:#14181F;
  }
  .scrollarea{flex:1;overflow-y:auto;overflow-x:hidden}
  .hoverfx{transition:background .12s ease}
  .hoverfx:hover{background:#EEF1FF !important}

  /* Full-bleed on phones — the real app fills the viewport */
  @media (max-width:520px){
    #root{padding:0}
    .device{width:100vw;height:100vh;height:100dvh;max-height:none;border-radius:0;padding:0;box-shadow:none;background:#FFFDF8}
    .screen{border-radius:0}
    .statusbar{padding-top:env(safe-area-inset-top,0)}
  }
</style>
</head>

<script>const { useState, useRef, useEffect, useCallback } = React;
const CONTENT_BASE = typeof window !== "undefined" && window.CONTENT_BASE || "";
function topicKicker(topic) {
  const p = String(topic || "").split(".")[0];
  const m = {
    overtime: "OVERTIME",
    minimumWage: "MINIMUM WAGE",
    discrimination: "DISCRIMINATION",
    disability: "DISABILITY \xB7 ADA",
    retaliation: "RETALIATION",
    payDiscussion: "PAY TRANSPARENCY",
    payTransparency: "PAY TRANSPARENCY",
    deadlines: "DEADLINES",
    leave: "LEAVE",
    severance: "SEVERANCE",
    wages: "WAGES",
    termination: "TERMINATION",
    compensation: "COMPENSATION"
  };
  return m[p] || p.replace(/([A-Z])/g, " $1").replace(/^./, (c) => c.toUpperCase()).toUpperCase();
}
function factValStr(v) {
  return Array.isArray(v) ? v.join(", ") : v == null ? "" : String(v);
}
function factByTopic(facts, topic) {
  return (facts || []).find((f) => f.topic === topic);
}
function factsByPrefix(facts, prefix) {
  return (facts || []).filter((f) => String(f.topic || "").split(".")[0] === prefix);
}
function css(str) {
  const out = {};
  if (!str) return out;
  str.split(";").forEach((decl) => {
    const i = decl.indexOf(":");
    if (i === -1) return;
    const rawProp = decl.slice(0, i).trim();
    const value = decl.slice(i + 1).trim();
    if (!rawProp || value === "") return;
    const prop = rawProp.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
    out[prop] = value;
  });
  return out;
}

  r_salary_low: { v: "non", title: "Likely non-exempt \u2014 overtime is owed", body: "A salary under $684 per week ($35,568/year) fails the federal salary-level test automatically. No duties test can make you exempt below that line, whatever your title says.", cites: ["29 C.F.R. \xA7541.600", "29 U.S.C. \xA7207"] },
  r_hourly: { v: "non", title: "Likely non-exempt \u2014 overtime is owed", body: "Hourly pay fails the salary-basis test for the executive, administrative and professional exemptions. Outside of a few narrow carve-outs, hourly workers must be paid overtime.", cites: ["29 C.F.R. \xA7541.602", "29 U.S.C. \xA7207"] },
  r_duties_none: { v: "non", title: "Likely non-exempt \u2014 overtime is owed", body: "Your salary clears the federal threshold, but exemption also requires exempt duties. Following set procedures and tasks is not executive, administrative or professional work under the regulations.", cites: ["29 C.F.R. \xA7541"] },
  r_exec_no: { v: "non", title: "Likely non-exempt \u2014 overtime is owed", body: "Supervising alone is not enough for the executive exemption. Without real authority over hiring, firing or promotion \u2014 or recommendations that carry particular weight \u2014 the duties test fails.", cites: ["29 C.F.R. \xA7541.100", "29 C.F.R. \xA7541.105"] },
  r_hourly_comp_no: { v: "non", title: "Likely non-exempt \u2014 overtime is owed", body: "The hourly computer-employee exemption requires both qualifying duties (systems analysis, design, programming) and at least $27.63/hour. Missing either means overtime is owed.", cites: ["29 U.S.C. \xA7213(a)(17)", "29 C.F.R. \xA7541.400"] },
  r_outside_no: { v: "non", title: "Likely non-exempt \u2014 overtime is owed", body: "The outside-sales exemption only covers people customarily working away from the employer\u2019s place of business making sales. Inside sales \u2014 phone, email, at a desk \u2014 does not qualify.", cites: ["29 C.F.R. \xA7541.500"] },
  r_exec: { v: "ex", title: "Possibly exempt \u2014 executive", body: "You appear to meet the executive exemption: salaried above the threshold, managing two or more employees, with real hiring/firing input. If any answer overstated your actual authority, revisit it \u2014 actual duties control, not titles.", cites: ["29 C.F.R. \xA7541.100", "29 U.S.C. \xA7213(a)(1)"] },
  r_admin: { v: "ex", title: "Possibly exempt \u2014 administrative", body: 'Office or business-operations work involving discretion and independent judgment on significant matters can qualify. This is the most-litigated exemption \u2014 "independent judgment" means real authority, not following guidelines.', cites: ["29 C.F.R. \xA7541.200", "29 C.F.R. \xA7541.202"] },
  r_prof: { v: "ex", title: "Possibly exempt \u2014 learned professional", body: "Work requiring advanced knowledge in a field of science or learning, acquired through prolonged specialized instruction (law, medicine, engineering, accounting), can qualify when salaried above the threshold.", cites: ["29 C.F.R. \xA7541.301"] },
  r_creative: { v: "ex", title: "Possibly exempt \u2014 creative professional", body: "Work requiring invention, imagination, originality or talent in a recognized artistic or creative field can qualify. Routine or formulaic creative work usually does not.", cites: ["29 C.F.R. \xA7541.302"] },
  r_comp: { v: "ex", title: "Possibly exempt \u2014 computer employee", body: "Systems analysis, design and programming duties can qualify, salaried or at $27.63+/hour. Some states set a much higher pay floor for this exemption than federal law \u2014 check the state-specific rules below; you may still be owed overtime there.", cites: ["29 U.S.C. \xA7213(a)(17)"] },
  r_outside: { v: "ex", title: "Possibly exempt \u2014 outside sales", body: "Regularly making sales away from the employer\u2019s place of business qualifies, with no salary requirement. Time spent on deliveries or service work counts against the exemption.", cites: ["29 C.F.R. \xA7541.500"] },
