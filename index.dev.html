  // Watch card would occupy, ONLY when state or issue is actually unset — a fully
  // set-up case where the fact lookup legitimately comes back empty (e.g.
  // deadlineKeywordsFor returning [] for the document/general issues) is a real "no
  // applicable deadline concept here," not a missing input, so this must not fire then.
  const MissingDeadlineCTA = ({ dark }) => (
    <button onClick={openEditFlow} className="surfacefx" style={css((dark
      ? "border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff"
      : "border:2px solid #14181F;background:#F0EDE5;color:#14181F") + ";text-align:left;padding:14px 16px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;gap:4px")}>
      <span style={css("font:700 12px 'IBM Plex Mono',monospace;letter-spacing:.05em;display:inline-flex;align-items:center;gap:6px;color:" + (dark ? '#DDE2FF' : '#14181F'))}><Icon name="deadline-clock" size={13} /> DEADLINE WATCH</span>
      <span style={css("font:700 16px/1.3 'Atkinson Hyperlegible',sans-serif")}>Add your state to see your filing deadline</span>
      <span style={css("font:400 14px/1.4 'Atkinson Hyperlegible',sans-serif;color:" + (dark ? '#DDE2FF' : '#3A4150'))}>Filing deadlines are set by your state and your issue — add both to find out how much time you have.</span>
    </button>
  );

  // G2/G3 (docs/flsa-process-gap.md) — the app routed wage users to WHD as free/first
  // without ever describing the OTHER path (a private §216(b) lawsuit), that it can
  // recover roughly DOUBLE the back wages plus attorney's fees, or that accepting a
  // WHD-supervised payment (or a Secretary of Labor suit already filed) can waive the
  // right to sue privately for those same wages. Sourced from the new
  // enforcement.paths / remedies.liquidatedDamages / remedies.attorneysFees facts, with
  // a hardcoded fallback so the panel still renders something true if a fact fails to
  // load. Shown on the wage dashboard and the wizard's non-exempt result.
  const WageRecoverPanel = () => {
    if (cfg.key !== 'wage') return null;
    const fedF = (federal && federal.facts) || [];
    const stF = (stateData && stateData.facts) || [];
    const enf = factByTopic(fedF, 'enforcement.paths');
    const liq = factByTopic(fedF, 'remedies.liquidatedDamages');
    const fees = factByTopic(fedF, 'remedies.attorneysFees');
    const src = f => { const u = f && safeUrl(f.sourceUrl); return u ? <a href={u} target="_blank" rel="noopener noreferrer" className="hoverfx" aria-label={'Official source for ' + (f.citation || f.topic)} style={css("display:inline-flex;align-items:center;min-height:44px;padding:2px 6px;vertical-align:middle;color:#2B3AA8;font:600 12px 'IBM Plex Mono',monospace;text-decoration:none")}>[source ↗]</a> : null; };
    // Beyond the federal §216(b) doubling above, a STATE may add its own wage
    // remedy — but only ever the one(s) this claim's shape (and, for a
    // minimum-wage-specific fact, the logged rate) actually triggers; see
    // applicableWageRemedies. Never adds to the dollar figure shown elsewhere,
    // and carries the same (DRAFT) / pending-review treatment as every other
    // state-sourced fact in the app.
    const stRemedies = applicableWageRemedies(stF, owedBreakdown, rateNum, factByTopic(stF, 'minimumWage.hourly'));
    const stRemedyNote = wageRemedyDashboardNote(stateSel, stRemedies);
    const stRev = !!(stateData && stateData.reviewed === true);
    return (
      <div style={css("padding:18px;border-radius:16px;border:2px solid #2B3AA8;background:#EEF1FF;display:flex;flex-direction:column;gap:10px")}>
        <p style={css("margin:0;font:700 17px 'Atkinson Hyperlegible',sans-serif;color:#1B2778")}>How to actually recover this</p>
        <p style={css("margin:0;font:400 15px/1.5 'Atkinson Hyperlegible',sans-serif;color:#1B2778")}><strong>File a free WHD complaint</strong> with the Department of Labor's Wage and Hour Division — confidential, no cost, but as of 2025 it recovers back wages only (no liquidated damages administratively). {src(enf)}</p>
        <p style={css("margin:0;font:400 15px/1.5 'Atkinson Hyperlegible',sans-serif;color:#1B2778")}><strong>Or file a private lawsuit</strong> — it can recover back wages plus an equal amount in liquidated damages (about double), plus your attorney's fees and costs, which is why many wage lawyers take these cases on contingency. {src(liq) || src(fees)}</p>
        {stRemedyNote &&
          <p style={css("margin:0;font:400 15px/1.5 'Atkinson Hyperlegible',sans-serif;color:#1B2778")}><strong>{stateSel || 'Your state'} may add more{stRev ? '' : ' (DRAFT — pending attorney review)'}:</strong> {stRemedyNote} {stRemedies.map(r => src(r.fact))}</p>
        }
        <p style={css("margin:0;padding:10px 12px;border-radius:0 8px 8px 0;background:#FFE7EC;border:none;border-left:4px solid #B3264F;font:700 14px/1.5 'Atkinson Hyperlegible',sans-serif;color:#5A1330;display:flex;align-items:flex-start;gap:8px")}><Icon name="alert" size={18} style={{ flex: 'none', marginTop: '2px' }} /><span>Accepting back pay under WHD supervision — or a case the Secretary of Labor already sued over — can waive your right to sue privately for those same wages.</span></p>
        <p style={css("margin:0;font:400 13px/1.4 'Atkinson Hyperlegible',sans-serif;color:#4A5162")}>29 U.S.C. § 216(b), (c) · this is general information, not a recommendation of which path to take — talk to an employment attorney before choosing.</p>
      </div>
    );
  };

  /* ── Screen renderers ──────────────────────────────────────────── */

  const Onboarding = () => {
    // Re-entering this flow to EDIT an existing case (via the ◉ pill) stages
    // changes in editDraft — nothing here touches the live case (stateSel/county/
    // issue/profile) until Save is tapped. First-run onboarding (editDraft null)
    // keeps the original live-binding behavior; there's no existing case yet to
    // protect from an unconfirmed change.
    const editing = onboarded && editDraft != null;
    const dStateSel = editing ? editDraft.stateSel : stateSel;
    const dCounty = editing ? editDraft.county : county;
    const dIssue = editing ? editDraft.issue : issue;
    const dProfile = editing ? editDraft.profile : profile;
    const setDStateSel = (v) => {
      setCountyQuery(''); // F20 — a stale filter from the previous state's county list shouldn't carry over
      if (editing) setEditDraft(p => Object.assign({}, p, { stateSel: v, county: '' }));
      else { setStateSel(v); setCounty(''); }
    };
    const setDCounty = (v) => { if (editing) setEditDraft(p => Object.assign({}, p, { county: v })); else setCounty(v); };
    const setDIssue = (v) => { if (editing) setEditDraft(p => Object.assign({}, p, { issue: v })); else setIssue(v); };
    const setDProfile = (updater) => {
      if (editing) setEditDraft(p => Object.assign({}, p, { profile: updater(p.profile) }));
      else setProfile(updater);
    };
    return (
    <div style={css("padding:20px 24px 40px;display:flex;flex-direction:column;gap:22px")}>
      <div style={css("display:flex;gap:4px;height:6px")}>
        {[1,2,3,4].map(n => <div key={n} style={css("flex:1;border-radius:3px;background:" + (onbStep >= n ? '#2B3AA8' : 'rgba(20,24,31,.12)'))}></div>)}
      </div>
      {/* F16 — a typo or wrong pick two steps back previously had no fix except
          finishing the whole flow (or the unsafe Skip). Back only moves within
          this in-progress draft — it never touches the live case; Save/Cancel
          at the end still gate any real commit. */}
      {onbStep > 1 &&
        <button onClick={() => setOnbStep(onbStep - 1)} aria-label="Back to the previous step"
          style={css("align-self:flex-start;display:flex;align-items:center;gap:4px;min-height:44px;padding:10px 12px;margin:-8px 0 -10px -10px;background:none;border:none;font:700 16px 'Atkinson Hyperlegible',sans-serif;color:#2B3AA8;cursor:pointer")}>
          <Icon name="back" size={18} /> Back
        </button>
      }
      <h1 style={css("margin:0;font:700 28px/1.15 'Atkinson Hyperlegible',sans-serif;color:#14181F;text-wrap:pretty")}>{ONB_TITLES[onbStep]}</h1>
      <p style={css("margin:0;font:400 18px/1.5 'Atkinson Hyperlegible',sans-serif;color:#3A4150;text-wrap:pretty")}>{editing ? 'Nothing changes until you tap Save at the end.' : ONB_BODIES[onbStep]}</p>

      {onbStep === 1 &&
        <div style={css("display:flex;flex-direction:column;gap:14px")}>
          <label htmlFor="onb-state" style={css("font:700 15px 'Atkinson Hyperlegible',sans-serif;color:#14181F;letter-spacing:.02em")}>STATE</label>
          <select id="onb-state" value={dStateSel} onChange={e => setDStateSel(e.target.value)} style={css("width:100%;padding:15px;border-radius:12px;border:2px solid #14181F;background:#fff;font:700 17px 'Atkinson Hyperlegible',sans-serif;color:#14181F;cursor:pointer;appearance:menulist;-webkit-appearance:menulist")}>
            <option value="">Select your state…</option>
            {US_STATES.map(n => <option key={n} value={n}>{n}</option>)}
          </select>
        </div>
      }

      {onbStep === 2 && (() => {
        const countyLabelWord = US_COUNTY_LABEL[dStateSel] === 'PARISH' ? 'parish' : US_COUNTY_LABEL[dStateSel] === 'BOROUGH' ? 'borough' : 'county';
        // F20 fix — 'county'+'s' worked, but 'parish'+'s' → "parishs" and the
        // irregular 'county' → "countys" is also wrong. Small explicit map

            <div role="group" aria-label="Were these hours paid?" style={css("display:flex;gap:8px;flex-wrap:wrap")}>
              {[['unpaid','Not paid at all'],['straight','Paid straight-time only']].map(([v, label]) =>
                <button key={v} type="button" onClick={() => setLogPayStatus(v)} aria-pressed={logPayStatus === v} className="surfacefx" style={css('min-height:44px;padding:10px 13px;border-radius:999px;border:2px solid ' + (logPayStatus === v ? '#2B3AA8' : '#14181F') + ';background:' + (logPayStatus === v ? '#2B3AA8' : '#fff') + ';color:' + (logPayStatus === v ? '#fff' : '#14181F') + ";font:700 13px 'Atkinson Hyperlegible',sans-serif;cursor:pointer")}>{label}</button>
              )}
            </div>
            <p style={css("margin:0;font:400 13px/1.4 'Atkinson Hyperlegible',sans-serif;color:#4A5162")}>{logPayStatus === 'straight' ? 'Owed at the 0.5× overtime differential (you already got straight time for these hours).' : 'Owed at the full 1.5× overtime rate.'}</p>
          </div>
        }
        {kind.tag === 'Witness' &&
          <div style={css("display:flex;flex-direction:column;gap:10px")}>
            <div style={css("display:flex;flex-direction:column;gap:6px")}>
              <label htmlFor="log-witness-name" style={css("font:700 14px 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>Witness name</label>
              <input id="log-witness-name" type="text" value={logWitnessName} onChange={e => setLogWitnessName(e.target.value)} placeholder="e.g. Jordan Lee" style={css("width:100%;box-sizing:border-box;min-height:44px;padding:10px 12px;border-radius:10px;border:2px solid #14181F;font:400 16px 'Atkinson Hyperlegible',sans-serif")} />
            </div>
            <div style={css("display:flex;flex-direction:column;gap:6px")}>
              <label htmlFor="log-witness-contact" style={css("font:700 14px 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>Contact <span style={css("font-weight:400;color:#4A5162")}>(optional)</span></label>
              <input id="log-witness-contact" type="text" value={logWitnessContact} onChange={e => setLogWitnessContact(e.target.value)} placeholder="Phone or email" style={css("width:100%;box-sizing:border-box;min-height:44px;padding:10px 12px;border-radius:10px;border:2px solid #14181F;font:400 16px 'Atkinson Hyperlegible',sans-serif")} />
            </div>
            <div style={css("display:flex;flex-direction:column;gap:6px")}>
              <label htmlFor="log-witness-rel" style={css("font:700 14px 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>Relationship</label>
              <select id="log-witness-rel" value={logWitnessRelationship} onChange={e => setLogWitnessRelationship(e.target.value)} style={css("width:100%;box-sizing:border-box;min-height:44px;padding:10px 12px;border-radius:10px;border:2px solid #14181F;background:#fff;font:400 16px 'Atkinson Hyperlegible',sans-serif;cursor:pointer;appearance:menulist;-webkit-appearance:menulist")}>
                <option value="">Select…</option>
                {RELATIONSHIP_OPTIONS.map(o => <option key={o} value={o}>{o}</option>)}
              </select>
            </div>
            <div role="group" aria-label="Still employed there?" style={css("display:flex;flex-direction:column;gap:6px")}>
              <span style={css("font:700 14px 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>Still employed there?</span>
              <div style={css("display:flex;gap:8px;flex-wrap:wrap")}>
                {YES_NO_UNSURE.map(v =>
                  <button key={v} type="button" onClick={() => setLogWitnessStillEmployed(v)} aria-pressed={logWitnessStillEmployed === v} className="surfacefx" style={css('min-height:44px;padding:10px 13px;border-radius:999px;border:2px solid ' + (logWitnessStillEmployed === v ? '#2B3AA8' : '#14181F') + ';background:' + (logWitnessStillEmployed === v ? '#2B3AA8' : '#fff') + ';color:' + (logWitnessStillEmployed === v ? '#fff' : '#14181F') + ";font:700 13px 'Atkinson Hyperlegible',sans-serif;cursor:pointer")}>{v}</button>
                )}
              </div>
            </div>
            <div role="group" aria-label="Willing to be contacted?" style={css("display:flex;flex-direction:column;gap:6px")}>
              <span style={css("font:700 14px 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>Willing to be contacted?</span>
              <div style={css("display:flex;gap:8px;flex-wrap:wrap")}>
                {YES_NO_UNSURE.map(v =>
                  <button key={v} type="button" onClick={() => setLogWitnessWilling(v)} aria-pressed={logWitnessWilling === v} className="surfacefx" style={css('min-height:44px;padding:10px 13px;border-radius:999px;border:2px solid ' + (logWitnessWilling === v ? '#2B3AA8' : '#14181F') + ';background:' + (logWitnessWilling === v ? '#2B3AA8' : '#fff') + ';color:' + (logWitnessWilling === v ? '#fff' : '#14181F') + ";font:700 13px 'Atkinson Hyperlegible',sans-serif;cursor:pointer")}>{v}</button>
                )}
              </div>
            </div>
          </div>
        }
        {kind.tag === 'Statement' &&
          <div style={css("display:flex;flex-direction:column;gap:10px")}>
            <div style={css("display:flex;flex-direction:column;gap:6px")}>
              <label htmlFor="log-speaker-name" style={css("font:700 14px 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>Who said it</label>
              <input id="log-speaker-name" type="text" value={logSpeakerName} onChange={e => setLogSpeakerName(e.target.value)} placeholder="e.g. Jordan Lee" style={css("width:100%;box-sizing:border-box;min-height:44px;padding:10px 12px;border-radius:10px;border:2px solid #14181F;font:400 16px 'Atkinson Hyperlegible',sans-serif")} />
            </div>
            <div style={css("display:flex;flex-direction:column;gap:6px")}>
              <label htmlFor="log-speaker-role" style={css("font:700 14px 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>Their role</label>
              <input id="log-speaker-role" type="text" value={logSpeakerRole} onChange={e => setLogSpeakerRole(e.target.value)} placeholder="e.g. My supervisor" style={css("width:100%;box-sizing:border-box;min-height:44px;padding:10px 12px;border-radius:10px;border:2px solid #14181F;font:400 16px 'Atkinson Hyperlegible',sans-serif")} />
            </div>
            <div style={css("display:flex;flex-direction:column;gap:6px")}>
              <label htmlFor="log-said-when" style={css("font:700 14px 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>When</label>
              <input id="log-said-when" type="date" value={logSaidWhen} max={dateInputValue()} onChange={e => setLogSaidWhen(e.target.value)} style={dateTimeInputStyle()} />
            </div>
            <div style={css("display:flex;flex-direction:column;gap:6px")}>
              <label htmlFor="log-said-where" style={css("font:700 14px 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>Where / how</label>
              <select id="log-said-where" value={logSaidWhere} onChange={e => setLogSaidWhere(e.target.value)} style={css("width:100%;box-sizing:border-box;min-height:44px;padding:10px 12px;border-radius:10px;border:2px solid #14181F;background:#fff;font:400 16px 'Atkinson Hyperlegible',sans-serif;cursor:pointer;appearance:menulist;-webkit-appearance:menulist")}>
                <option value="">Select…</option>
                {SAID_WHERE_OPTIONS.map(o => <option key={o} value={o}>{o}</option>)}
              </select>
            </div>
            <div style={css("display:flex;flex-direction:column;gap:6px")}>
              <label htmlFor="log-who-else-heard" style={css("font:700 14px 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>Who else heard it <span style={css("font-weight:400;color:#4A5162")}>(optional)</span></label>
              <input id="log-who-else-heard" type="text" value={logWhoElseHeard} onChange={e => setLogWhoElseHeard(e.target.value)} placeholder="Anyone else present" style={css("width:100%;box-sizing:border-box;min-height:44px;padding:10px 12px;border-radius:10px;border:2px solid #14181F;font:400 16px 'Atkinson Hyperlegible',sans-serif")} />
            </div>
          </div>
        }
        {kind.tag === 'Records' &&
          <div style={css("display:flex;flex-direction:column;gap:10px")}>
            <div style={css("display:flex;flex-direction:column;gap:6px")}>
              <label htmlFor="log-doc-type" style={css("font:700 14px 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>Document type</label>
              <select id="log-doc-type" value={logDocType} onChange={e => setLogDocType(e.target.value)} style={css("width:100%;box-sizing:border-box;min-height:44px;padding:10px 12px;border-radius:10px;border:2px solid #14181F;background:#fff;font:400 16px 'Atkinson Hyperlegible',sans-serif;cursor:pointer;appearance:menulist;-webkit-appearance:menulist")}>
                <option value="">Select…</option>
                {DOC_TYPE_OPTIONS.map(o => <option key={o} value={o}>{o}</option>)}
              </select>
            </div>
            <div style={css("display:flex;flex-direction:column;gap:6px")}>
              <label htmlFor="log-doc-date" style={css("font:700 14px 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>Document date</label>
              <input id="log-doc-date" type="date" value={logDocDate} max={dateInputValue()} onChange={e => setLogDocDate(e.target.value)} style={dateTimeInputStyle()} />
            </div>
            <div style={css("display:flex;flex-direction:column;gap:6px")}>
              <label htmlFor="log-doc-parties" style={css("font:700 14px 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>Author / parties</label>
              <input id="log-doc-parties" type="text" value={logDocParties} onChange={e => setLogDocParties(e.target.value)} placeholder="Who wrote or sent it" style={css("width:100%;box-sizing:border-box;min-height:44px;padding:10px 12px;border-radius:10px;border:2px solid #14181F;font:400 16px 'Atkinson Hyperlegible',sans-serif")} />
            </div>
          </div>
        }
        {(() => {
          const noteLabel = kind.tag === 'Witness' ? 'What they saw or heard' : kind.tag === 'Statement' ? 'What was said (exact quote if known)' : kind.tag === 'Records' ? 'Why it matters' : 'What happened';
          const notePlaceholder = kind.tag === 'Witness' ? 'Describe what this witness saw or heard…' : kind.tag === 'Statement' ? 'The exact words, if you remember them…' : kind.tag === 'Records' ? 'Why this document matters to your case…' : 'What happened? Date, who was there, what was said…';
          return (
            <div style={css("display:flex;flex-direction:column;gap:6px")}>
              <label htmlFor="log-note" style={css("font:700 14px 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>{noteLabel}</label>
              <textarea id="log-note" aria-label={noteLabel} value={logNote} onChange={e => setLogNote(e.target.value)} rows={2} placeholder={notePlaceholder} style={css("width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:2px solid #14181F;font:400 16px/1.4 'Atkinson Hyperlegible',sans-serif;resize:vertical")} />
            </div>
          );
        })()}
        <div style={css("display:flex;flex-direction:column;gap:8px")}>
          <label htmlFor="log-attachment" style={css("font:700 14px 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>Attach a photo or file (optional)</label>
          {!logAttachment &&
            <div style={css("display:flex;align-items:center;gap:10px")}>
              {/* accept excludes SVG (image/svg+xml can carry script); onAttachmentChange
                  also enforces a MIME allow-list before reading. Merged with the a11y
                  hidden-input + 44px styled-label pattern. */}
              <input id="log-attachment" type="file" accept="image/jpeg,image/png,image/gif,image/webp,image/heic,image/heif,.pdf,.doc,.docx,.txt" onChange={onAttachmentChange} aria-describedby="log-attachment-hint" className="fileInputHidden" />
              <label htmlFor="log-attachment" style={css("min-height:44px;padding:10px 16px;border-radius:10px;border:2px solid #14181F;background:#fff;color:#14181F;font:700 14px 'Atkinson Hyperlegible',sans-serif;cursor:pointer;display:inline-flex;align-items:center")}>Choose file</label>
            </div>
          }
          {logAttachmentError &&
            <p role="alert" style={css("margin:0;padding:10px 12px;border-radius:10px;background:#FFE7EC;border:2px solid #B3264F;font:700 13px/1.4 'Atkinson Hyperlegible',sans-serif;color:#8A1438")}>{logAttachmentError}</p>
          }
          {logAttachment &&
            <div style={css("display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;border:2px solid #14181F;background:#F0EDE5")}>
              {logAttachment.type && logAttachment.type.startsWith('image/') ?
                <img src={logAttachment.dataUrl} alt="" style={css("flex:none;width:48px;height:48px;border-radius:8px;object-fit:cover;border:2px solid #14181F")} /> :
                <span style={css("flex:none;color:#14181F")}><Icon name="document" size={22} /></span>
              }
              <span style={css("flex:1;font:600 14px/1.3 'Atkinson Hyperlegible',sans-serif;color:#14181F;overflow-wrap:anywhere")}>{logAttachment.name}</span>
              <button type="button" onClick={() => setLogAttachment(null)} aria-label={'Remove attachment ' + logAttachment.name} style={css("flex:none;min-height:40px;padding:8px 12px;border-radius:8px;border:2px solid #B3264F;background:#fff;color:#B3264F;font:700 13px 'Atkinson Hyperlegible',sans-serif;cursor:pointer")}>Remove</button>
            </div>
          }
          <p id="log-attachment-hint" style={css("margin:0;font:400 12px/1.4 'Atkinson Hyperlegible',sans-serif;color:#4A5162")}>Stays on this device, like everything else here. Limit {ATTACHMENT_MAX_BYTES / 1024 / 1024}MB.</p>
        </div>
        <div style={css("display:flex;gap:10px")}>
          <button onClick={submit} style={css("align-self:flex-start;padding:12px 18px;border-radius:12px;border:none;background:#2B3AA8;color:#fff;font:700 16px 'Atkinson Hyperlegible',sans-serif;cursor:pointer")}>{editing ? 'Save changes' : 'Add to log'}</button>
          {editing && <button onClick={resetForm} style={css("align-self:flex-start;padding:12px 18px;border-radius:12px;border:2px solid #14181F;background:#fff;color:#14181F;font:700 16px 'Atkinson Hyperlegible',sans-serif;cursor:pointer")}>Cancel</button>}
        </div>
      </div>

      {entries.length > 0 &&
        <div style={css("display:flex;gap:10px;flex-wrap:wrap")}>
          <span style={css("padding:8px 12px;border-radius:8px;background:#EEF1FF;border:2px solid #2B3AA8;font:600 13px 'IBM Plex Mono',monospace;color:#1B2778")}>{entries.length} {entries.length === 1 ? 'ENTRY' : 'ENTRIES'}</span>
          {logBreakdown.totalHours > 0 && <span style={css("padding:8px 12px;border-radius:8px;background:#FFF4D6;border:2px solid #14181F;font:600 13px 'IBM Plex Mono',monospace;color:#14181F")}>{logBreakdown.totalHours} HRS LOGGED · {logBreakdown.weekCount} {logBreakdown.weekCount === 1 ? 'WORKWEEK' : 'WORKWEEKS'}</span>}
        </div>
      }

      {payBreakdown.totalHours > 0 &&
        <div style={css("padding:16px;border-radius:16px;border:2px solid #14181F;background:#fff;display:flex;flex-direction:column;gap:10px")}>
          <p style={css("margin:0;font:700 17px 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>Regular &amp; overtime pay, by workweek</p>
          <div style={css("display:flex;flex-direction:column;gap:8px")}>
            {payBreakdown.weeks.map(w =>
              <div key={w.key} style={css("padding:10px 12px;border-radius:10px;background:#F0EDE5;border:2px solid rgba(20,24,31,.2);display:flex;flex-direction:column;gap:3px")}>
                <div style={css("display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap")}>
                  <span style={css("font:700 14px 'IBM Plex Mono',monospace;color:#14181F")}>{w.label}</span>
                  <span style={css("font:600 13px 'IBM Plex Mono',monospace;color:#4A5162")}>{w.hours} hrs total{w.otHours > 0 ? ' · over 40' : ''}</span>
                </div>
                <p style={css("margin:0;font:400 14px/1.4 'Atkinson Hyperlegible',sans-serif;color:#3A4150")}>
                  Regular: {w.regHours} hrs{rateNum > 0 ? ' = ' + money(w.regPay) : ''}
                  {w.otHours > 0 ? <> · Overtime (1.5×): {w.otHours} hrs{rateNum > 0 ? ' = ' + money(w.otPay) : ''}</> : null}
                </p>
              </div>
            )}
          </div>
          {rateNum > 0 ?
            <p style={css("margin:0;font:700 16px/1.4 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>Total: {money(payBreakdown.totalRegPay)} regular + {money(payBreakdown.totalOtPay)} overtime = {money(payBreakdown.totalPay)}</p>
            :
            <p style={css("margin:0;font:600 14px/1.4 'Atkinson Hyperlegible',sans-serif;color:#6B4B00")}>Add your hourly rate in your profile to see dollar amounts — showing hours only for now.</p>
          }
          <p style={css("margin:0;font:400 12px/1.4 'Atkinson Hyperlegible',sans-serif;color:#4A5162")}>Overtime only counts hours actually worked beyond 40 in that Sun–Sat workweek (29 U.S.C. § 207), based on the hours you've logged for it. If you didn't log every hour you worked that week, this can understate — log all your hours for the most accurate picture.</p>
        </div>
      }

      {entries.length === 0 ?
        <div style={css("padding:22px;border-radius:16px;border:2px dashed rgba(20,24,31,.35);background:#fff;text-align:center")}>
          <p style={css("margin:0 0 4px;font:700 17px 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>Your log is empty</p>
          <p style={css("margin:0;font:400 15px/1.45 'Atkinson Hyperlegible',sans-serif;color:#4A5162")}>Add your first entry above. The earlier you start, the stronger your record.</p>
        </div>
        :
        <div style={css("display:flex;flex-direction:column")}>
          {entries.map((e, i) =>
            <div key={i} style={css("display:flex;gap:14px")}>
              <div style={css("display:flex;flex-direction:column;align-items:center;width:22px;flex:none")}>
                <span style={css('flex:none;width:18px;height:18px;border-radius:50%;background:' + e.color + ';border:3px solid #14181F')}></span>
                <span style={css("flex:1;width:3px;background:rgba(20,24,31,.15)")}></span>
              </div>
              <div style={css('padding-bottom:18px;flex:1;border-radius:12px;' + (editingEntryIdx === i ? 'outline:2px solid #6B4B00;outline-offset:6px;' : ''))}>
                <p style={css("margin:0 0 3px;font:600 13px 'IBM Plex Mono',monospace;color:#4A5162")}>{e.date}{e.startTime && e.endTime ? ' · ' + formatTime12(e.startTime) + '–' + formatTime12(e.endTime) : ''}</p>
                <p style={css("margin:0 0 5px;font:700 18px/1.3 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>{e.title}{e.hours ? ' — ' + e.hours + ' hrs' : ''}</p>
                {e.tag === 'Witness' && e.witnessName &&
                  <p style={css("margin:0 0 4px;font:600 14px/1.4 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>
                    {e.witnessName}
                    {e.witnessRelationship ? ' · ' + e.witnessRelationship : ''}
                    {e.witnessStillEmployed ? ' · Still employed: ' + e.witnessStillEmployed : ''}
                    {e.witnessWilling ? ' · Willing to be contacted: ' + e.witnessWilling : ''}
                    {e.witnessContact ? ' · ' + e.witnessContact : ''}
                  </p>
                }
                {e.tag === 'Statement' && e.speakerName &&
                  <p style={css("margin:0 0 4px;font:600 14px/1.4 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>
                    {e.speakerName}
                    {e.speakerRole ? ' · ' + e.speakerRole : ''}
                    {e.saidWhere ? ' · ' + e.saidWhere : ''}
                    {e.saidWhen ? ' · ' + e.saidWhen : ''}
                    {e.whoElseHeard ? ' · Also heard by: ' + e.whoElseHeard : ''}
                  </p>
                }
                {e.tag === 'Records' && e.docType &&
                  <p style={css("margin:0 0 4px;font:600 14px/1.4 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>
                    {e.docType}
                    {e.docDate ? ' · ' + e.docDate : ''}
                    {e.docParties ? ' · ' + e.docParties : ''}
                  </p>
                }
                <p style={css("margin:0 0 8px;font:400 16px/1.45 'Atkinson Hyperlegible',sans-serif;color:#3A4150")}>{e.body}</p>
                {e.attachment &&
                  <a href={e.attachment.dataUrl} download={e.attachment.name} style={css("display:inline-flex;align-items:center;gap:8px;margin:0 0 8px;padding:6px;border-radius:10px;border:2px solid #14181F;background:#F0EDE5;text-decoration:none;max-width:220px")}>
                    {e.attachment.type && e.attachment.type.startsWith('image/') ?
                      <img src={e.attachment.dataUrl} alt={'Attachment: ' + e.attachment.name} style={css("flex:none;width:52px;height:52px;border-radius:8px;object-fit:cover;border:2px solid #14181F")} /> :
                      <span style={css("flex:none;padding:0 4px;color:#14181F")}><Icon name="document" size={22} /></span>
                    }
                    <span style={css("flex:1;font:600 13px/1.3 'Atkinson Hyperlegible',sans-serif;color:#14181F;overflow-wrap:anywhere")}>{e.attachment.name}</span>
                  </a>
                }
                <div style={css("display:flex;align-items:center;gap:8px;flex-wrap:wrap")}>
                  <span style={css("display:inline-block;padding:6px 10px;border-radius:8px;background:#F0EDE5;border:2px solid #14181F;font:600 12px 'IBM Plex Mono',monospace;color:#14181F")}>{e.tag}</span>
                  {e.causalRole && CAUSAL_ROLE_META[e.causalRole] &&
                    <span style={css('display:inline-block;padding:6px 10px;border-radius:8px;background:' + CAUSAL_ROLE_META[e.causalRole].bg + ';border:2px solid ' + CAUSAL_ROLE_META[e.causalRole].color + ";font:700 12px 'IBM Plex Mono',monospace;color:" + CAUSAL_ROLE_META[e.causalRole].color)}>{CAUSAL_ROLE_META[e.causalRole].label.toUpperCase()}</span>
                  }
                  <button onClick={() => startEdit(i)} aria-label={'Edit entry from ' + e.date} style={css("min-height:44px;padding:6px 12px;border-radius:8px;border:2px solid #2B3AA8;background:#fff;color:#2B3AA8;font:700 13px 'Atkinson Hyperlegible',sans-serif;cursor:pointer")}>Edit</button>
                  <button onClick={() => deleteEntry(i)} aria-label={'Delete entry from ' + e.date} style={css("min-height:44px;padding:6px 12px;border-radius:8px;border:2px solid #B3264F;background:#fff;color:#B3264F;font:700 13px 'Atkinson Hyperlegible',sans-serif;cursor:pointer")}>Delete</button>
                </div>
              </div>
            </div>
          )}
        </div>
      }
    </div>
    );
  };

  const Doc = () => {
    const scanned = scanClauseText(docText);
    const hasPasted = docText.trim().length > 0;
    const shownClauses = hasPasted ? scanned : CLAUSES;
    return (
    <div style={css("padding:6px 22px 34px;display:flex;flex-direction:column;gap:16px")}>
      <button onClick={nav('home')} style={css("align-self:flex-start;display:flex;align-items:center;gap:4px;background:none;border:none;padding:12px 8px;margin-left:-8px;font:700 16px 'Atkinson Hyperlegible',sans-serif;color:#2B3AA8;cursor:pointer")}><Icon name="back" size={18} /> Dashboard</button>

  // Damages / back-pay estimator — the non-wage issues (termination,

  const DamagesEstimator = () => {

              <span style={css("font:700 20px 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>{money(oopTotal)}</span>
            </div>
          </div>
        </>

      <div style={css("padding:16px;border-radius:14px;background:#FFF4D6;border:2px solid #14181F")}>
        <p style={css("margin:0;font:400 15px/1.45 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>This is legal information, not legal advice, and none of the figures above are what you are owed. An employment attorney licensed in {stateLabel} can assess what your case might actually be worth.</p>
      </div>
      <button onClick={nav('agencies')} className="hoverfx" style={css("align-self:flex-start;min-height:44px;padding:12px 16px;border-radius:12px;border:2px solid #2B3AA8;background:#fff;color:#2B3AA8;font:700 15px 'Atkinson Hyperlegible',sans-serif;cursor:pointer")}>Find a lawyer →</button>
    </div>
    );
  };

  // Records-request / personnel-file follow-through tracker — gated to the
  // termination issue (see the Standard/Action/Plain Tools tiles below), same
  // cfg.key-guard pattern as NonCompeteChecker/DamagesEstimator above. The app's
  // buildLetter('records-request') already asks the employer, in writing, for a
  // copy of the personnel/pay file — this tracks what actually happened next:
  // when/how it was sent, whether a response came in (non-response can itself
  // be relevant — an employer that never responds is a fact worth keeping),
  // and what was/wasn't produced. Persisted as profile.recordsRequest, a plain
  // object alongside the rest of profile's real case data, and surfaced in the
  // exported case file's RECORDS REQUEST section (see buildCaseFile) once a
  // request is actually on file. The one date figure this screen computes —
  // the employer's response-by deadline — reuses the SAME real, sourced
  // final-pay fact buildLetter already cites for this exact letter (never an
  // invented deadline): when no such fact exists for the user's state, this
  // honestly says so instead of guessing a number of days.
  const RecordsRequestTracker = () => {
    const rr = Object.assign({ dateSent:'', method:'', dateReceived:'', noResponseYet:'', produced:'', missing:'' }, profile.recordsRequest);
    const setRR = patch => setProfile(p => Object.assign({}, p, { recordsRequest: Object.assign({}, rr, patch) }));
    const stF = (stateData && stateData.facts) || [];
    const stReviewed = !!(stateData && stateData.reviewed === true);
    const finalPayFact = factByTopic(stF, 'final-pay') || factsByPrefix(stF, 'final-pay')[0];
    const computed = (rr.dateSent && finalPayFact) ? computeDeadlineFromEvent(rr.dateSent, finalPayFact.value || finalPayFact.summary) : null;
    const daysSince = rr.dateSent ? daysBetweenDateStrs(rr.dateSent, dateInputValue()) : null;
    const daysToRespond = (rr.dateSent && rr.dateReceived) ? daysBetweenDateStrs(rr.dateSent, rr.dateReceived) : null;
    const statusLine = !rr.dateSent ? null
      : rr.noResponseYet === true
      ? 'Request sent ' + formatLocalDateStr(rr.dateSent) + ' — no response yet' + (daysSince != null && daysSince >= 0 ? ' after ' + daysSince + (daysSince === 1 ? ' day' : ' days') : '') + '.'
      : rr.dateReceived
      ? 'Request sent ' + formatLocalDateStr(rr.dateSent) + ' — response received ' + formatLocalDateStr(rr.dateReceived) + (daysToRespond != null ? ' (' + daysToRespond + (daysToRespond === 1 ? ' day' : ' days') + ' later)' : '') + '.'

  const AdaProcessTracker = () => {

  const Letter = () => {
    const kinds = letterKindsFor(cfg.key, cfg.letterKind);
    // accommodation-request is allowed to render here even when it is not one of
    // this issue's listed kinds/tabs (e.g. wage, termination, document, general)
    // — the chat's ADA reply CTA deep-links straight to it with an explicit
    // setLetterType('accommodation-request') so that promise stays true for
    // every issue, without adding an ADA tab those issues' Letter screens don't
    // otherwise offer (see letterKindsFor).
    const activeKind = letterType === 'accommodation-request' ? 'accommodation-request'
      : kinds.indexOf(letterType) >= 0 ? letterType : kinds[0];
    const gen = buildLetter({
      kind: activeKind, issueKey: cfg.key, youName, employerName, stateSel: stateLabel,
      unpaidHours, owedEstimate, rateNum, federal, stateData, entries, payType: profile.payType,
      // FIND-11 — lets the accommodation-request/complaint letters incorporate a

      : cfg.key === 'wage' && (evidenceCount > 0 || unpaidHours > 0)
      ? 'Built from your log: ' + evidenceCount + ' ' + (evidenceCount === 1 ? 'entry' : 'entries') + (unpaidHours > 0 ? ', ' + unpaidHours + ' unpaid hours' : '') + '.'
      : 'Built from your case details for ' + locationLabel + '.';

    const hasAbsurdRate = activeKind === 'wage-demand' && rateNum > RATE_WARN_MAX;

    // usertest HIGH #9 — this letter can cite a state-law fact as settled (a real
    // citation like "N.Y. Executive Law § 292(5)") while the Rights tab, using that
    // SAME underlying fact, explicitly flags it "(DRAFT)" / "pending attorney
    // review" (see RightsLib's stReviewed / DraftStateNotice). A user could send
    // real correspondence citing law the app elsewhere admits isn't verified, with
    // no warning at the point of use. gen.usesStateLaw is set per-kind above,

      <p style={css("margin:0;font:400 14px/1.45 'Atkinson Hyperlegible',sans-serif;color:#4A5162")}>A template you send yourself. WorkLaw does not represent you and cannot send this on your behalf.</p>

  const Strength = () => (

        <h1 style={css("margin:0;font:700 28px/1.15 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>What makes your case</h1>

          {/* Call the screen as a function (not <Current/>) so it inlines into this
              stable tree instead of remounting on every keystroke — remounting was
              destroying the chat/onboarding/letter inputs and jumping scroll. */}
          {Current()}
          {/* wl-security/usertest — a one-time reminder the first time this browser
              actually holds identifying case data (name/employer), not buried in the
              always-present footer note below (which a user skims past once it's
              always there) — shown once, on Home, then never again (privacyNoteSeen
              persists in the saved case). */}
          {screen === 'home' && !privacyNoteSeen && (profile.name || '').trim() + (profile.employer || '').trim() &&
            <div style={css("margin:14px 22px 0;padding:16px;border-radius:14px;border:2px solid #14181F;background:#FFF4D6;display:flex;flex-direction:column;gap:10px")}>
              <p style={css("margin:0;font:700 15px/1.45 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>Your name and employer are saved only in this browser, in plain text — don’t use a shared or public computer if this needs to stay private.</p>
              <button onClick={() => setPrivacyNoteSeen(true)} className="hoverfx" style={css("align-self:flex-start;min-height:44px;padding:10px 16px;border-radius:10px;border:2px solid #14181F;background:#fff;color:#14181F;font:700 14px 'Atkinson Hyperlegible',sans-serif;cursor:pointer")}>Got it</button>
            </div>
          }
          {screen === 'home' && (() => {
            const dark = altHome === 'action';
            return (
              <div style={css("margin:0 22px 30px;padding-top:16px;border-top:1px solid " + (dark ? 'rgba(255,255,255,.25)' : 'rgba(20,24,31,.14)'))}>
                <p style={css("margin:0 0 10px;font:400 13px/1.5 'Atkinson Hyperlegible',sans-serif;color:" + (dark ? '#DDE2FF' : '#4A5162'))}>Everything you enter stays in this browser on this device — nothing is uploaded. On a shared or work computer, delete your case when you’re done.</p>
                <div style={css("display:flex;gap:10px;flex-wrap:wrap")}>
                  <button onClick={startFreshCase} style={css("padding:12px 16px;border-radius:12px;border:2px solid " + (dark ? 'rgba(255,255,255,.55)' : '#14181F') + ";background:transparent;color:" + (dark ? '#fff' : '#14181F') + ";font:700 15px 'Atkinson Hyperlegible',sans-serif;cursor:pointer;min-height:44px")}>Start a fresh case</button>
                  <button onClick={clearCase} style={css("padding:12px 16px;border-radius:12px;border:2px solid " + (dark ? 'rgba(255,255,255,.55)' : '#B3264F') + ";background:transparent;color:" + (dark ? '#fff' : '#B3264F') + ";font:700 15px 'Atkinson Hyperlegible',sans-serif;cursor:pointer;min-height:44px")}>Delete my case &amp; start over</button>
                </div>
              </div>
            );
          })()}
        </main>
      </div>
    </div>
  );
}

// Last-resort catch for a render-time exception that reaches here despite
// loadCase()'s shape sanitizing (sanitizeCase covers the fields that were
// actually observed crashing the render, not necessarily every field a future
// bug or a hand-edited devtools change could corrupt). Without this, ANY
// uncaught render error takes the whole app to a permanently blank #root — the
// in-tree "Delete my case" button included, since it lives inside the tree
// that never mounted — and reload doesn't fix it, since the bad data is never
// rewritten. This gives the user a real way out instead of a dead page.
class ErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state = { hasError:false }; }
  static getDerivedStateFromError(){ return { hasError:true }; }
  componentDidCatch(error, info){
    if (typeof console !== 'undefined' && console.error) console.error('WorkLaw crashed:', error, info);
  }
  render(){
    if (!this.state.hasError) return this.props.children;
    const reloadOnly = () => { if (typeof window !== 'undefined') window.location.reload(); };
    const clearAndReload = () => {
      try { localStorage.removeItem(STORE_KEY); } catch(e) {}
      if (typeof window !== 'undefined') window.location.reload();
    };
    return (
      <div style={css("max-width:480px;margin:60px auto;padding:28px;font-family:'Atkinson Hyperlegible',sans-serif;color:#14181F")}>
        <h1 style={css("font:700 22px 'Atkinson Hyperlegible',sans-serif;margin:0 0 12px")}>Something went wrong</h1>
        <p style={css("font:400 15px/1.5 'Atkinson Hyperlegible',sans-serif;margin:0 0 16px")}>WorkLaw hit an unexpected error and can't display your case right now. This is usually caused by saved data that got corrupted. Your options:</p>
        <div style={css("display:flex;flex-direction:column;gap:10px")}>
          <button onClick={reloadOnly} style={css("min-height:44px;padding:14px 18px;border-radius:12px;border:2px solid #14181F;background:#fff;color:#14181F;font:700 15px 'Atkinson Hyperlegible',sans-serif;cursor:pointer")}>Try reloading</button>
          <button onClick={clearAndReload} style={css("min-height:44px;padding:14px 18px;border-radius:12px;border:2px solid #B3264F;background:#fff;color:#B3264F;font:700 15px 'Atkinson Hyperlegible',sans-serif;cursor:pointer")}>Clear my saved case &amp; start over</button>
        </div>
        <p style={css("font:400 13px/1.5 'Atkinson Hyperlegible',sans-serif;color:#4A5162;margin:16px 0 0")}>Clearing your case removes everything WorkLaw has saved on this device — your log entries, letters and chat — and returns you to onboarding. Everything WorkLaw stores lives only in this browser, so this is a local reset, not an account action.</p>
      </div>
    );
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
