/* Parse a CSS declaration string into a React style object.
   Lets us reuse the design's exact inline-style strings verbatim. */
function css(str){
  const out = {};
  if(!str) return out;
  str.split(';').forEach(decl => {
    const i = decl.indexOf(':');
    if(i === -1) return;
    const rawProp = decl.slice(0, i).trim();
    const value = decl.slice(i + 1).trim();
    if(!rawProp || value === '') return;
    const prop = rawProp.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
    out[prop] = value;
  });
  return out;
}

      <p style={css("margin:0;font:600 14px 'IBM Plex Mono',monospace;color:#4A5162")}>6 pages · read in 4s · 3 clauses flagged</p>
      <div style={css("display:flex;flex-direction:column;gap:12px")}>
        {CLAUSES.map((cl, i) =>
          <div key={i} style={css('padding:18px;border-radius:16px;border:2px solid #14181F;background:' + cl.tone)}>
            <div style={css("display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px")}>
              <span style={css("font:700 16px 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>{cl.title}</span>
              <span style={css('flex:none;padding:6px 10px;border-radius:8px;background:#fff;border:2px solid ' + cl.badge + ";font:700 12px 'IBM Plex Mono',monospace;color:" + cl.badge)}>{cl.level}</span>
            </div>
            <p style={css("margin:0 0 10px;padding-left:12px;border-left:4px solid rgba(20,24,31,.25);font:italic 400 15px/1.5 'Atkinson Hyperlegible',sans-serif;color:#3A4150")}>“{cl.quote}”</p>
            <p style={css("margin:0;font:400 16px/1.45 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>{cl.plain}</p>
          </div>
        )}
      </div>
      <div style={css("padding:16px;border-radius:14px;background:#FFF4D6;border:2px solid #14181F")}>
        <p style={css("margin:0;font:400 15px/1.45 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>You have <strong>21 days</strong> to consider this and <strong>7 days</strong> to revoke after signing. Do not sign to hit an artificial deadline.</p>
      </div>
    </div>
  );

  const Letter = () => (
    <div style={css("padding:6px 22px 34px;display:flex;flex-direction:column;gap:16px")}>
      <button onClick={nav('home')} style={css("align-self:flex-start;background:none;border:none;padding:6px 0;font:700 16px 'Atkinson Hyperlegible',sans-serif;color:#2B3AA8;cursor:pointer")}>← Dashboard</button>
      <h1 style={css("margin:0;font:700 26px/1.2 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>Wage demand letter</h1>
      <p style={css("margin:0;font:400 16px/1.45 'Atkinson Hyperlegible',sans-serif;color:#4A5162")}>Built from your log: 14 entries, 62 unpaid hours, Mar–Jun 2026.</p>
      <div style={css("padding:22px;border-radius:12px;background:#fff;border:2px solid #14181F;font:400 15px/1.65 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>
        <p style={css("margin:0 0 12px")}>Rivera Logistics, Attn: Payroll<br/>1140 Embarcadero, Oakland, CA</p>
        <p style={css("margin:0 0 12px")}><strong>Re: Unpaid overtime wages, March–June 2026</strong></p>
        <p style={css("margin:0 0 12px")}>I am writing to request payment of overtime wages earned and not paid. My records show <span style={css("background:#FFF4D6;padding:1px 3px")}>62.5 hours</span> worked beyond 40 in a workweek and beyond 8 in a workday.</p>
        <p style={css("margin:0 0 12px")}>Under 29 U.S.C. §207 and California Labor Code §510, these hours are compensable at premium rates. I request payment of <span style={css("background:#FFF4D6;padding:1px 3px")}>$2,418.75</span> within 14 days.</p>
        <p style={css("margin:0")}>Sincerely,<br/>Sam Okonkwo</p>
      </div>
      <div style={css("display:flex;gap:10px")}>
        <button style={css("flex:1;padding:17px;border-radius:14px;border:none;background:#2B3AA8;color:#fff;font:700 17px 'Atkinson Hyperlegible',sans-serif;cursor:pointer")}>Export PDF</button>
        <button style={css("flex:1;padding:17px;border-radius:14px;border:2px solid #14181F;background:#fff;color:#14181F;font:700 17px 'Atkinson Hyperlegible',sans-serif;cursor:pointer")}>Edit text</button>
      </div>
      <p style={css("margin:0;font:400 14px/1.45 'Atkinson Hyperlegible',sans-serif;color:#4A5162")}>A template you send yourself. WorkLaw does not represent you and cannot send this on your behalf.</p>
    </div>
  );

  const Strength = () => (
    <div style={css("padding:6px 22px 34px;display:flex;flex-direction:column;gap:18px")}>
      <button onClick={nav('home')} style={css("align-self:flex-start;background:none;border:none;padding:6px 0;font:700 16px 'Atkinson Hyperlegible',sans-serif;color:#2B3AA8;cursor:pointer")}>← Dashboard</button>
      <h1 style={css("margin:0;font:700 26px/1.2 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>What makes your case</h1>
      <div style={css("display:flex;flex-direction:column;gap:12px")}>
        {FACTORS.map((f, i) =>
          <div key={i} style={css("padding:16px;border-radius:14px;border:2px solid #14181F;background:#fff")}>
            <div style={css("display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px")}>
              <span style={css("font:700 17px 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>{f.name}</span>
              <span style={css('padding:5px 10px;border-radius:8px;background:#fff;border:2px solid ' + f.color + ";font:700 12px 'IBM Plex Mono',monospace;color:" + f.color)}>{f.status}</span>
            </div>
            <div style={css("height:12px;border-radius:6px;background:rgba(20,24,31,.12);overflow:hidden;margin-bottom:8px")}>
              <div style={css('height:100%;width:' + f.pct + '%;background:' + f.color)}></div>
            </div>
            <p style={css("margin:0;font:400 15px/1.45 'Atkinson Hyperlegible',sans-serif;color:#3A4150")}>{f.note}</p>
          </div>
        )}
      </div>
      <div style={css("padding:18px;border-radius:16px;background:#FFE7EC;border:2px solid #14181F")}>
        <p style={css("margin:0 0 6px;font:700 17px 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>Deadline watch</p>
        <p style={css("margin:0;font:400 16px/1.45 'Atkinson Hyperlegible',sans-serif;color:#3A4150")}>Federal wage claims generally must be filed within 2 years (3 if willful). California allows 3 years. Your earliest logged hours age out in <strong>Mar 2029</strong>.</p>
      </div>
    </div>
  );

  const RightsLib = () => (
    <div style={css("padding:6px 22px 34px;display:flex;flex-direction:column;gap:16px")}>
      <h1 style={css("margin:0;font:700 26px 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>Rights library</h1>
      <p style={css("margin:0;font:400 16px/1.45 'Atkinson Hyperlegible',sans-serif;color:#4A5162")}>Filtered to {locationLabel}. County rules shown where they beat the state.</p>
      <div style={css("display:flex;flex-direction:column;gap:12px")}>
        {RIGHTS.map((r, i) =>
          <div key={i} style={css("padding:18px;border-radius:16px;border:2px solid #14181F;background:#fff")}>
            <p style={css("margin:0 0 4px;font:600 13px 'IBM Plex Mono',monospace;color:#4A5162;letter-spacing:.04em")}>{r.kicker}</p>
            <p style={css("margin:0 0 8px;font:700 19px/1.25 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>{r.title}</p>
            <p style={css("margin:0 0 12px;font:400 16px/1.5 'Atkinson Hyperlegible',sans-serif;color:#3A4150")}>{r.body}</p>
            <div style={css("display:flex;gap:8px;flex-wrap:wrap")}>
              <span style={css("padding:7px 11px;border-radius:8px;background:#EEF1FF;font:600 13px 'IBM Plex Mono',monospace;color:#1B2778")}>{r.cite}</span>
              <span style={css('padding:7px 11px;border-radius:8px;background:' + r.tone + ";border:2px solid #14181F;font:600 13px 'IBM Plex Mono',monospace;color:#14181F")}>{r.scope}</span>
            </div>
          </div>
        )}
      </div>
    </div>
  );

  const Lawyers = () => (
    <div style={css("padding:6px 22px 34px;display:flex;flex-direction:column;gap:16px")}>
      <h1 style={css("margin:0;font:700 26px/1.2 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>Talk to a real attorney</h1>
      <p style={css("margin:0;font:400 16px/1.45 'Atkinson Hyperlegible',sans-serif;color:#4A5162")}>Licensed in California, practicing in {countyShort}. WorkLaw takes no referral fee.</p>
      <div style={css("padding:16px;border-radius:14px;background:#E8F6EE;border:2px solid #14181F")}>
        <p style={css("margin:0;font:400 16px/1.45 'Atkinson Hyperlegible',sans-serif;color:#25302B")}>Your case file — timeline, documents, and the exemption analysis — exports as one PDF you control.</p>
      </div>
      <div style={css("display:flex;flex-direction:column;gap:12px")}>
        {LAWYERS.map((l, i) =>
          <div key={i} style={css("padding:18px;border-radius:16px;border:2px solid #14181F;background:#fff;display:flex;flex-direction:column;gap:8px")}>
            <div style={css("display:flex;justify-content:space-between;align-items:baseline;gap:10px")}>
              <span style={css("font:700 19px 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>{l.name}</span>
              <span style={css("padding:6px 10px;border-radius:8px;background:#E8F6EE;border:2px solid #1F8A4C;font:700 13px 'IBM Plex Mono',monospace;color:#136B3C")}>{l.match}</span>
            </div>
            <p style={css("margin:0;font:400 16px/1.45 'Atkinson Hyperlegible',sans-serif;color:#3A4150")}>{l.detail}</p>
            <div style={css("display:flex;gap:8px;flex-wrap:wrap")}>
              <span style={css("padding:7px 11px;border-radius:8px;background:#F0EDE5;font:600 13px 'IBM Plex Mono',monospace;color:#14181F")}>{l.fee}</span>
              <span style={css("padding:7px 11px;border-radius:8px;background:#F0EDE5;font:600 13px 'IBM Plex Mono',monospace;color:#14181F")}>{l.langs}</span>
            </div>
            <button style={css("margin-top:4px;padding:15px;border-radius:12px;border:none;background:#2B3AA8;color:#fff;font:700 17px 'Atkinson Hyperlegible',sans-serif;cursor:pointer")}>Send case file & request consult</button>
          </div>
        )}
      </div>
    </div>
  );

  const SCREENS = {
    onboarding: Onboarding, home: HomeScreen, chat: Chat, wizard: Wizard, log: Log,
    doc: Doc, letter: Letter, strength: Strength, rights: RightsLib, lawyers: Lawyers
  };
  const Current = SCREENS[screen] || HomeScreen;

  const altHome = screen === 'home' ? homeMode : null;
  const screenBg = altHome === 'action' ? '#2B3AA8' : altHome === 'plain' ? '#FFFFFF' : '#FFFDF8';
  const statusColor = altHome === 'action' ? '#fff' : '#14181F';

  return (
    <div className="device">
      <div className="screen" style={css('background:' + screenBg)}>
        <div className="statusbar" style={css('color:' + statusColor)}>
          <span>9:41</span><span style={css("letter-spacing:2px")}>▮▮▮ ᯤ ▰</span>
        </div>
        <div className="scrollarea">
          <Current />
        </div>
        {showTabs &&
          <div style={css("flex:none;border-top:2px solid rgba(20,24,31,.14);background:#FFFDF8;padding:10px 12px 26px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px")}>
            {TAB_DEFS.map(([k, icon, label]) =>
              <button key={k} onClick={nav(k)} style={css('display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px;border-radius:12px;border:2px solid ' + (screen === k ? '#14181F' : 'transparent') + ';background:' + (screen === k ? '#FFF4D6' : 'transparent') + ';color:#14181F;cursor:pointer;min-height:56px')}>
                <span style={css("font:700 19px 'IBM Plex Mono',monospace")}>{icon}</span>
                <span style={css("font:700 12px 'Atkinson Hyperlegible',sans-serif")}>{label}</span>
              </button>
            )}
          </div>
        }
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
