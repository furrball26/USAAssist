// Base for fetching the content/ dataset. Empty = same-origin (GitHub Pages / local).
// On worklaw.app the Vercel shell sets window.CONTENT_BASE to a jsDelivr URL pinned to the commit.
const CONTENT_BASE = (typeof window !== 'undefined' && window.CONTENT_BASE) || '';

function topicKicker(topic){
  const p = String(topic || '').split('.')[0];
  const m = { overtime:'OVERTIME', minimumWage:'MINIMUM WAGE', discrimination:'DISCRIMINATION',
    disability:'DISABILITY · ADA', retaliation:'RETALIATION', payDiscussion:'PAY TRANSPARENCY',
    payTransparency:'PAY TRANSPARENCY', deadlines:'DEADLINES', leave:'LEAVE', severance:'SEVERANCE',
    wages:'WAGES', termination:'TERMINATION', compensation:'COMPENSATION' };
  return m[p] || p.replace(/([A-Z])/g, ' $1').replace(/^./, c => c.toUpperCase()).toUpperCase();
}
function factValStr(v){ return Array.isArray(v) ? v.join(', ') : (v == null ? '' : String(v)); }
function factByTopic(facts, topic){ return (facts || []).find(f => f.topic === topic); }
function factsByPrefix(facts, prefix){ return (facts || []).filter(f => String(f.topic || '').split('.')[0] === prefix); }
// First matching fact across a list of candidate topic names, in priority order (varies by state).
function stateFactFor(facts, topics){ for (const t of topics) { const f = factByTopic(facts, t); if (f) return f; } return null; }

// Which deadline topics matter most for a given issue type, in priority order.
// Falls back to the first deadline fact available so something always surfaces.
function deadlineKeywordsFor(issueKey){
  switch (issueKey) {
    case 'wage': return ['wageclaim', 'equalpayact'];
    case 'harassment': return ['eeoccharge', 'discriminationcomplaint', 'fehacomplaint'];
    case 'discrimination': return ['eeoccharge', 'discriminationcomplaint', 'fehacomplaint'];
    case 'termination': return ['eeoccharge', 'discriminationcomplaint', 'fehacomplaint', 'wageclaim'];
    default: return [];
  }
}
function pickDeadlineFact(facts, issueKey){
  const dl = factsByPrefix(facts, 'deadlines');
  if (!dl.length) return null;
  for (const kw of deadlineKeywordsFor(issueKey)) {
    const hit = dl.find(f => String(f.topic || '').toLowerCase().includes(kw));
    if (hit) return hit;
  }
  return dl[0];
}

/* Parse a CSS declaration string into a React style object.
   Lets us reuse the design's exact inline-style strings verbatim. */
function css(str){
  const out = {};
  if(!str) return out;
  str.split(';').forEach(decl => {
    const i = decl.indexOf(':');
    if(i === -1) return;
    const rawProp = decl.slice(0, i).trim();
    const value = decl.slice(i + 1).trim();
    if(!rawProp || value === '') return;
    const prop = rawProp.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
    out[prop] = value;
  });
  return out;
}

// localStorage-backed case, so a case survives reload (single blob, best-effort).
const STORE_KEY = 'worklaw.case.v2';
function loadCase(){
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveCase(obj){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(obj)); } catch(e){}
}
function daysAgo(iso){
  if(!iso) return 0;
  const ms = Date.now() - new Date(iso).getTime();
  return isNaN(ms) ? 0 : Math.max(0, Math.floor(ms / 86400000));
}
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function stamp(d){
  d = d || new Date();
  let h = d.getHours(); const ap = h < 12 ? 'AM' : 'PM'; h = h % 12 || 12;
  const m = String(d.getMinutes()).padStart(2,'0');
  return MONTHS[d.getMonth()].toUpperCase() + ' ' + d.getDate() + ', ' + d.getFullYear() + ' · ' + h + ':' + m + ' ' + ap;
}
function money(n){ return '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 }); }
// A short, stable case number derived from the case-open date (no fake persona).
function caseNo(iso){
  const d = iso ? new Date(iso) : new Date();
  const yy = String(d.getFullYear()).slice(2);
  const doy = Math.ceil((d - new Date(d.getFullYear(),0,0)) / 86400000);
  return yy + '-' + String(doy).padStart(3,'0');
}

// Case strength derived purely from the evidence the user has actually logged.
function caseStrength(entries){
  entries = entries || [];
  const n = entries.length;
  const by = {}; entries.forEach(e => { by[e.tag] = (by[e.tag] || 0) + 1; });
  const clamp = v => Math.max(0, Math.min(100, Math.round(v)));
  const dim = (name, count, base, per, has, none) => {
    const pct = count ? clamp(base + count * per) : 12;
    return { name, pct, note: count ? has(count) : none };
  };
  const factors = [
    dim('Written records', n, 22, 16, c => c + ' timestamped ' + (c === 1 ? 'entry' : 'entries') + ' in your log.', 'No entries yet — start logging what happened, with dates.'),
    dim('Documents & pay records', by['Records'] || 0, 40, 20, c => c + ' document ' + (c === 1 ? 'record' : 'records') + ' saved.', 'No pay stubs, contracts or records saved yet.'),
    dim('Witnesses', by['Witness'] || 0, 35, 25, c => c + ' witness ' + (c === 1 ? 'identified' : 'identified') + '.', 'No witnesses identified yet.'),
    dim('Employer statements', by['Statement'] || 0, 45, 20, c => c + ' statement ' + (c === 1 ? 'recorded' : 'recorded') + '.', 'No manager or employer statements logged yet.'),
  ];
  factors.forEach(f => {
    f.color = f.pct >= 65 ? '#136B3C' : f.pct >= 40 ? '#8A5A00' : '#B3264F';
    f.status = f.pct >= 65 ? 'STRONG' : f.pct >= 40 ? 'PARTIAL' : 'THIN';
  });
  const score = Math.round(factors.reduce((s, f) => s + f.pct, 0) / factors.length);
  const label = n === 0 ? 'Not started' : score < 35 ? 'Early' : score < 55 ? 'Building' : score < 75 ? 'Moderate to strong' : 'Strong';
  return { factors, score, label, count: n };
}

const MONTHS_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function fmtDate(d){ d = d || new Date(); return MONTHS_FULL[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear(); }

// Which letter templates an issue offers. Wage claims get two, in order:
// confirm your classification first, then demand unpaid wages.
const LETTER_LABELS = { 'classification-request':'Classification request', 'wage-demand':'Wage demand', 'complaint':'Complaint letter', 'records-request':'Records request' };
function letterKindsFor(issueKey, cfgLetterKind){
  if (issueKey === 'wage') return ['classification-request', 'wage-demand'];
  return [cfgLetterKind || 'records-request'];
}

// Where a given step actually leads, per-step — not a single issue-level letterKind
// check that would send every step (including "log the incident") to the Letter screen.
function stepTarget(cfg, idx){
  const screen = (cfg.stepScreens && cfg.stepScreens[idx]) || cfg.primaryTool;
  const letterType = (cfg.stepLetterTypes && cfg.stepLetterTypes[idx]) || null;
  return { screen, letterType };
}

// Generate a self-send letter from the user's real inputs (no fabricated persona).
function buildLetter(ctx){
  const name = (ctx.youName || '').trim() || '[Your name]';
  const emp = (ctx.employerName || '').trim() || '[Employer name]';
  const date = fmtDate(new Date());
  const fed = (ctx.federal && ctx.federal.facts) || [];
  const st = (ctx.stateData && ctx.stateData.facts) || [];
  const cite = (arr, topic, fallback) => { const f = factByTopic(arr, topic); return (f && f.citation) || fallback; };
  const kind = ctx.kind || 'records-request';

  if (kind === 'classification-request') {
    const subject = 'Request for my FLSA overtime classification';
    const body = date + '\n\n' + emp + '\nAttn: Human Resources / Payroll\n\nRe: ' + subject + '\n\nTo whom it may concern:\n\n' +
      'I am requesting, in writing, the following about my position:\n\n' +
      '1. Whether I am classified as exempt or non-exempt from overtime under the federal Fair Labor Standards Act (29 U.S.C. §§ 201 et seq.).\n' +
      '2. If I am classified as exempt, which exemption the company relies on (for example: executive, administrative, professional, computer, or outside sales) and the basis for it.\n' +
      '3. A copy of the written job description and the job duties the company relies on for that classification.\n\n' +
      'My classification determines whether I am owed overtime for hours worked over 40 in a workweek. Under the FLSA, exempt status turns on my actual salary and job duties, not my job title (29 C.F.R. § 541.2). Please respond in writing within 14 days.\n\nSincerely,\n' + name;
    return { title: 'Overtime classification request', subject, body };
  }

  if (kind === 'wage-demand') {
    const fedCite = cite(fed, 'overtime.basicRule', '29 U.S.C. § 207');
    const stOT = factsByPrefix(st, 'overtime')[0];
    const stFollowsFederalOnly = !!(stOT && typeof stOT.value === 'string' && /^follows federal flsa/i.test(stOT.value.trim()));
    const stClause = (stOT && stOT.citation && !stFollowsFederalOnly)
      ? ' ' + ctx.stateSel + ' law (' + stOT.citation + ') provides additional overtime protection that may increase what I am owed.'
      : '';
    const hrs = ctx.unpaidHours > 0 ? ctx.unpaidHours : '[number]';
    const amountLine = ctx.owedEstimate > 0
      ? 'Based on my regular rate of ' + money(ctx.rateNum) + ' per hour, the unpaid overtime premium totals approximately ' + money(ctx.owedEstimate) + '.'
      : 'I request payment of the overtime premium owed for these hours at one-and-one-half times my regular rate of pay.';
    const subject = 'Demand for unpaid overtime wages';
    const body = date + '\n\n' + emp + '\nAttn: Payroll / Human Resources\n\nRe: ' + subject + '\n\nTo whom it may concern:\n\n' +
      'I am writing to request payment of overtime wages I earned and was not paid. My records show ' + hrs + ' hours worked beyond 40 in a workweek that were not paid at the required overtime rate.\n\n' +
      'Under the federal Fair Labor Standards Act (' + fedCite + '), these hours must be paid at one-and-one-half times my regular rate of pay.' + stClause + '\n\n' +
      amountLine + ' I request payment within 14 days of the date of this letter. Please contact me to arrange payment.\n\nSincerely,\n' + name;
    return { title: 'Wage demand letter', subject, body };
  }

  if (kind === 'complaint') {
    const isHarass = ctx.issueKey === 'harassment';
    const subject = 'Formal complaint of workplace ' + (isHarass ? 'harassment' : 'discrimination');
    const dates = (ctx.entries || []).slice(0, 5).map(e => e.date).filter(Boolean);
    const list = dates.length ? '\n\nDocumented incidents:\n' + dates.map(d => '• ' + d).join('\n') : '';
    const stCite = cite(st, 'discrimination.coverage', cite(st, 'discrimination.protectedClasses', ''));
    const stClause = stCite ? ' and ' + ctx.stateSel + ' law (' + stCite + ')' : '';
    const body = date + '\n\n' + emp + '\nAttn: Human Resources\n\nRe: ' + subject + '\n\nTo whom it may concern:\n\n' +
      'I am formally reporting conduct at work that I believe violates Title VII of the Civil Rights Act of 1964' + stClause + '. I am asking that the conduct stop and that the company promptly and impartially investigate.' + list + '\n\n' +
      'The law prohibits retaliation against me for making this good-faith complaint. I ask that this letter be placed in my personnel file.\n\nSincerely,\n' + name;
    return { title: 'Complaint letter', subject, body };
  }

  // records-request (termination, document review, or generic)
  const subject = 'Request for personnel file and pay records';
  const body = date + '\n\n' + emp + '\nAttn: Human Resources\n\nRe: ' + subject + '\n\nTo whom it may concern:\n\n' +
    'I request a complete copy of my personnel file, including performance records, disciplinary records, time records, and all final pay records. Many states require an employer to provide these within a set period after a written request.\n\n' +
    'Please provide the records in writing within the time required by ' + ctx.stateSel + ' law. I am making this request to keep an accurate record of my employment.\n\nSincerely,\n' + name;
  return { title: 'Records request letter', subject, body };
}

// Build a portable case-file summary from the user's real inputs.
function buildCaseFile(ctx){
  const s = ctx.strength || { label: 'Not started', factors: [] };
  const lines = [];
  lines.push('WORKLAW CASE FILE');
  lines.push('Generated ' + fmtDate(new Date()));
  lines.push('');
  lines.push('Name: ' + (ctx.youName || '[not provided]'));
  lines.push('Employer: ' + (ctx.employerName || '[not provided]'));
  lines.push('Location: ' + ctx.locationLabel);
  lines.push('Issue: ' + (ctx.issue || '[not selected]'));
  lines.push('Case opened: ' + fmtDate(new Date(ctx.caseOpened)));
  lines.push('Case strength: ' + s.label + ' (' + s.score + '/100)');
  if (ctx.unpaidHours > 0) lines.push('Unpaid hours logged: ' + ctx.unpaidHours);
  if (ctx.owedEstimate > 0) lines.push('Estimated overtime owed: ' + money(ctx.owedEstimate));
  lines.push('');
  lines.push('EVIDENCE LOG (' + (ctx.entries || []).length + ' entries)');
  (ctx.entries || []).forEach(e => {
    lines.push('• [' + e.tag + '] ' + e.date + ' — ' + e.title + (e.hours ? ' (' + e.hours + ' hrs)' : ''));
    if (e.body) lines.push('    ' + e.body);
  });
  if (!(ctx.entries || []).length) lines.push('• (no entries logged yet)');
  lines.push('');
  lines.push('This case file is legal information the worker compiled themselves. It is not legal advice.');
  return lines.join('\n');
}

// Real export: open a clean print window (Save as PDF); fall back to a .txt download.
function printLetter(subject, text){
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  try {
    const w = window.open('', '_blank');
    if (!w) throw new Error('popup blocked');
    w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>' + esc(subject) +
      '</title><style>body{font:15px/1.7 Georgia,serif;color:#111;max-width:640px;margin:48px auto;padding:0 24px;white-space:pre-wrap}@media print{body{margin:0}}</style></head><body>' +
      esc(text) + '</body></html>');
    w.document.close(); w.focus();
    setTimeout(() => { try { w.print(); } catch(e){} }, 300);
  } catch(e){
    try {
      const blob = new Blob([text], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = (subject || 'letter').replace(/[^a-z0-9]+/gi, '-').toLowerCase() + '.txt';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } catch(_){}
  }
}

  const factCard = (f, i, scopeLabel, scopeTone) => (
    <div key={scopeLabel + i} style={css("padding:18px;border-radius:16px;border:2px solid #14181F;background:#fff")}>
      <p style={css("margin:0 0 6px;font:600 13px 'IBM Plex Mono',monospace;color:#4A5162;letter-spacing:.04em")}>{topicKicker(f.topic)}</p>
      <p style={css("margin:0 0 12px;font:400 16px/1.5 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>{f.summary}</p>
      <div style={css("display:flex;gap:8px;flex-wrap:wrap;align-items:center")}>
        {f.citation ? <span style={css("padding:7px 11px;border-radius:8px;background:#EEF1FF;font:600 13px 'IBM Plex Mono',monospace;color:#1B2778")}>{f.citation}</span> : null}
        {f.sourceUrl ? <a href={f.sourceUrl} target="_blank" rel="noopener" style={css("padding:7px 11px;border-radius:8px;background:#fff;border:2px solid #2B3AA8;font:600 13px 'IBM Plex Mono',monospace;color:#2B3AA8;text-decoration:none")}>Source ↗</a> : null}
        <span style={css('padding:7px 11px;border-radius:8px;background:' + scopeTone + ";border:2px solid #14181F;font:600 13px 'IBM Plex Mono',monospace;color:#14181F")}>{scopeLabel}</span>
      </div>
    </div>
  );

  const RightsLib = () => {
    const stName = stateSel;
    const stAbbr = US_STATE_ABBR[stName] || '';
    const fedFacts = (federal && federal.facts) || [];
    const stFacts = (stateData && stateData.facts) || [];
    const stReviewed = !!(stateData && stateData.reviewed === true);
    return (
      <div style={css("padding:6px 22px 34px;display:flex;flex-direction:column;gap:16px")}>
        <h1 style={css("margin:0;font:700 26px 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>Rights library</h1>
        <p style={css("margin:0;font:400 16px/1.45 'Atkinson Hyperlegible',sans-serif;color:#4A5162")}>Federal protections apply everywhere; {stName} rules are layered on top. Each item links to its official source.</p>

        {contentErr ? <div style={css("padding:16px;border-radius:14px;background:#FFE7EC;border:2px solid #14181F")}><p style={css("margin:0;font:400 15px/1.45 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>Couldn’t load the rights dataset. Check your connection and reopen.</p></div> : null}
        {!federal && !contentErr ? <p style={css("margin:0;font:400 15px 'Atkinson Hyperlegible',sans-serif;color:#4A5162")}>Loading…</p> : null}

        {stateData && !stReviewed ?
          <div style={css("padding:16px 18px;border-radius:14px;background:#FFF4D6;border:2px solid #14181F")}>
            <p style={css("margin:0 0 4px;font:700 15px 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>Draft — {stName} guidance is pending attorney review</p>
            <p style={css("margin:0;font:400 14px/1.45 'Atkinson Hyperlegible',sans-serif;color:#3A4150")}>These state items are compiled from official sources but not yet verified by counsel. The federal protections below apply nationwide.</p>
          </div> : null}
        {stateData === undefined ? <p style={css("margin:0;font:400 15px 'Atkinson Hyperlegible',sans-serif;color:#4A5162")}>Loading {stName} rules…</p> : null}

        {stFacts.length ?
          <div style={css("display:flex;flex-direction:column;gap:12px")}>
            <p style={css("margin:2px 0 0;font:700 15px 'Atkinson Hyperlegible',sans-serif;color:#14181F;letter-spacing:.02em")}>{stName.toUpperCase()}{stReviewed ? '' : ' (DRAFT)'}</p>
            {stFacts.map((f, i) => factCard(f, i, stAbbr || stName.toUpperCase(), '#EEF1FF'))}
          </div> : null}

        {fedFacts.length ?
          <div style={css("display:flex;flex-direction:column;gap:12px")}>
            <p style={css("margin:6px 0 0;font:700 15px 'Atkinson Hyperlegible',sans-serif;color:#14181F;letter-spacing:.02em")}>FEDERAL — APPLIES NATIONWIDE</p>
            {fedFacts.map((f, i) => factCard(f, i, 'FEDERAL', '#F0EDE5'))}
          </div> : null}
        <p style={css("margin:4px 0 0;font:400 14px/1.45 'Atkinson Hyperlegible',sans-serif;color:#4A5162")}>This is legal information for {stName}, not legal advice, and laws change. Confirm anything important with an attorney.</p>
      </div>
    );
  };

  const Lawyers = () => (
    <div style={css("padding:6px 22px 34px;display:flex;flex-direction:column;gap:16px")}>
      <h1 style={css("margin:0;font:700 26px/1.2 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>Talk to a real attorney</h1>
      <p style={css("margin:0;font:400 16px/1.45 'Atkinson Hyperlegible',sans-serif;color:#4A5162")}>Attorneys licensed in {stateSel}, near {countyShort}. WorkLaw takes no referral fee.</p>
      {(() => {
        const ag = (stateData && stateData.agencies) || {};
        const links = [];
        if (ag.wageHour && ag.wageHour.url) links.push(['Wage & hour — ' + (ag.wageHour.name || stateSel), ag.wageHour.url]);
        if (ag.discrimination && ag.discrimination.url) links.push(['Discrimination — ' + (ag.discrimination.name || stateSel), ag.discrimination.url]);
        links.push(['Federal — EEOC (discrimination)', 'https://www.eeoc.gov/filing-charge-discrimination']);
        links.push(['Federal — U.S. DOL Wage & Hour', 'https://www.dol.gov/agencies/whd/contact/local-offices']);
        return (
          <div style={css("padding:16px 18px;border-radius:14px;background:#E8F6EE;border:2px solid #14181F;display:flex;flex-direction:column;gap:8px")}>
            <p style={css("margin:0;font:700 16px 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>File directly with the enforcing agencies — free</p>
            <p style={css("margin:0 0 2px;font:400 15px/1.45 'Atkinson Hyperlegible',sans-serif;color:#25302B")}>You can bring a complaint to the government agencies that enforce these laws in {stateSel}, at no cost:</p>
            {links.map(([label, url], i) => <a key={i} href={url} target="_blank" rel="noopener" style={css("font:700 15px 'Atkinson Hyperlegible',sans-serif;color:#136B3C;text-decoration:underline")}>{label} ↗</a>)}
          </div>
        );
      })()}
      <div style={css("padding:16px;border-radius:14px;background:#FFF4D6;border:2px solid #14181F")}>
        <p style={css("margin:0;font:400 15px/1.45 'Atkinson Hyperlegible',sans-serif;color:#3A4150")}>The attorney listings below are <strong>sample examples</strong> showing how a referral would work — not real firms or endorsements. A production version would connect to a licensed-attorney directory for {stateSel}.</p>
      </div>
      <div style={css("padding:16px;border-radius:14px;background:#E8F6EE;border:2px solid #14181F")}>
        <p style={css("margin:0;font:400 16px/1.45 'Atkinson Hyperlegible',sans-serif;color:#25302B")}>Your case file — timeline, documents, and the exemption analysis — exports as one PDF you control.</p>
      </div>
      <div style={css("display:flex;flex-direction:column;gap:12px")}>
        {LAWYERS.map((l, i) =>
          <div key={i} style={css("padding:18px;border-radius:16px;border:2px solid #14181F;background:#fff;display:flex;flex-direction:column;gap:8px")}>
            <div style={css("display:flex;justify-content:space-between;align-items:baseline;gap:10px")}>
              <span style={css("font:700 19px 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>{l.name}</span>
              <span style={css("padding:6px 10px;border-radius:8px;background:#E8F6EE;border:2px solid #1F8A4C;font:700 13px 'IBM Plex Mono',monospace;color:#136B3C")}>{l.match}</span>
            </div>
            <p style={css("margin:0;font:400 16px/1.45 'Atkinson Hyperlegible',sans-serif;color:#3A4150")}>{l.detail}</p>
            <div style={css("display:flex;gap:8px;flex-wrap:wrap")}>
              <span style={css("padding:7px 11px;border-radius:8px;background:#F0EDE5;font:600 13px 'IBM Plex Mono',monospace;color:#14181F")}>{l.fee}</span>
              <span style={css("padding:7px 11px;border-radius:8px;background:#F0EDE5;font:600 13px 'IBM Plex Mono',monospace;color:#14181F")}>{l.langs}</span>
            </div>
            <button onClick={() => { printLetter('WorkLaw case file', buildCaseFile({ youName, employerName, locationLabel, issue, caseOpened, strength, unpaidHours, owedEstimate, entries })); setConsultSent(l.name); }} style={css("margin-top:4px;padding:15px;border-radius:12px;border:none;background:#2B3AA8;color:#fff;font:700 17px 'Atkinson Hyperlegible',sans-serif;cursor:pointer")}>Export case file for this firm</button>
            {consultSent === l.name &&
              <p style={css("margin:2px 0 0;font:400 14px/1.45 'Atkinson Hyperlegible',sans-serif;color:#136B3C")}>Your case file opened in a new tab — save it as PDF and attach it when you contact a firm. (This is a sample listing; no message was sent.)</p>
            }
          </div>
        )}
      </div>
    </div>
  );

  const SCREENS = {
    onboarding: Onboarding, home: HomeScreen, chat: Chat, wizard: Wizard, log: Log,
    doc: Doc, letter: Letter, strength: Strength, rights: RightsLib, lawyers: Lawyers
  };
  const Current = SCREENS[screen] || HomeScreen;

  const altHome = screen === 'home' ? homeMode : null;
  const screenBg = altHome === 'action' ? '#2B3AA8' : altHome === 'plain' ? '#FFFFFF' : '#FFFDF8';
  const statusColor = altHome === 'action' ? '#fff' : '#14181F';

  return (
    <div className="device">
      <div className="screen" style={css('background:' + screenBg)}>
        <div className="statusbar" style={css('color:' + statusColor)}>
          <span>9:41</span><span style={css("letter-spacing:2px")}>▮▮▮ ᯤ ▰</span>
        </div>
        <div className="scrollarea">
          {/* Call the screen as a function (not <Current/>) so it inlines into this
              stable tree instead of remounting on every keystroke — remounting was
              destroying the chat/onboarding/letter inputs and jumping scroll. */}
          {Current()}
        </div>
        {showTabs &&
          <div style={css("flex:none;border-top:2px solid rgba(20,24,31,.14);background:#FFFDF8;padding:10px 12px 26px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px")}>
            {TAB_DEFS.map(([k, icon, label]) =>
              <button key={k} onClick={nav(k)} style={css('display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px;border-radius:12px;border:2px solid ' + (screen === k ? '#14181F' : 'transparent') + ';background:' + (screen === k ? '#FFF4D6' : 'transparent') + ';color:#14181F;cursor:pointer;min-height:56px')}>
                <span style={css("font:700 19px 'IBM Plex Mono',monospace")}>{icon}</span>
                <span style={css("font:700 12px 'Atkinson Hyperlegible',sans-serif")}>{label}</span>
              </button>
            )}
          </div>
        }
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
