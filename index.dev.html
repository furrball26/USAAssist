<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect, useCallback } = React;

// Base for fetching the content/ dataset. Empty = same-origin (GitHub Pages / local).
// On worklaw.app the Vercel shell sets window.CONTENT_BASE to a jsDelivr URL pinned to the commit.
const CONTENT_BASE = (typeof window !== 'undefined' && window.CONTENT_BASE)
  || (typeof document !== 'undefined' && document.querySelector('meta[name="worklaw-content-base"]') && document.querySelector('meta[name="worklaw-content-base"]').getAttribute('content'))
  || '';
// SHA-pinned fallback source for the same content/ path, tried once if the primary
// CONTENT_BASE fetch fails (network error or non-2xx) before surfacing the error state.
// Bump this SHA as part of routine maintenance so it stays a recent known-good commit.
const CONTENT_FALLBACK_BASE = 'https://raw.githubusercontent.com/furrball26/USAAssist/2394a3fd80b0102915e76d7c98729ecb87cc825c/';
function fetchContentJson(path){
  return fetch(CONTENT_BASE + path)
    .then(r => { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
    .catch(() => fetch(CONTENT_FALLBACK_BASE + path).then(r => { if (!r.ok) throw new Error('http ' + r.status); return r.json(); }));
}

function topicKicker(topic){
  const p = String(topic || '').split('.')[0];
  const m = { overtime:'OVERTIME', minimumWage:'MINIMUM WAGE', discrimination:'DISCRIMINATION',
    disability:'DISABILITY · ADA', retaliation:'RETALIATION', payDiscussion:'PAY TRANSPARENCY',
    payTransparency:'PAY TRANSPARENCY', deadlines:'DEADLINES', leave:'LEAVE', severance:'SEVERANCE',
    wages:'WAGES', termination:'TERMINATION', compensation:'COMPENSATION' };
  return m[p] || p.replace(/([A-Z])/g, ' $1').replace(/^./, c => c.toUpperCase()).toUpperCase();
}
// Only ever render an https:// URL as an href — guards against a malformed/malicious
// javascript:, data:, or other scheme reaching an <a href> from content data.
function safeUrl(u){ return (typeof u === 'string' && /^https:\/\//i.test(u)) ? u : null; }
function factValStr(v){ return Array.isArray(v) ? v.join(', ') : (v == null ? '' : String(v)); }
function factByTopic(facts, topic){ return (facts || []).find(f => f.topic === topic); }
function factsByPrefix(facts, prefix){ return (facts || []).filter(f => String(f.topic || '').split('.')[0] === prefix); }
// First matching fact across a list of candidate topic names, in priority order (varies by state).
function stateFactFor(facts, topics){ for (const t of topics) { const f = factByTopic(facts, t); if (f) return f; } return null; }

// True when a state's OWN "overtime.daily" fact describes a genuine day-rate or
// hours-threshold rule that is MORE protective than the plain federal "1.5x after
// 40 hrs/week, no daily overtime" rule (e.g. CA/AK's 8-hr/day rule, CO's 12-hr/day
// or 12-consecutive-hour rule, NV's 24-hour-period rule) — as opposed to a fact
// that merely restates or tracks the federal standard, worded any of many ways
// ("follows federal FLSA", "mirrors federal", "no daily overtime", "48-hr
// threshold weaker than federal", etc). Reads the fact's actual content instead of
// matching one brittle literal string, so it stays correct as content wording
// changes. Deliberately does NOT look at a state's separate, higher salary floor
// for the overtime EXEMPTION (e.g. Washington's overtime.salaryThreshold): that
// fact changes who qualifies as exempt, not the pay-rate/hours-threshold owed to
// an already-non-exempt worker for hours already worked — the only thing this
// (wage-demand) letter is about. A false "additional protection" claim with a
// real citation is worse than an occasional missed one in a document a user sends.
function stateAddsRealOvertimeProtection(overtimeFacts){
  const daily = (overtimeFacts || []).find(f => String(f.topic || '') === 'overtime.daily');
  if (!daily) return false;
  const text = String(daily.value == null ? '' : daily.value) + ' ' + String(daily.summary == null ? '' : daily.summary);
  if (/no\s+(state\s+)?(general\s+)?daily overtime\b/i.test(text)) return false;
  if (/\d+(\.\d+)?\s*(hrs?\.?|hours?)\s*(\/|per\s+)\s*(day|workday|24-?\s*hour\s*period)/i.test(text)) return true;
  if (/after\s+\d+(\.\d+)?\s*hours?\s+(worked\s+)?(in|per|each|every)\s+(a\s+|any\s+)?(day|workday|24-?\s*hour\s*period)/i.test(text)) return true;
  if (/\bdaily overtime\b/i.test(text)) return true;
  return false;
}

// Which deadline topics matter most for a given issue type, grouped into priority
// TIERS (array of arrays). Topics within the same tier are jurisdiction-equivalent —
// e.g. the federal "eeocCharge" fact and a state's own "discriminationComplaint" /
// "fehaComplaint" fact are the SAME deadline concept (the discrimination-charge
// window), just named differently per file. They must therefore compete on equal
// footing (state wins ties), not on keyword-list position, or a federal fact
// earlier in a flat list always beats the state's own same-tier fact.
// If no tier matches, pickDeadlineFact returns null rather than guessing at an
// unrelated deadline — callers fall back to the federal fact/banner.
function deadlineKeywordsFor(issueKey){
  switch (issueKey) {
    case 'wage': return [['wageclaim', 'equalpayact']];
    case 'harassment': return [['eeoccharge', 'discriminationcomplaint', 'fehacomplaint']];
    case 'discrimination': return [['eeoccharge', 'discriminationcomplaint', 'fehacomplaint']];
    case 'termination': return [['eeoccharge', 'discriminationcomplaint', 'fehacomplaint'], ['wageclaim']];
    default: return [];
  }
}
function pickDeadlineFact(facts, issueKey){
  const dl = factsByPrefix(facts, 'deadlines');
  if (!dl.length) return null;
  for (const tier of deadlineKeywordsFor(issueKey)) {
    const hit = dl.find(f => tier.some(kw => String(f.topic || '').toLowerCase().includes(kw)));
    if (hit) return hit;
  }
  return null;
}
// Resolve the single most-relevant deadline across BOTH state and federal facts.
// Tier priority is the OUTER loop so a higher-priority tier (e.g. the
// discrimination-charge window) beats a lower-priority tier in either file (e.g. a
// wage-claim deadline). WITHIN a tier the state's own fact wins over federal — a
// state's "discriminationComplaint"/"fehaComplaint" fact is that state's version of
// the federal "eeocCharge" fact, not a lesser concern, so it must not be hidden
// behind the federal fact merely because "eeoccharge" heads the topic list.
// Without tiering, `pickDeadlineFact(stF) || pickDeadlineFact(fedF)` let a low-priority
// state wage deadline suppress the operative federal discrimination-charge deadline —
// and a flat keyword-priority list let the federal charge fact suppress a state's own
// (same-tier) charge-deadline fact, disagreeing with the Case Strength screen.
function pickDeadlineFactAcross(stateFacts, fedFacts, issueKey){
  const stDl = factsByPrefix(stateFacts, 'deadlines');
  const fedDl = factsByPrefix(fedFacts, 'deadlines');
  for (const tier of deadlineKeywordsFor(issueKey)) {
    const stHit = stDl.find(f => tier.some(kw => String(f.topic || '').toLowerCase().includes(kw)));
    if (stHit) return stHit;
    const fedHit = fedDl.find(f => tier.some(kw => String(f.topic || '').toLowerCase().includes(kw)));
    if (fedHit) return fedHit;
  }
  return null;
}

// F4 — a worker fired/pushed out for reporting a safety hazard has a SEPARATE,
// much shorter federal deadline (OSHA Section 11(c) whistleblower complaint,
// 30 days — deadlines.oshaWhistleblower) than the EEOC discrimination-charge
// window (180/300 days) the termination Deadline Watch otherwise surfaces. We
// only treat a case as safety-retaliation when the ISSUE is a termination AND
// the user's own words (log entries, chat messages they typed) actually name a
// safety/hazard/OSHA/whistleblower concern — issue type alone is never enough,
// so an ordinary firing is never mislabeled as a safety complaint.
const SAFETY_RETALIATION_RE = /\b(osha|whistleblow\w*|workplace\s+safety|safety\s+(complaint|violation|hazard|concern|issue)|unsafe\s+(condition|working)|reported?\s+(a\s+|an\s+|the\s+)?(safety|hazard)|hazardous\s+condition)\b/i;
function caseTextForSafetyCheck(entries, messages){
  const entryText = (entries || []).map(e => (e.body || '') + ' ' + (e.title || '')).join(' ');
  // Only the user's own typed messages — never the AI's sample replies, which may
  // themselves use the word "safety" while discussing an unrelated topic.
  const userMsgText = (messages || []).filter(m => m.role === 'user').map(m => m.text || '').join(' ');
  return entryText + ' ' + userMsgText;
}
function isSafetyRetaliationCase(issueKey, entries, messages){
  if (issueKey !== 'termination') return false;
  return SAFETY_RETALIATION_RE.test(caseTextForSafetyCheck(entries, messages));
}

/* Parse a CSS declaration string into a React style object.
   Lets us reuse the design's exact inline-style strings verbatim. */
function css(str){
  const out = {};
  if(!str) return out;
  str.split(';').forEach(decl => {
    const i = decl.indexOf(':');
    if(i === -1) return;
    const rawProp = decl.slice(0, i).trim();
    const value = decl.slice(i + 1).trim();
    if(!rawProp || value === '') return;
    const prop = rawProp.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
    out[prop] = value;
  });
  return out;
}

// Basic, rules-based (regex keyword) clause flagging for TEXT the user pastes
// directly — honest about what it is: a simple pattern scan that runs locally in
// the browser, not a legal opinion, and it can both miss real issues and flag
// benign text. Deliberately does NOT claim to read uploaded files (PDF/DOC/etc
// parsing is out of scope here) — only text actually pasted into the textarea.
const CLAUSE_PATTERNS = [
  { title:'Release of claims', level:'READ CLOSELY', tone:'#FFE7EC', badge:'#C81E1B',
    re:/\brelease[sd]?\b[^.]{0,100}\b(claims?|causes? of action|liability)\b/i,
    plain:'Looks like a release of legal claims — you may be giving up the right to sue for things that already happened. In many states, wages you already earned generally cannot be waived by signing this.' },
  { title:'Non-disparagement', level:'NEGOTIABLE', tone:'#FFF4D6', badge:'#8A5A00',
    re:/non-?disparage|shall not (make any statement|disparage)/i,
    plain:'Looks like a non-disparagement clause. As commonly written these are broad; many states protect your ability to describe unlawful conduct you experienced, and that carve-out is sometimes missing.' },
  { title:'Non-compete / restrictive covenant', level:'READ CLOSELY', tone:'#FFE7EC', badge:'#C81E1B',
    re:/non-?compete|restrictive covenant|shall not (work for|be employed by|compete with)/i,
    plain:'Looks like a non-compete or restrictive-covenant clause. Several states ban or sharply limit these for most workers — check the Rights tab for your state before assuming it is enforceable.' },
  { title:'Arbitration / class-action waiver', level:'READ CLOSELY', tone:'#FFE7EC', badge:'#C81E1B',
    re:/\barbitrat|class action waiver|waive[sd]?[^.]{0,30}(class|collective) action/i,
    plain:'Looks like an arbitration clause or a waiver of your right to join a class or collective action. This can limit how and where you can bring a future claim.' },
  { title:'Confidentiality / non-disclosure', level:'NEGOTIABLE', tone:'#FFF4D6', badge:'#8A5A00',
    re:/confidential(ity)?|non-disclosure|\bnda\b/i,
    plain:'Looks like a confidentiality or non-disclosure clause. Check the scope — federal and some state law protect your ability to discuss your own wages and working conditions regardless of what this says.' },
  { title:'Revocation / consideration period', level:'STANDARD', tone:'#E8F6EE', badge:'#136B3C',
    re:/revocation period|revoke this agreement|(21|twenty-one) days? to consider|(7|seven) days? to revoke/i,
    plain:'Mentions a period to consider and/or revoke the agreement — common in release agreements covered by the Older Workers Benefit Protection Act. Confirm the exact number of days in your copy.' },
];
function scanClauseText(text){
  const t = String(text || '');
  if (!t.trim()) return [];
  return CLAUSE_PATTERNS.map(p => {
    const m = t.match(p.re);
    if (!m) return null;
    const idx = m.index || 0;
    const start = Math.max(0, idx - 40);
    const end = Math.min(t.length, idx + m[0].length + 40);
    let quote = t.slice(start, end).replace(/\s+/g, ' ').trim();
    if (start > 0) quote = '…' + quote;
    if (end < t.length) quote = quote + '…';
    return Object.assign({}, p, { quote });
  }).filter(Boolean);
}

// localStorage-backed case, so a case survives reload (single blob, best-effort).
const STORE_KEY = 'worklaw.case.v2';
function loadCase(){
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveCase(obj){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(obj)); } catch(e){}
}
function daysAgo(iso){
  if(!iso) return 0;
  const ms = Date.now() - new Date(iso).getTime();
  return isNaN(ms) ? 0 : Math.max(0, Math.floor(ms / 86400000));
}
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function stamp(d){
  d = d || new Date();
  let h = d.getHours(); const ap = h < 12 ? 'AM' : 'PM'; h = h % 12 || 12;
  const m = String(d.getMinutes()).padStart(2,'0');
  return MONTHS[d.getMonth()].toUpperCase() + ' ' + d.getDate() + ', ' + d.getFullYear() + ' · ' + h + ':' + m + ' ' + ap;
}
function money(n){ return '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 }); }
// FLSA's default method for converting a fixed weekly/annual salary to an hourly-
// equivalent regular rate assumes the salary covers a standard 40-hour workweek
// (29 C.F.R. § 778.113). Used only to give a SALARIED worker an owed-amount
// estimate if misclassified as exempt — the exemption wizard's whole point —
// since profile.rate (hourly) was previously never collected for Salary users,
// so owedEstimate was always 0 for the population that tool targets. Not a
// substitute for confirming the actual agreed workweek with an attorney.
function hourlyEquivFromSalary(annualSalary){
  const n = Number(annualSalary) || 0;
  return n > 0 ? n / 52 / 40 : 0;
}
// Sunday-start key for the workweek an ISO timestamp falls in, so multi-week logs
// aren't billed as if every logged hour fell inside a single ">40 hrs" workweek.
function weekStartKey(iso){
  const d = iso ? new Date(iso) : null;
  if (!d || isNaN(d.getTime())) return null;
  const sun = new Date(d);
  sun.setDate(d.getDate() - d.getDay());
  return sun.toISOString().slice(0, 10);
}
// Turn logged hours entries into an owed-amount estimate that distinguishes hours
// paid $0 (owed the full 1.5x overtime rate) from hours already paid straight-time
// but denied the overtime premium (owed only the 0.5x differential) — a ~3x
// overstatement if every entry is assumed unpaid — and reports how many distinct
// workweeks the hours span, since a multi-week log is not ">40 hours in a
// workweek" the way a single-week log is.
function computeOwedBreakdown(entries, rateNum){
  const withHours = (entries || []).filter(e => Number(e.hours) > 0);
  let unpaidHrs = 0, straightHrs = 0;
  const weeks = new Set();
  withHours.forEach(e => {
    const h = Number(e.hours) || 0;
    if (e.payStatus === 'straight') straightHrs += h; else unpaidHrs += h;
    const wk = weekStartKey(e.iso);
    if (wk) weeks.add(wk);
  });
  const totalHours = unpaidHrs + straightHrs;
  const owedEstimate = rateNum > 0 ? (unpaidHrs * rateNum * 1.5) + (straightHrs * rateNum * 0.5) : 0;
  return { totalHours, unpaidHrs, straightHrs, owedEstimate, weekCount: weeks.size || (totalHours > 0 ? 1 : 0) };
}
// A short, stable case number derived from the case-open date (no fake persona).
function caseNo(iso){
  const d = iso ? new Date(iso) : new Date();
  const yy = String(d.getFullYear()).slice(2);
  const doy = Math.ceil((d - new Date(d.getFullYear(),0,0)) / 86400000);
  return yy + '-' + String(doy).padStart(3,'0');
}

// Case strength derived purely from the evidence the user has actually logged.
function caseStrength(entries){
  entries = entries || [];
  const n = entries.length;
  const by = {}; entries.forEach(e => { by[e.tag] = (by[e.tag] || 0) + 1; });
  const clamp = v => Math.max(0, Math.min(100, Math.round(v)));
  const dim = (name, count, base, per, has, none) => {
    const pct = count ? clamp(base + count * per) : 12;
    return { name, pct, note: count ? has(count) : none };
  };
  const factors = [
    dim('Written records', n, 22, 16, c => c + ' timestamped ' + (c === 1 ? 'entry' : 'entries') + ' in your log.', 'No entries yet — start logging what happened, with dates.'),
    dim('Documents & pay records', by['Records'] || 0, 40, 20, c => c + ' document ' + (c === 1 ? 'record' : 'records') + ' saved.', 'No pay stubs, contracts or records saved yet.'),
    dim('Witnesses', by['Witness'] || 0, 35, 25, c => c + ' witness ' + (c === 1 ? 'identified' : 'identified') + '.', 'No witnesses identified yet.'),
    dim('Employer statements', by['Statement'] || 0, 45, 20, c => c + ' statement ' + (c === 1 ? 'recorded' : 'recorded') + '.', 'No manager or employer statements logged yet.'),
  ];
  factors.forEach(f => {
    f.color = f.pct >= 65 ? '#136B3C' : f.pct >= 40 ? '#8A5A00' : '#B3264F';
    f.status = f.pct >= 65 ? 'STRONG' : f.pct >= 40 ? 'PARTIAL' : 'THIN';
  });
  const score = Math.round(factors.reduce((s, f) => s + f.pct, 0) / factors.length);
  const label = n === 0 ? 'Not started' : score < 35 ? 'Early' : score < 55 ? 'Building' : score < 75 ? 'Moderate to strong' : 'Strong';
  return { factors, score, label, count: n };
}

// Which letter templates an issue offers. Wage claims get two, in order:
// confirm your classification first, then demand unpaid wages.
const LETTER_LABELS = { 'classification-request':'Classification request', 'wage-demand':'Wage demand', 'complaint':'Complaint letter', 'records-request':'Records request', 'review-time-request':'Request more time', 'accommodation-request':'Accommodation request' };
function letterKindsFor(issueKey, cfgLetterKind){
  if (issueKey === 'wage') return ['classification-request', 'wage-demand'];
  // The chat's ADA reply promises "I can draft that request from a template" for
  // any accommodation question — make that real for discrimination cases (the
  // issue bucket ADA/disability falls under; see ISSUE_LIST), not just a generic
  // Title VII complaint letter.
  if (issueKey === 'discrimination') return ['complaint', 'accommodation-request'];
  return [cfgLetterKind || 'records-request'];
}

// Where a given step actually leads, per-step — not a single issue-level letterKind
// check that would send every step (including "log the incident") to the Letter screen.
function stepTarget(cfg, idx){
  const screen = (cfg.stepScreens && cfg.stepScreens[idx]) || cfg.primaryTool;
  const letterType = (cfg.stepLetterTypes && cfg.stepLetterTypes[idx]) || null;
  return { screen, letterType };
}

// Generate a self-send letter from the user's real inputs (no fabricated persona).
function buildLetter(ctx){
  const name = (ctx.youName || '').trim() || '[Your name]';
  const emp = (ctx.employerName || '').trim() || '[Employer name]';
  const date = fmtDate(new Date());
  const fed = (ctx.federal && ctx.federal.facts) || [];
  const st = (ctx.stateData && ctx.stateData.facts) || [];
  const cite = (arr, topic, fallback) => { const f = factByTopic(arr, topic); return (f && f.citation) || fallback; };
  const kind = ctx.kind || 'records-request';

  if (kind === 'classification-request') {
    const subject = 'Request for my FLSA overtime classification';
    const body = date + '\n\n' + emp + '\nAttn: Human Resources / Payroll\n\nRe: ' + subject + '\n\nTo whom it may concern:\n\n' +
      'I am requesting, in writing, the following about my position:\n\n' +
      '1. Whether I am classified as exempt or non-exempt from overtime under the federal Fair Labor Standards Act (29 U.S.C. §§ 201 et seq.).\n' +
      '2. If I am classified as exempt, which exemption the company relies on (for example: executive, administrative, professional, computer, or outside sales) and the basis for it.\n' +
      '3. A copy of the written job description and the job duties the company relies on for that classification.\n\n' +
      'My classification determines whether I am owed overtime for hours worked over 40 in a workweek. Under the FLSA, exempt status turns on my actual salary and job duties, not my job title (29 C.F.R. § 541.2). Please respond in writing within 14 days.\n\nSincerely,\n' + name;
    return { title: 'Overtime classification request', subject, body };
  }

  if (kind === 'review-time-request') {
    const subject = 'Request for time to review before signing';
    const body = date + '\n\n' + emp + '\nAttn: Human Resources\n\nRe: ' + subject + '\n\nTo whom it may concern:\n\n' +
      'I received a document for my review and signature (for example, a severance, separation, or release agreement). I have not yet signed it.\n\n' +
      'I am requesting, in writing:\n\n' +
      '1. Confirmation of the exact deadline I have to consider and sign this document.\n' +
      '2. Confirmation of any period I have to revoke my signature after signing, if applicable.\n' +
      '3. A copy of any attachments referenced in the document (benefit summaries, release scope, etc.) that were not included.\n\n' +
      'I want to fully understand what I am giving up before I sign anything, and I am not agreeing to any deadline shorter than what the document itself provides. Please confirm these dates in writing.\n\nSincerely,\n' + name;
    return { title: 'Request for time to review', subject, body };
  }

  if (kind === 'wage-demand') {
    const fedCite = cite(fed, 'overtime.basicRule', '29 U.S.C. § 207');
    const stOTFacts = factsByPrefix(st, 'overtime');
    const stOT = stOTFacts.find(f => f.topic === 'overtime.daily') || stOTFacts[0];
    const stClause = (stOT && stOT.citation && stateAddsRealOvertimeProtection(stOTFacts))
      ? ' ' + ctx.stateSel + ' law (' + stOT.citation + ') provides additional overtime protection that may increase what I am owed.'
      : '';
    // Distinguish hours paid $0 (owed the full 1.5x rate) from hours already paid
    // straight-time but denied the overtime premium (owed only the 0.5x
    // differential — the 1.5x figure overstates that portion by 3x), and group by
    // workweek so a multi-week log isn't described as ">40 hrs in a workweek".
    const bd = computeOwedBreakdown(ctx.entries, ctx.rateNum);
    const hrs = bd.totalHours > 0 ? bd.totalHours : (ctx.unpaidHours > 0 ? ctx.unpaidHours : '[number]');
    const weekPhrase = bd.weekCount > 1 ? 'across ' + bd.weekCount + ' separate workweeks' : 'in a workweek';
    const breakdownParts = [];
    if (bd.unpaidHrs > 0) breakdownParts.push(bd.unpaidHrs + ' hours paid nothing');
    if (bd.straightHrs > 0) breakdownParts.push(bd.straightHrs + ' hours paid straight-time only, without the overtime premium');
    const breakdownLine = breakdownParts.length ? ' Of that, ' + breakdownParts.join(' and ') + '.' : '';
    const rateNote = bd.straightHrs > 0 && bd.unpaidHrs > 0
      ? ' (one-and-one-half times my regular rate for hours I was paid nothing for, plus the one-half-time differential owed on hours already paid straight-time)'
      : bd.straightHrs > 0 && bd.unpaidHrs === 0
      ? ' (the one-half-time overtime differential owed on hours already paid straight-time)'
      : ' (at one-and-one-half times my regular rate)';
    // A salaried worker's "regular rate" here is an hourly-equivalent derived from
    // their stated annual salary (see hourlyEquivFromSalary) — say so, since it's
    // an assumption (a standard 40-hour workweek, 29 C.F.R. § 778.113), not a
    // rate the employer already quoted in hourly terms.
    const salaryNote = ctx.payType === 'Salary' && ctx.rateNum > 0
      ? ' (an hourly-equivalent of my salary, assuming a standard 40-hour workweek)'
      : '';
    const amountLine = bd.owedEstimate > 0
      ? 'Based on my regular rate of ' + money(ctx.rateNum) + ' per hour' + salaryNote + ', the overtime pay owed for these hours' + rateNote + ' totals approximately ' + money(bd.owedEstimate) + '.'
      : 'I request payment for these hours at the overtime rate required by law.';
    const subject = 'Demand for unpaid overtime wages';
    const body = date + '\n\n' + emp + '\nAttn: Payroll / Human Resources\n\nRe: ' + subject + '\n\nTo whom it may concern:\n\n' +
      'I am writing to request payment of overtime wages I earned and was not paid correctly. My records show ' + hrs + ' hours worked beyond 40 hours ' + weekPhrase + ' that were not paid at the required overtime rate.' + breakdownLine + '\n\n' +
      'Under the federal Fair Labor Standards Act (' + fedCite + '), these hours must be paid at one-and-one-half times my regular rate of pay, less any straight-time amount already paid for them.' + stClause + '\n\n' +
      amountLine + ' I request payment within 14 days of the date of this letter. Please contact me to arrange payment.\n\nSincerely,\n' + name;
    return { title: 'Wage demand letter', subject, body };
  }

  if (kind === 'complaint') {
    const isHarass = ctx.issueKey === 'harassment';
    const subject = 'Formal complaint of workplace ' + (isHarass ? 'harassment' : 'discrimination');
    const dates = (ctx.entries || []).slice(0, 5).map(e => e.date).filter(Boolean);
    const list = dates.length ? '\n\nDocumented incidents:\n' + dates.map(d => '• ' + d).join('\n') : '';
    const stCite = cite(st, 'discrimination.coverage', cite(st, 'discrimination.protectedClasses', ''));
    const stClause = stCite ? ' and ' + ctx.stateSel + ' law (' + stCite + ')' : '';
    const body = date + '\n\n' + emp + '\nAttn: Human Resources\n\nRe: ' + subject + '\n\nTo whom it may concern:\n\n' +
      'I am formally reporting conduct at work that I believe violates Title VII of the Civil Rights Act of 1964' + stClause + '. I am asking that the conduct stop and that the company promptly and impartially investigate.' + list + '\n\n' +
      'The law prohibits retaliation against me for making this good-faith complaint. I ask that this letter be placed in my personnel file.\n\nSincerely,\n' + name;
    return { title: 'Complaint letter', subject, body };
  }

  if (kind === 'accommodation-request') {
    // Copy mirrors ADA_REPLY's promise in chat ("I can draft that request from a
    // template") — see letterKindsFor, which offers this kind for discrimination
    // cases so that promise is real, not just a generic Title VII complaint letter.
    const fedCite = cite(fed, 'disability.reasonableAccommodation', '42 U.S.C. § 12112');
    const stFact = stateFactFor(st, ['disability.accommodation', 'disability.reasonableAccommodation', 'disability.interactiveProcess']);
    const stClause = (stFact && stFact.citation) ? ' ' + ctx.stateSel + ' law (' + stFact.citation + ') may provide additional protection.' : '';
    const subject = 'Request for a reasonable accommodation';
    const body = date + '\n\n' + emp + '\nAttn: Human Resources\n\nRe: ' + subject + '\n\nTo whom it may concern:\n\n' +
      'I am requesting a reasonable accommodation for a disability under the Americans with Disabilities Act (' + fedCite + ').' + stClause + '\n\n' +
      'My limitation is: [describe your limitation in plain terms — no legal or medical terms required].\n' +
      'The change that would help is: [describe the accommodation you are requesting].\n\n' +
      'I understand this begins an interactive process between us to identify an effective accommodation, and I am glad to discuss options. Please confirm receipt in writing and let me know a good time to talk this week.\n\nSincerely,\n' + name;
    return { title: 'Accommodation request letter', subject, body };
  }

  // records-request (termination, document review, or generic)
  const subject = 'Request for personnel file and pay records';
  const body = date + '\n\n' + emp + '\nAttn: Human Resources\n\nRe: ' + subject + '\n\nTo whom it may concern:\n\n' +
    'I request a complete copy of my personnel file, including performance records, disciplinary records, time records, and all final pay records. Many states require an employer to provide these within a set period after a written request.\n\n' +
    'Please provide the records in writing within the time required by ' + ctx.stateSel + ' law. I am making this request to keep an accurate record of my employment.\n\nSincerely,\n' + name;
  return { title: 'Records request letter', subject, body };
}

// Build a portable case-file summary from the user's real inputs.
function buildCaseFile(ctx){
  const s = ctx.strength || { label: 'Not started', factors: [] };
  const lines = [];
  lines.push('WORKLAW CASE FILE');
  lines.push('Generated ' + fmtDate(new Date()));
  lines.push('');
  lines.push('Name: ' + (ctx.youName || '[not provided]'));
  lines.push('Employer: ' + (ctx.employerName || '[not provided]'));
  lines.push('Location: ' + ctx.locationLabel);
  lines.push('Issue: ' + (ctx.issue || '[not selected]'));
  lines.push('Case opened: ' + fmtDate(new Date(ctx.caseOpened)));
  lines.push('Case strength: ' + s.label + ' (' + s.score + '/100)');
  if (ctx.unpaidHours > 0) lines.push('Unpaid hours logged: ' + ctx.unpaidHours);
  if (ctx.owedEstimate > 0) lines.push('Estimated overtime owed: ' + money(ctx.owedEstimate));
  lines.push('');
  lines.push('EVIDENCE LOG (' + (ctx.entries || []).length + ' entries)');
  (ctx.entries || []).forEach(e => {
    lines.push('• [' + e.tag + '] ' + e.date + ' — ' + e.title + (e.hours ? ' (' + e.hours + ' hrs)' : ''));
    if (e.body) lines.push('    ' + e.body);
  });
  if (!(ctx.entries || []).length) lines.push('• (no entries logged yet)');
  lines.push('');
  lines.push('This case file is legal information the worker compiled themselves. It is not legal advice.');
  return lines.join('\n');
}

// Real export: open a clean print window (Save as PDF); fall back to a .txt
// download if the popup is blocked; returns which path was actually taken
// ('tab' | 'download' | 'failed') so callers can phrase their confirmation
// message accurately instead of always claiming "opened in a new tab".
function printLetter(subject, text){
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  try {
    const w = window.open('', '_blank');
    if (!w) throw new Error('popup blocked');
    w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>' + esc(subject) +
      '</title><style>body{font:15px/1.7 Georgia,serif;color:#111;max-width:640px;margin:48px auto;padding:0 24px;white-space:pre-wrap}@media print{body{margin:0}}</style></head><body>' +
      esc(text) + '</body></html>');
    w.document.close(); w.focus();
    setTimeout(() => { try { w.print(); } catch(e){} }, 300);
    return 'tab';
  } catch(e){
    try {
      const blob = new Blob([text], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = (subject || 'letter').replace(/[^a-z0-9]+/gi, '-').toLowerCase() + '.txt';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      return 'download';
    } catch(_){
      return 'failed';
    }
  }
}

// Sanity bounds for figures that flow into a sent wage-demand letter. These are
// soft limits — flagged with an inline warning, never silently rejected — wide
// enough to cover real high earners/long logs, but tight enough to catch an

function App(){
  const [saved] = useState(loadCase); // one-time read of persisted case
  const [onboarded, setOnboarded] = useState(() => !!saved.onboarded);
  const [screen, setScreen] = useState(() => saved.onboarded ? 'home' : 'onboarding');
  const [onbStep, setOnbStep] = useState(1);
  // Non-null only while re-entering the location/profile flow to EDIT an existing
  // case (via the ◉ pill) — holds a staged copy so state/county/issue/profile
  // selects don't silently commit to the live case (re-citing law, blanking the
  // county) until the user explicitly taps Save. Null during first-run onboarding,
  // where there is no existing case to protect and the prior live-binding is fine.
  const [editDraft, setEditDraft] = useState(null);
  const [stateSel, setStateSel] = useState(() => saved.stateSel || '');
  const [county, setCounty] = useState(() => saved.county || '');
  const [countyQuery, setCountyQuery] = useState('');
  const [issue, setIssue] = useState(() => saved.issue || null);
  const [profile, setProfile] = useState(() => Object.assign({ name:'', employer:'', payType:'', rate:'', salary:'' }, saved.profile));
  const [caseOpened, setCaseOpened] = useState(() => saved.caseOpened || new Date().toISOString());
  const [federal, setFederal] = useState(null);
  const [stateData, setStateData] = useState(undefined); // undefined = loading, null = none, object = loaded
  const [contentErr, setContentErr] = useState(false);
  const [stateErr, setStateErr] = useState(false); // true = state dataset fetch failed (distinct from "no extra state rule")
  const [homeMode, setHomeMode] = useState(() => saved.homeMode || 'standard');
  const [done, setDone] = useState(() => saved.done || {});
  const [draft, setDraft] = useState('');
  const [typing, setTyping] = useState(false);
  const [logKind, setLogKind] = useState('Wage & hour');
  const [logNote, setLogNote] = useState('');
  const [logHours, setLogHours] = useState('');
  const [logPayStatus, setLogPayStatus] = useState('unpaid'); // 'unpaid' (paid $0) | 'straight' (paid straight-time only)
  const [editingEntryIdx, setEditingEntryIdx] = useState(null); // non-null while editing an existing log entry in place
  const [letterEdit, setLetterEdit] = useState(() => (saved.letterEdit != null ? saved.letterEdit : null)); // null = generated view; string = editing
  const [letterType, setLetterType] = useState(() => saved.letterType || null); // chosen letter kind (wage issue offers two)
  const [docName, setDocName] = useState(() => saved.docName || '');
  const [docText, setDocText] = useState(() => saved.docText || ''); // pasted document text for the local rules-based clause scan
  const [consultSent, setConsultSent] = useState('');
  const [exportPath, setExportPath] = useState(''); // 'tab' | 'download' | 'failed' — actual path printLetter() took, for accurate confirmation copy
  const [wizNode, setWizNode] = useState(() => saved.wizNode || 'start');
  const [wizPath, setWizPath] = useState(() => saved.wizPath || []);
  const [messages, setMessages] = useState(() =>
    (saved.messages && saved.messages.length) ? saved.messages : [{ role:'ai', text: issueCfg(saved.issue).chatSeed }]
  );
  const [entries, setEntries] = useState(() => saved.entries || []);

  const timer = useRef(null);
  const chatEnd = useRef(null);
  const mainRef = useRef(null);
  const firstRender = useRef(true);
  useEffect(() => () => clearTimeout(timer.current), []);
  useEffect(() => { if(screen === 'chat' && chatEnd.current) chatEnd.current.scrollIntoView({ behavior:'smooth', block:'nearest' }); }, [messages, typing, screen]);
  // On navigation, move focus (and scroll) to the top of the main region so
  // keyboard/screen-reader users land on the new screen instead of being stranded
  // where the just-unmounted button was. Skip the initial mount and the chat screen
  // (chat manages its own input focus). Runs only on screen change, never on keystroke.
  useEffect(() => {
    if (firstRender.current) { firstRender.current = false; return; }
    if (screen === 'chat') return;
    const el = mainRef.current;
    if (el) { el.scrollTop = 0; el.focus({ preventScroll: true }); }
  }, [screen]);

  // Persist the case whenever anything meaningful changes. Includes letterEdit/
  // letterType/wizNode/wizPath/docName — the app tells users "everything you
  // enter stays on this device," but a hand-edited letter, in-progress
  // classification-wizard position, or noted document name previously vanished
  // on reload because they weren't in this list.
  useEffect(() => {
    saveCase({ onboarded, stateSel, county, issue, profile, caseOpened, homeMode, done, messages, entries,
      letterEdit, letterType, wizNode, wizPath, docName, docText });
  }, [onboarded, stateSel, county, issue, profile, caseOpened, homeMode, done, messages, entries,
      letterEdit, letterType, wizNode, wizPath, docName, docText]);

  // Load the source-cited legal-content dataset (federal once; state on selection change).
  useEffect(() => {
    fetchContentJson('content/_federal.json')
      .then(d => { if (d) setFederal(d); else setContentErr(true); })
      .catch(() => setContentErr(true));
  }, []);
  useEffect(() => {
    const ab = US_STATE_ABBR[stateSel];
    if (!ab) { setStateData(null); setStateErr(false); return; }
    let ignore = false;
    setStateData(undefined);
    setStateErr(false);
    // Treat an HTTP error (404/500) the same as a network failure: surface stateErr
    // rather than resolving to null, which is indistinguishable from the legitimate
    // "state follows federal" case and would hide a genuine load failure.
    fetchContentJson('content/states/' + ab + '.json')
      .then(d => { if (!ignore) setStateData(d); })
      .catch(() => { if (!ignore) { setStateData(null); setStateErr(true); } });
    return () => { ignore = true; };
  }, [stateSel]);

  const nav = useCallback(k => () => setScreen(k), []);

  // Erase the sensitive case (employer, name, pay, incident log, chat, documents)
  // from this device. Everything lives only in localStorage under STORE_KEY, so a
  // shared/work/library browser otherwise keeps a plaintext record — give the user
  // a way to delete it. The persist effect re-runs after reset, writing only the
  // empty starter object.
  const clearCase = useCallback(() => {
    if (typeof window !== 'undefined' && window.confirm &&
        !window.confirm('Delete your case from this device? This erases your inputs, log entries, chat and saved documents from this browser and cannot be undone.')) return;
    try { localStorage.removeItem(STORE_KEY); } catch(e){}
    setStateSel(''); setCounty(''); setIssue(null);
    setProfile({ name:'', employer:'', payType:'', rate:'', salary:'' });
    setHomeMode('standard'); setDone({}); setEntries([]);
    setMessages([{ role:'ai', text: issueCfg(null).chatSeed }]);
    setDraft(''); setLogNote(''); setLogHours(''); setLogPayStatus('unpaid'); setEditingEntryIdx(null);
    setLetterEdit(null); setLetterType(null);
    setDocName(''); setDocText(''); setConsultSent(''); setExportPath(''); setWizNode('start'); setWizPath([]);
    setOnbStep(1); setOnboarded(false); setScreen('onboarding');
  }, []);

  // Keep the (untouched) chat opener in sync with the chosen issue.
  useEffect(() => {
    setMessages(m => (m.length === 1 && m[0].role === 'ai') ? [{ role:'ai', text: issueCfg(issue).chatSeed }] : m);
  }, [issue]);

  // `done` is keyed by step INDEX, and different issues have different step lists
  // at those indices — so switching issue (via the ◉ pill's Save, or first-run
  // onboarding) must reset it, or a new issue shows steps pre-checked that were
  // never actually done for it. Only fires on an actual change, never on the
  // initial mount (prevIssueRef starts equal to the just-loaded `issue`).
  const prevIssueRef = useRef(issue);
  useEffect(() => {
    if (prevIssueRef.current !== issue) setDone({});
    prevIssueRef.current = issue;
  }, [issue]);

  const addEntry = (e) => {
    setEntries(p => [Object.assign({ date: stamp(), iso: new Date().toISOString() }, e), ...p]);
  };

  // Start a fresh CASE on the same jurisdiction/profile — clears the case-instance
  // data (evidence log, step progress, case-open date, letters, chat, doc name)
  // without the full destructive delete. For a user moving on to a new problem
  // rather than erasing their device history; entries/caseOpened otherwise carry
  // over indefinitely and a second case would inherit the first one's evidence and
  // "opened N days ago" figure.
  const startFreshCase = useCallback(() => {
    if (typeof window !== 'undefined' && window.confirm &&
        !window.confirm('Start a fresh case? This clears your incident log, step progress, letters and chat for a new case. Your state, county, name and employer stay set — change those with the ' + '◉' + ' button if this is a different employer.')) return;
    setDone({}); setEntries([]); setLogNote(''); setLogHours(''); setLogPayStatus('unpaid'); setEditingEntryIdx(null);
    setMessages([{ role:'ai', text: issueCfg(issue).chatSeed }]);
    setLetterEdit(null); setLetterType(null); setDocName(''); setDocText(''); setConsultSent(''); setExportPath('');
    setWizNode('start'); setWizPath([]);
    setCaseOpened(new Date().toISOString());
  }, [issue]);

  const send = (text) => {
    if(!text.trim()) return;
    const lower = text.toLowerCase();
    // Route by question content (word-boundary keyword/phrase match), not by message
    // position and not by bare substring — a bare .includes() match on a keyword
    // fragment mis-routes "Where do I sign the timesheet?" (contains "sign"), "Can I
    // exterminate the pests in the breakroom?" (contains "terminat"), or "adapter"
    // (contains "ada") to an unrelated reply, sometimes carrying a real §-citation
    // that then reads as authoritative for a question we never actually matched.
    const hasWord = (re) => re.test(lower);
    const isAda = hasWord(/\baccommodat\w*/) || hasWord(/\bada\b/) || hasWord(/\bdisab\w*/);
    const isRetaliation = hasWord(/\bretaliat\w*/) || hasWord(/\bfired\b/) || hasWord(/\bterminat\w*/) || hasWord(/\bpushed out\b/) || hasWord(/\blet go\b/);
    // "sign" alone is far too broad ("sign the timesheet") and must never fire on
    // "signature"/"assign"/"design"/"resign" (the \b already excludes those — none
    // of them start a new word at "sign"). Beyond that, require an explicit signing
    // verb together with a document-ish noun (either order) before treating a
    // message as being about a severance/release document, not just any signature.
    const hasSignVerb = hasWord(/\bsign(?:ing|ed)?\b/);
    const hasDocNoun = hasWord(/\b(severance|release|agreement|contract|offer|document|paperwork|pip|nda)\b/);
    const isSeverance = hasWord(/\bseverance\b/) || hasWord(/\brelease agreement\b/) || (hasSignVerb && hasDocNoun);
    const isOvertime = hasWord(/\bovertime\b/) || hasWord(/\bunpaid\b/) || hasWord(/\boff[\s-]the[\s-]clock\b/) || hasWord(/\bwages?\b/);
    // Cite the caller's actual loaded state law, not a fixed persona's state — fall back to a
    // state-neutral pointer to Rights when no state-specific fact is on file for that topic.
    const stFacts = (stateData && stateData.facts) || [];
    const retaliationFact = stateFactFor(stFacts, ['retaliation', 'retaliation.whistleblower', 'discrimination.retaliation']);
    const adaFact = stateFactFor(stFacts, ['disability.accommodation', 'disability.interactiveProcess']);
    const stateNote = " Check your state's specific rule in Rights.";
    const retaliationReply = {
      text: REPLIES[1].text + (retaliationFact ? '' : stateNote),
      cites: retaliationFact && retaliationFact.citation ? [retaliationFact.citation] : []
    };
    const adaReply = {
      text: ADA_REPLY.text + (adaFact ? '' : stateNote),
      cites: adaFact && adaFact.citation ? ['42 U.S.C. §12112', adaFact.citation] : ['42 U.S.C. §12112']
    };
    const repliesResolved = [REPLIES[0], retaliationReply, REPLIES[2]];
    // Topic-neutral fallback for questions that match none of the known topics.
    // Never attach a statutory citation to an answer we didn't actually match —
    // an off-topic reply carrying a real §-cite reads as authoritative and wrong.
    const fallbackReply = {
      text: "I can only give sample answers on a few topics: unpaid overtime and wages, discrimination and harassment, termination and retaliation, and severance or documents you've been asked to sign. Try rephrasing toward one of those. For anything else, your state labor agency or a local attorney (see Referrals) is the best next step.",
      cites: []
    };
    const matched = isAda ? adaReply : isRetaliation ? repliesResolved[1] : isSeverance ? repliesResolved[2] : isOvertime ? repliesResolved[0] : null;
    setMessages(prev => {
      const next = prev.concat([{ role:'user', text }]);
      clearTimeout(timer.current);
      timer.current = setTimeout(() => {
        setTyping(false);
        setMessages(p => p.concat([Object.assign({ role:'ai' }, matched || fallbackReply)]));
      }, 900);
      return next;
    });
    setDraft('');
    setTyping(true);
  };

  const stateAbbr = US_STATE_ABBR[stateSel] || '';
  const stateLabel = stateSel || 'your state'; // fall back when onboarding was skipped without a state
  const locationLabel = county ? county + (stateAbbr ? ', ' + stateAbbr : '') : (stateSel || 'your location');
  const countyShort = county ? county.replace(/\s+(County|Parish|Borough|Census Area|Municipio|Municipality|city)$/i, '') : (stateSel || 'your area');
  const showTabs = screen !== 'onboarding';

  // ── Derived, input-driven case values (no hardcoded persona) ──
  const cfg = issueCfg(issue);
  const openedDays = daysAgo(caseOpened);
  const openedLabel = openedDays === 0 ? 'today' : openedDays === 1 ? 'yesterday' : openedDays + ' days ago';
  const evidenceCount = entries.length;
  // Salaried users never had a way to enter a rate, so owedEstimate was always 0
  // for them — even though the exemption wizard exists specifically to catch
  // misclassified SALARIED workers. Derive an hourly-equivalent from their stated
  // annual salary (see hourlyEquivFromSalary) when payType is Salary.
  const rateNum = profile.payType === 'Salary' ? hourlyEquivFromSalary(profile.salary) : (Number(profile.rate) || 0);
  // Owed-amount estimate: distinguishes hours paid $0 (1.5×) from hours already
  // paid straight-time but denied the overtime premium (0.5× differential), and
  // groups logged hours by workweek — see computeOwedBreakdown.
  const owedBreakdown = computeOwedBreakdown(entries, rateNum);
  const unpaidHours = owedBreakdown.totalHours;
  const owedEstimate = owedBreakdown.owedEstimate;
  const strength = caseStrength(entries);
  // Show 0 filled bars when nothing is logged. Each strength dimension floors at
  // pct 12, so score is ~12 even with no evidence — Math.round(12/20) would light
  // one bar under the "Not started" label. Only fill bars once there's real evidence.
  const strengthFill = evidenceCount > 0 ? Math.max(1, Math.round(strength.score / 20)) : 0;
  const doneCount = cfg.steps.filter((_, i) => done[i]).length;
  // F4 — surface the much shorter OSHA §11(c) whistleblower deadline (30 days)
  // alongside the regular termination deadline for the subset of termination
  // cases the user's own words identify as safety-retaliation. See
  // isSafetyRetaliationCase for the detection rule.
  const safetyRetaliation = isSafetyRetaliationCase(cfg.key, entries, messages);
  const oshaFact = safetyRetaliation ? factByTopic((federal && federal.facts) || [], 'deadlines.oshaWhistleblower') : null;
  const youName = (profile.name || '').trim();
  const employerName = (profile.employer || '').trim();

  // F4 — the OSHA whistleblower deadline card, shown ALONGSIDE (never instead
  // of) the regular Deadline Watch card so a user who also has a discrimination
  // angle still sees that longer window too. Clearly labeled and visually
  // distinct (red) so the much shorter 30-day clock isn't mistaken for the
  // slower EEOC one above it.
  const OshaWatch = ({ dark }) => {
    if (!oshaFact) return null;
    return (
      <button onClick={nav('strength')} style={css(dark
        ? "text-align:left;padding:14px 16px;border-radius:12px;border:2px solid #FFB4C4;background:rgba(179,38,79,.35);cursor:pointer;display:flex;flex-direction:column;gap:4px"
        : "text-align:left;padding:16px 18px;border-radius:14px;border:2px solid #B3264F;background:#FFE7EC;cursor:pointer;display:flex;flex-direction:column;gap:4px")}>
        <span style={css("font:700 " + (dark ? '12px' : '13px') + " 'IBM Plex Mono',monospace;color:" + (dark ? '#FFE3EA' : '#8A1438') + ";letter-spacing:.04em")}>⚠ OSHA WHISTLEBLOWER DEADLINE</span>
        <span style={css("font:700 " + (dark ? '16px/1.3' : '18px/1.3') + " 'Atkinson Hyperlegible',sans-serif;color:" + (dark ? '#fff' : '#14181F'))}>{oshaFact.value || oshaFact.summary}</span>
        <span style={css("font:400 " + (dark ? '13px/1.4' : '14px/1.4') + " 'Atkinson Hyperlegible',sans-serif;color:" + (dark ? '#FFE3EA' : '#5A1330'))}>Reporting a safety hazard? This OSHA complaint deadline is much shorter than the discrimination-charge window above.</span>
      </button>
    );
  };

  /* ── Screen renderers ──────────────────────────────────────────── */

  const Onboarding = () => {
    // Re-entering this flow to EDIT an existing case (via the ◉ pill) stages
    // changes in editDraft — nothing here touches the live case (stateSel/county/
    // issue/profile) until Save is tapped. First-run onboarding (editDraft null)
    // keeps the original live-binding behavior; there's no existing case yet to
    // protect from an unconfirmed change.
    const editing = onboarded && editDraft != null;
    const dStateSel = editing ? editDraft.stateSel : stateSel;
    const dCounty = editing ? editDraft.county : county;
    const dIssue = editing ? editDraft.issue : issue;
    const dProfile = editing ? editDraft.profile : profile;
    const setDStateSel = (v) => {
      setCountyQuery(''); // F20 — a stale filter from the previous state's county list shouldn't carry over
      if (editing) setEditDraft(p => Object.assign({}, p, { stateSel: v, county: '' }));
      else { setStateSel(v); setCounty(''); }
    };
    const setDCounty = (v) => { if (editing) setEditDraft(p => Object.assign({}, p, { county: v })); else setCounty(v); };
    const setDIssue = (v) => { if (editing) setEditDraft(p => Object.assign({}, p, { issue: v })); else setIssue(v); };
    const setDProfile = (updater) => {
      if (editing) setEditDraft(p => Object.assign({}, p, { profile: updater(p.profile) }));
      else setProfile(updater);
    };
    return (
    <div style={css("padding:20px 24px 40px;display:flex;flex-direction:column;gap:22px")}>
      <div style={css("display:flex;gap:4px;height:6px")}>
        {[1,2,3,4].map(n => <div key={n} style={css("flex:1;border-radius:3px;background:" + (onbStep >= n ? '#2B3AA8' : 'rgba(20,24,31,.12)'))}></div>)}
      </div>
      <div style={css("display:flex;gap:3px;height:5px;border-radius:3px;overflow:hidden")}>
        <div style={css("flex:1;background:#E0322F")}></div><div style={css("flex:1;background:#EF7B22")}></div><div style={css("flex:1;background:#E3B505")}></div><div style={css("flex:1;background:#1F8A4C")}></div><div style={css("flex:1;background:#2B3AA8")}></div><div style={css("flex:1;background:#7A3AA8")}></div>
      </div>
      {/* F16 — a typo or wrong pick two steps back previously had no fix except
          finishing the whole flow (or the unsafe Skip). Back only moves within
          this in-progress draft — it never touches the live case; Save/Cancel
          at the end still gate any real commit. */}
      {onbStep > 1 &&
        <button onClick={() => setOnbStep(onbStep - 1)} aria-label="Back to the previous step" style={css("align-self:flex-start;min-height:44px;padding:10px 12px;margin:-8px 0 -10px -10px;background:none;border:none;font:700 16px 'Atkinson Hyperlegible',sans-serif;color:#2B3AA8;cursor:pointer")}>‹ Back</button>
      }
      <h1 style={css("margin:0;font:700 30px/1.15 'Atkinson Hyperlegible',sans-serif;color:#14181F;text-wrap:pretty")}>{ONB_TITLES[onbStep]}</h1>
      <p style={css("margin:0;font:400 18px/1.5 'Atkinson Hyperlegible',sans-serif;color:#3A4150;text-wrap:pretty")}>{editing ? 'Nothing changes until you tap Save at the end.' : ONB_BODIES[onbStep]}</p>

      {onbStep === 1 &&
        <div style={css("display:flex;flex-direction:column;gap:14px")}>
          <label htmlFor="onb-state" style={css("font:700 15px 'Atkinson Hyperlegible',sans-serif;color:#14181F;letter-spacing:.02em")}>STATE</label>
          <select id="onb-state" value={dStateSel} onChange={e => setDStateSel(e.target.value)} style={css("width:100%;padding:15px;border-radius:12px;border:2px solid #14181F;background:#fff;font:700 17px 'Atkinson Hyperlegible',sans-serif;color:#14181F;cursor:pointer;appearance:menulist;-webkit-appearance:menulist")}>
            <option value="">Select your state…</option>
            {US_STATES.map(n => <option key={n} value={n}>{n}</option>)}
          </select>
        </div>
      }

      {onbStep === 2 && (() => {
        const countyLabelWord = US_COUNTY_LABEL[dStateSel] === 'PARISH' ? 'parish' : US_COUNTY_LABEL[dStateSel] === 'BOROUGH' ? 'borough' : 'county';
        const allCounties = US_COUNTIES[dStateSel] || [];
        // F20 — a native <select> with 100+ options is hard to scan; add a
        // simple text filter above it for states with a lot of counties (TX
        // has 254, GA 159, VA 133…). Small states (few counties) skip the
        // filter — it would just be clutter. The currently-selected county
        // always stays in the list even if it no longer matches the filter
        // text, so filtering never silently clears a valid selection.
        const q = countyQuery.trim().toLowerCase();
        let shown = q ? allCounties.filter(n => n.toLowerCase().includes(q)) : allCounties;
        if (dCounty && !shown.includes(dCounty)) shown = [dCounty].concat(shown);
        return (
        <div style={css("display:flex;flex-direction:column;gap:14px")}>
          <label htmlFor="onb-county" style={css("font:700 15px 'Atkinson Hyperlegible',sans-serif;color:#14181F;letter-spacing:.02em")}>{(US_COUNTY_LABEL[dStateSel] || 'COUNTY') + ' · ' + dStateSel.toUpperCase()}</label>
          {allCounties.length > 20 &&
            <input id="onb-county-filter" type="text" value={countyQuery} onChange={e => setCountyQuery(e.target.value)}
              placeholder={'Type to filter ' + allCounties.length + ' ' + countyLabelWord + 's…'} aria-label={'Filter the ' + countyLabelWord + ' list'}
              style={css("padding:14px;border-radius:12px;border:2px solid #14181F;font:400 17px 'Atkinson Hyperlegible',sans-serif;color:#14181F")} />
          }
          <select id="onb-county" value={dCounty || ''} onChange={e => setDCounty(e.target.value || null)} style={css("width:100%;padding:15px;border-radius:12px;border:2px solid #14181F;background:#fff;font:700 17px 'Atkinson Hyperlegible',sans-serif;color:#14181F;cursor:pointer;appearance:menulist;-webkit-appearance:menulist")}>
            <option value="">{'Select a ' + countyLabelWord + ' (' + shown.length + (shown.length !== allCounties.length ? ' of ' + allCounties.length : '') + ')'}</option>
            {shown.map(n => <option key={n} value={n}>{n}</option>)}
          </select>
          {q && shown.length === (dCounty ? 1 : 0) &&
            <p role="status" style={css("margin:0;font:600 14px/1.4 'Atkinson Hyperlegible',sans-serif;color:#B3264F")}>No {countyLabelWord} matches “{countyQuery.trim()}”.</p>
          }
          <div style={css("padding:16px 18px;border-radius:14px;background:#EEF1FF;border:2px solid #2B3AA8")}>
            <p style={css("margin:0;font:400 16px/1.45 'Atkinson Hyperlegible',sans-serif;color:#1B2778")}>We layer federal, {dStateSel} state, and local county or city rules — and always show whichever gives you the most protection.</p>
          </div>
        </div>
        );
      })()}

      {onbStep === 3 &&
        <div role="radiogroup" aria-label="What brings you here?" style={css("display:flex;flex-direction:column;gap:12px")}>
          {ISSUE_LIST.map(([name, desc]) =>
            <button key={name} onClick={() => setDIssue(name)} role="radio" aria-checked={dIssue === name}
              style={css('text-align:left;display:flex;flex-direction:column;gap:5px;padding:18px;border-radius:16px;border:2px solid ' + (dIssue === name ? '#2B3AA8' : '#14181F') + ';background:' + (dIssue === name ? '#EEF1FF' : '#fff') + ';cursor:pointer')}>
              <span style={css("font:700 18px 'Atkinson Hyperlegible',sans-serif")}>{name}</span>
              <span style={css("font:400 15px/1.4 'Atkinson Hyperlegible',sans-serif;color:#4A5162")}>{desc}</span>
            </button>
          )}
        </div>
      }

      {onbStep === 4 &&
        <div style={css("display:flex;flex-direction:column;gap:14px")}>
          <div style={css("display:flex;flex-direction:column;gap:6px")}>
            <label htmlFor="onb-name" style={css("font:700 15px 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>YOUR NAME</label>

        if (K === 'wage') {
          bigLine = owedEstimate > 0 ? 'You may be owed about ' + money(owedEstimate) + '.' : 'You may be owed 1.5× pay for those hours.';
          sub = owedEstimate > 0

        const stepIdx = Math.min(doneCount, cfg.steps.length - 1);

        const screenLabels = { log:'Log what happened', wizard:'Check my classification', doc:'Review my document', chat:'Ask a question', letter:'Start my letter', rights:'See my rights', strength:'See my case strength' };
        let primaryLabel = screenLabels[target.screen] || 'Do the next step';
        if (K === 'wage' && target.screen === 'letter') primaryLabel = target.letterType === 'wage-demand' ? 'Ask for the money' : 'Confirm my classification';
        const primary = [primaryLabel, target.screen];
        return (
          <>
            <h1 style={css("margin:0;font:700 30px/1.15 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>{heads[K] || heads.general}</h1>
            <div style={css("padding:20px;border-radius:16px;background:#FFF4D6;border:2px solid #14181F")}>

      <div style={css("margin-top:auto;padding:18px;border-radius:16px;border:2px solid #14181F;background:#fff")}>
        <p style={css("margin:0;font:700 18px/1.45 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>This app explains the law. It is not your lawyer.</p>
      </div>
    </div>
  );

  const HomeScreen = () => (
    homeMode === 'action' ? <HomeAction /> : homeMode === 'plain' ? <HomePlain /> : <HomeStandard />
  );

  const Chat = () => (
    <div style={css("display:flex;flex-direction:column;min-height:100%")}>
      <div style={css("padding:6px 22px 14px;border-bottom:2px solid rgba(20,24,31,.1)")}>
        <h1 style={css("margin:0 0 4px;font:700 26px 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>Ask about your rights</h1>
        <p style={css("margin:0;font:400 15px/1.4 'Atkinson Hyperlegible',sans-serif;color:#4A5162")}>General information for {stateSel || 'your state'} — not legal advice. Responses in this preview are sample answers.</p>
      </div>
      <div role="log" aria-live="polite" aria-label="Conversation" style={css("flex:1;padding:18px 22px;display:flex;flex-direction:column;gap:14px")}>
        {messages.map((m, idx) => {
          const cites = m.cites || [];
          return (
            <div key={idx} style={css('display:flex;flex-direction:column;gap:8px;align-items:' + (m.role === 'ai' ? 'flex-start' : 'flex-end') + ';animation:popin .22s ease both')}>
              <div style={css('max-width:300px;padding:15px 17px;border-radius:' + (m.role === 'ai' ? '18px 18px 18px 4px' : '18px 18px 4px 18px') + ';background:' + (m.role === 'ai' ? '#F0EDE5' : '#2B3AA8') + ';color:' + (m.role === 'ai' ? '#14181F' : '#fff') + ';border:2px solid ' + (m.role === 'ai' ? 'rgba(20,24,31,.14)' : '#2B3AA8') + ";font:400 17px/1.45 'Atkinson Hyperlegible',sans-serif")}>{m.text}</div>
              {cites.length > 0 &&
                <div style={css("display:flex;flex-wrap:wrap;gap:7px;max-width:300px")}>
                  {cites.map((c, ci) => <span key={ci} style={css("padding:7px 11px;border-radius:8px;background:#EEF1FF;border:2px solid #2B3AA8;font:600 13px 'IBM Plex Mono',monospace;color:#1B2778")}>{c}</span>)}
                </div>

            <span style={css("width:9px;height:9px;border-radius:50%;background:#14181F;animation:blink 1.2s .2s infinite")}></span>

          </div>
        }

      </div>

        <div style={css("display:flex;gap:8px;overflow-x:auto;-webkit-mask-image:linear-gradient(to right,#000 92%,transparent 100%);mask-image:linear-gradient(to right,#000 92%,transparent 100%)")}>
          {PROMPT_TEXTS.map(t => <button key={t} onClick={() => send(t)} style={css("flex:none;padding:11px 14px;border-radius:999px;border:2px solid #14181F;background:#FFF;font:700 15px 'Atkinson Hyperlegible',sans-serif;color:#14181F;cursor:pointer")}>{t}</button>)}
        </div>
        <div style={css("display:flex;gap:10px;align-items:center")}>
          <input aria-label="Your question" value={draft} onChange={e => setDraft(e.target.value)} onKeyDown={e => { if(e.key === 'Enter' && draft.trim()) send(draft); }} placeholder="Type your question" style={css("flex:1;padding:16px;border-radius:14px;border:2px solid #14181F;background:#fff;font:400 17px 'Atkinson Hyperlegible',sans-serif;color:#14181F")} />
          <button onClick={() => send(draft)} style={css("padding:16px 20px;border-radius:14px;border:none;background:#2B3AA8;color:#fff;font:700 17px 'Atkinson Hyperlegible',sans-serif;cursor:pointer")}>Send</button>
        </div>
        <p style={css("margin:0;font:400 13px/1.35 'Atkinson Hyperlegible',sans-serif;color:#4A5162")}>AI can be wrong. Verify anything important with an attorney — tap Referrals in the tab bar.</p>
      </div>
    </div>
  );

  const Wizard = () => {
    const result = RESULTS[wizNode];
    const wizDone = !!result;
    const cur = TREE[wizNode] || TREE.start;
    const depth = wizPath.length + 1;
    return (
      <div style={css("padding:6px 22px 34px;display:flex;flex-direction:column;gap:20px")}>

        <div>
          <span style={css("font:700 13px 'IBM Plex Mono',monospace;color:#4A5162;letter-spacing:.05em")}>OVERTIME EXEMPTION CHECK · {wizDone ? 'COMPLETE' : 'QUESTION ' + depth}</span>
          <h1 style={css("margin:8px 0 0;font:700 26px/1.2 'Atkinson Hyperlegible',sans-serif;color:#14181F;text-wrap:pretty")}>{wizDone ? 'Your overtime status' : cur.q}</h1>

            )}
          </div>
        }

            <div style={css('padding:22px;border-radius:18px;border:3px solid #14181F;background:' + (result.v === 'non' ? '#E8F6EE' : result.v === 'ex' ? '#FFE7EC' : '#FFF4D6'))}>
              <p style={css("margin:0 0 8px;font:700 14px 'IBM Plex Mono',monospace;letter-spacing:.05em;color:" + (result.v === 'non' ? '#136B3C' : result.v === 'ex' ? '#B3264F' : '#8A5A00'))}>RESULT</p>

              <p style={css("margin:0;font:400 17px/1.5 'Atkinson Hyperlegible',sans-serif;color:#25302B")}>{result.body}</p>
            </div>
            {(() => {
              const fedF = (federal && federal.facts) || [];
              const stF = (stateData && stateData.facts) || [];
              const stRev = !!(stateData && stateData.reviewed === true);
              const fedOT = [factByTopic(fedF,'overtime.basicRule'), factByTopic(fedF,'overtime.salaryLevelWeekly')].filter(Boolean);
              const stOT = factsByPrefix(stF,'overtime').concat([factByTopic(stF,'minimumWage.hourly')].filter(Boolean));
              const line = f => { const u = safeUrl(f.sourceUrl); return <p key={f.topic} style={css("margin:0 0 8px;font:400 15px/1.5 'Atkinson Hyperlegible',sans-serif;color:#1B2778")}>{f.summary} {u ? <a href={u} target="_blank" rel="noopener noreferrer" style={css("display:inline-flex;align-items:center;min-height:44px;padding:2px 6px;vertical-align:middle;color:#2B3AA8;font:600 12px 'IBM Plex Mono',monospace;text-decoration:none")}>[source ↗]</a> : null}</p>; };
              return (
                <div style={css("padding:18px;border-radius:16px;border:2px solid #2B3AA8;background:#EEF1FF")}>
                  <p style={css("margin:0 0 10px;font:700 17px 'Atkinson Hyperlegible',sans-serif;color:#1B2778")}>What applies in {stateLabel}</p>
                  <p style={css("margin:0 0 4px;font:700 13px 'IBM Plex Mono',monospace;color:#1B2778;letter-spacing:.04em")}>FEDERAL</p>

                    <p style={css("margin:0 0 8px;font:700 15px 'Atkinson Hyperlegible',sans-serif;color:#B3264F")}>Couldn’t load federal rules. Check your connection and reopen.</p> :
                    <p style={css("margin:0 0 8px;font:400 15px 'Atkinson Hyperlegible',sans-serif;color:#1B2778")}>Loading…</p>}
                  <p style={css("margin:10px 0 4px;font:700 13px 'IBM Plex Mono',monospace;color:#1B2778;letter-spacing:.04em")}>{stateSel ? stateSel.toUpperCase() : stateLabel.toUpperCase()}{stRev ? '' : ' (DRAFT)'}</p>

                    stateData === undefined ?
                    <p style={css("margin:0;font:400 15px 'Atkinson Hyperlegible',sans-serif;color:#1B2778")}>Loading…</p> :
                    <p style={css("margin:0;font:400 15px 'Atkinson Hyperlegible',sans-serif;color:#1B2778")}>{stateLabel} follows the federal overtime standard.</p>}
                </div>

            <div style={css("display:flex;flex-wrap:wrap;gap:8px")}>
              {result.cites.map((c, ci) => <span key={ci} style={css("padding:8px 12px;border-radius:8px;background:#fff;border:2px solid #14181F;font:600 13px 'IBM Plex Mono',monospace")}>{c}</span>)}
            </div>
            {/* The wage-demand letter only exists for the wage issue (letterKindsFor).
                For a non-wage issue (e.g. discrimination/termination) the Letter screen

  const Log = () => {
    const kind = LOG_KINDS.find(k => k.tag === logKind) || LOG_KINDS[0];
    const logBreakdown = computeOwedBreakdown(entries, rateNum);
    const editing = editingEntryIdx != null && entries[editingEntryIdx];
    const PLACEHOLDER_BODY = 'No detail added yet — tap to edit while it is fresh.';
    const resetForm = () => { setLogNote(''); setLogHours(''); setLogPayStatus('unpaid'); setEditingEntryIdx(null); };
    const submit = () => {
      const fields = { title: kind.title, body: logNote.trim() || PLACEHOLDER_BODY,
        color: kind.color, tag: kind.tag, hours: kind.asksHours ? (Number(logHours) || 0) : undefined,
        payStatus: kind.asksHours ? logPayStatus : undefined };
      if (editing) {
        // Preserve the original date/iso timestamp — only the editable fields
        // change; the entry keeps its place in the timeline.
        setEntries(p => p.map((e, idx) => idx === editingEntryIdx ? Object.assign({}, e, fields) : e));
      } else {
        addEntry(fields);
      }
      resetForm();
    };
    const startEdit = (i) => {
      const e = entries[i];
      const k = LOG_KINDS.find(k => k.tag === e.tag) || LOG_KINDS[0];
      setLogKind(k.tag);
      setLogNote(e.body === PLACEHOLDER_BODY ? '' : (e.body || ''));
      setLogHours(e.hours ? String(e.hours) : '');
      setLogPayStatus(e.payStatus || 'unpaid');
      setEditingEntryIdx(i);
    };
    const deleteEntry = (i) => {
      if (typeof window !== 'undefined' && window.confirm &&
          !window.confirm('Delete this log entry? This cannot be undone.')) return;
      setEntries(p => p.filter((_, idx) => idx !== i));
      if (editingEntryIdx === i) resetForm();

    <div style={css("padding:6px 22px 34px;display:flex;flex-direction:column;gap:16px")}>

      <p style={css("margin:0;font:400 16px/1.45 'Atkinson Hyperlegible',sans-serif;color:#4A5162")}>Contemporaneous notes carry real weight. Each entry is timestamped and kept on your device.</p>

        {editing && <p role="status" style={css("margin:0;font:700 14px 'Atkinson Hyperlegible',sans-serif;color:#6B4B00")}>Editing the entry from {entries[editingEntryIdx].date}</p>}
        <div role="group" aria-label="Entry type" style={css("display:flex;gap:8px;flex-wrap:wrap")}>
          {LOG_KINDS.map(k =>
            <button key={k.tag} onClick={() => setLogKind(k.tag)} aria-pressed={logKind === k.tag} style={css('min-height:44px;padding:10px 13px;border-radius:999px;border:2px solid ' + (logKind === k.tag ? '#2B3AA8' : '#14181F') + ';background:' + (logKind === k.tag ? '#2B3AA8' : '#fff') + ';color:' + (logKind === k.tag ? '#fff' : '#14181F') + ";font:700 14px 'Atkinson Hyperlegible',sans-serif;cursor:pointer")}>{k.label.replace('+ ','')}</button>
          )}
        </div>
        {kind.asksHours &&

              <label htmlFor="log-hours" style={css("font:700 14px 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>Hours</label>
              <input id="log-hours" type="number" min="0" max={ENTRY_HOURS_WARN_MAX} step="0.5" value={logHours} onChange={e => setLogHours(e.target.value)} placeholder="e.g. 6.5" style={css("width:110px;padding:11px;border-radius:10px;border:2px solid #14181F;font:400 16px 'Atkinson Hyperlegible',sans-serif")} />

              {[['unpaid','Not paid at all'],['straight','Paid straight-time only']].map(([v, label]) =>
                <button key={v} type="button" onClick={() => setLogPayStatus(v)} aria-pressed={logPayStatus === v} style={css('min-height:44px;padding:10px 13px;border-radius:999px;border:2px solid ' + (logPayStatus === v ? '#2B3AA8' : '#14181F') + ';background:' + (logPayStatus === v ? '#2B3AA8' : '#fff') + ';color:' + (logPayStatus === v ? '#fff' : '#14181F') + ";font:700 13px 'Atkinson Hyperlegible',sans-serif;cursor:pointer")}>{label}</button>
              )}
            </div>
            <p style={css("margin:0;font:400 13px/1.4 'Atkinson Hyperlegible',sans-serif;color:#4A5162")}>{logPayStatus === 'straight' ? 'Owed at the 0.5× overtime differential (you already got straight time for these hours).' : 'Owed at the full 1.5× overtime rate.'}</p>
          </div>
        }

        <div style={css("display:flex;gap:10px")}>

          {editing && <button onClick={resetForm} style={css("align-self:flex-start;padding:12px 18px;border-radius:12px;border:2px solid #14181F;background:#fff;color:#14181F;font:700 16px 'Atkinson Hyperlegible',sans-serif;cursor:pointer")}>Cancel</button>}
        </div>
      </div>

      {entries.length > 0 &&
        <div style={css("display:flex;gap:10px;flex-wrap:wrap")}>
          <span style={css("padding:8px 12px;border-radius:8px;background:#EEF1FF;border:2px solid #2B3AA8;font:600 13px 'IBM Plex Mono',monospace;color:#1B2778")}>{entries.length} {entries.length === 1 ? 'ENTRY' : 'ENTRIES'}</span>
          {logBreakdown.totalHours > 0 && <span style={css("padding:8px 12px;border-radius:8px;background:#FFF4D6;border:2px solid #14181F;font:600 13px 'IBM Plex Mono',monospace;color:#14181F")}>{logBreakdown.totalHours} HRS LOGGED · {logBreakdown.weekCount} {logBreakdown.weekCount === 1 ? 'WORKWEEK' : 'WORKWEEKS'}</span>}
        </div>

      {entries.length === 0 ?
        <div style={css("padding:22px;border-radius:16px;border:2px dashed rgba(20,24,31,.35);background:#fff;text-align:center")}>
          <p style={css("margin:0 0 4px;font:700 17px 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>Your log is empty</p>
          <p style={css("margin:0;font:400 15px/1.45 'Atkinson Hyperlegible',sans-serif;color:#4A5162")}>Add your first entry above. The earlier you start, the stronger your record.</p>
        </div>
        :
        <div style={css("display:flex;flex-direction:column")}>
          {entries.map((e, i) =>
            <div key={i} style={css("display:flex;gap:14px")}>
              <div style={css("display:flex;flex-direction:column;align-items:center;width:22px;flex:none")}>
                <span style={css('flex:none;width:18px;height:18px;border-radius:50%;background:' + e.color + ';border:3px solid #14181F')}></span>
