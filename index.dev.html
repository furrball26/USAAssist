        <div>
          <h1 style={css("margin:0;font:700 28px/1.15 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>Where in {stName}?</h1>
          <p style={css("margin:10px 0 0;font:400 17px/1.5 'Atkinson Hyperlegible',sans-serif;color:#3A4150")}>Pick your county on the map.</p>
        </div>
        <StateCountyMap stateName={stName} value={county} onPick={pickCounty} />
        {/* Same pairing as the state step, and the case is stronger here: county
            shapes are real, so plenty of targets are genuinely tiny, and many
            people know their county's name but not its outline. */}
        {(() => {
          const word = US_COUNTY_LABEL[stName] === 'PARISH' ? 'parish' : US_COUNTY_LABEL[stName] === 'BOROUGH' ? 'borough' : 'county';
          const plural = word === 'parish' ? 'parishes' : word === 'county' ? 'counties' : word + 's';
          const q = countyQuery.trim().toLowerCase();
          // A filter, because a native <select> of 254 options (Texas) is not

          return (
            <>

                <option value="">{'Select a ' + word + ' (' + shown.length + (shown.length !== counties.length ? ' of ' + counties.length : '') + ')'}</option>

        </div>

          style={css("align-self:flex-start;min-height:44px;padding:12px 16px;border-radius:12px;border:2px solid #14181F;background:#fff;font:700 15px 'Atkinson Hyperlegible',sans-serif;color:#14181F;cursor:pointer")}>Skip — show me {stName} law</button>

            <div style={css("display:flex;flex-direction:column;gap:10px")}>
              {tools.map(t =>

                  style={css("text-align:left;padding:16px 18px;border-radius:14px;border:2px solid #2B3AA8;background:#EEF1FF;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:44px")}>

        {stateErr ? <p role="alert" style={css("margin:0;font:700 15px/1.5 'Atkinson Hyperlegible',sans-serif;color:#B3264F")}>Couldn’t load {stName} rules. Check your connection and reopen — this is not a confirmation that no extra state protections apply.{fedFacts.length ? ' Federal law still applies nationwide.' : ''}</p> : null}

        {(federal || stateData) ?
          <div className="catgrid">
            {LAW_CATEGORIES.map(cat => {
              const n = factsInCategory(stFacts, cat.key).length + factsInCategory(fedFacts, cat.key).length;

                  style={css('text-align:left;padding:15px 16px;border-radius:16px;border:2px solid #14181F;background:' + cat.tint + ';cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:44px')}>
                  {/* Icon beside the title, not above it: eight stacked cards

                  <span style={css("display:flex;align-items:center;gap:10px")}>
                    <Icon name={cat.icon} size={24} />
                    <span style={css("font:700 18px/1.2 'Atkinson Hyperlegible',sans-serif;color:#14181F;text-wrap:pretty")}>{cat.label}</span>
                  </span>
                  <span style={css("font:400 15px/1.4 'Atkinson Hyperlegible',sans-serif;color:#3A4150")}>{cat.blurb}</span>
                  <span style={css("font:600 12px 'IBM Plex Mono',monospace;letter-spacing:.04em;color:#4A5162")}>{n} {n === 1 ? 'RULE' : 'RULES'}</span>
                </button>
              );
            })}
          </div> : null}

        <p style={css("margin:4px 0 0;font:400 14px/1.45 'Atkinson Hyperlegible',sans-serif;color:#4A5162")}>Legal information for {stName}, not legal advice, and laws change. Confirm anything important with an attorney.</p>
      </div>
    );
  };

  const HomeScreen = () => <LawsHome />;

  const Wizard = () => {
    // What to call the state in this screen's copy. `stateSel` is empty only

    // TREE_HARASSMENT never collide in practice.
    //
    // wizKey is set by the topic that opened this check (see EXPLAINERS_BY_CAT);
    // these run as explainers off a law category now, not off a case, so the
    // tree is chosen by what the reader tapped rather than by any stored issue.
    const wkey = wizKey || 'wage';
    const wcfg = wizardConfigFor(wkey);
    // FIND-01 — for the wage tree only, cross-check a standard white-collar
    // 'ex' verdict against the active state's own salary-floor fact before it
    // ever reaches the screen (see applyStateSalaryFloor above).
    const result = wcfg.results[wizNode];
    const wizDone = !!result;
    const cur = wcfg.tree[wizNode] || wcfg.tree.start;
    const depth = wizPath.length + 1;
    const isIdentifier = wkey === 'harassment' || wkey === 'discrimination';
    return (
      <div style={css("padding:6px 22px 34px;display:flex;flex-direction:column;gap:20px")}>
        <button onClick={nav('home')} style={css("align-self:flex-start;display:flex;align-items:center;gap:4px;background:none;border:none;padding:12px 8px;margin-left:-8px;font:700 16px 'Atkinson Hyperlegible',sans-serif;color:#2B3AA8;cursor:pointer")}><Icon name="back" size={18} /> Back to the law</button>
        <div>
          <span style={css("font:700 13px 'IBM Plex Mono',monospace;color:#4A5162;letter-spacing:.05em")}>{wcfg.tag} · {wizDone ? 'COMPLETE' : 'QUESTION ' + depth}</span>
          <h1 style={css("margin:8px 0 0;font:700 26px/1.2 'Atkinson Hyperlegible',sans-serif;color:#14181F;text-wrap:pretty")}>{wizDone ? wcfg.doneTitle : cur.q}</h1>
        </div>
        {!wizDone &&
          <div style={css("display:flex;flex-direction:column;gap:12px")}>
            <p style={css("margin:0;font:400 17px/1.5 'Atkinson Hyperlegible',sans-serif;color:#3A4150")}>{cur.help}</p>

              <button key={label} className="hoverfx" onClick={() => { setWizNode(next); setWizPath(p => p.concat([tag])); }} style={css("text-align:left;padding:18px;border-radius:16px;border:2px solid #14181F;background:#fff;font:700 18px 'Atkinson Hyperlegible',sans-serif;color:#14181F;cursor:pointer")}>{label}</button>
            )}
            <p style={css("margin:0;font:400 14px/1.45 'Atkinson Hyperlegible',sans-serif;color:#4A5162")}>{wcfg.qDisclaimer}</p>
          </div>
        }
        {wizDone &&
          <div style={css("display:flex;flex-direction:column;gap:24px")}>
          <div style={css("display:flex;flex-direction:column;gap:12px")}>
            {/* FIND-18 (docs/audit-2026-08-29.md) — this trail used to render the
                raw internal option tags (e.g. "SALARY", "≥ $684/WK", "ROUTINE
                TASKS") in IBM Plex Mono, reading as internal codes rather than
                the plain-language answer review it actually is. The tree
                options now carry short plain-language phrases instead of
                terse codes, and the pills render in Atkinson Hyperlegible
                (this app's convention: IBM Plex Mono is reserved for short
                data/code labels like citations or deadline kickers, not
                full-sentence content). */}
            <div style={css("display:flex;flex-wrap:wrap;gap:8px")}>
              {wizPath.map((a, ai) => <span key={ai} style={css("padding:8px 12px;border-radius:999px;background:#F0EDE5;border:2px solid rgba(20,24,31,.25);font:600 14px 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>{a}</span>)}
            </div>
            <div style={css('padding:22px;border-radius:18px;border:3px solid #14181F;background:' + (result.v === 'non' ? '#E8F6EE' : result.v === 'ex' ? '#FFE7EC' : '#FFF4D6'))}>
              <p style={css("margin:0 0 8px;font:700 14px 'IBM Plex Mono',monospace;letter-spacing:.05em;color:" + (result.v === 'non' ? '#136B3C' : result.v === 'ex' ? '#B3264F' : '#8A5A00'))}>RESULT</p>
              <p style={css("margin:0 0 12px;font:700 26px/1.2 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>{result.title}</p>
              <p style={css("margin:0;font:400 17px/1.5 'Atkinson Hyperlegible',sans-serif;color:#25302B")}>{result.body}</p>
            </div>
          </div>
            {wkey === 'wage' && (() => {
              const fedF = (federal && federal.facts) || [];
              const stF = (stateData && stateData.facts) || [];

          <p style={css("margin:10px 0 0;font:400 17px/1.5 'Atkinson Hyperlegible',sans-serif;color:#3A4150")}>The same rules the Laws tab explains — here with no explanation, just the citation, the figure and the official source. {total ? total + ' on file for ' + stName + '.' : ''}</p>
        </div>

        {contentErr ? <p role="alert" style={css("margin:0;font:700 15px/1.5 'Atkinson Hyperlegible',sans-serif;color:#B3264F")}>Couldn’t load the law dataset. Check your connection and reopen.</p> : null}
        {!federal && !contentErr ? <p style={css("margin:0;font:400 15px 'Atkinson Hyperlegible',sans-serif;color:#4A5162")}>Loading…</p> : null}
        {stateData === undefined ? <p style={css("margin:0;font:400 15px 'Atkinson Hyperlegible',sans-serif;color:#4A5162")}>Loading {stName} rules…</p> : null}
        {stateErr ? <p role="alert" style={css("margin:0;font:700 15px/1.5 'Atkinson Hyperlegible',sans-serif;color:#B3264F")}>Couldn’t load {stName} rules. Check your connection and reopen — this is not a confirmation that no extra state protections apply.</p> : null}
        {stateData && !stReviewed ? <DraftStateNotice stName={stName} extra="" /> : null}

        {groups.map(([prefix, rows]) =>
          <div key={prefix} style={css("display:flex;flex-direction:column;gap:8px")}>
            <p style={css("margin:6px 0 0;font:700 14px 'IBM Plex Mono',monospace;letter-spacing:.05em;color:#14181F")}>{topicKicker(prefix + '.x')}</p>
            {rows.map(([f, scope, tone], i) => ruleRow(f, prefix + i, scope, tone))}
          </div>
        )}

        <p style={css("margin:4px 0 0;font:400 14px/1.45 'Atkinson Hyperlegible',sans-serif;color:#4A5162")}>Legal information for {stName}, not legal advice, and laws change. Confirm anything important with an attorney.</p>
      </div>
    );
  };

  /* Who actually enforces this, and how to reach them for free. Every one of
     these is a government agency the reader can contact without a lawyer and
     without paying anyone — which, for most people reading this site, is the
     single most useful thing on it.

     State agencies come from the state dataset's own `agencies` block; the
     federal ones are constant. Both are shown, always: a state agency never
     replaces the federal route, and which one is the better door depends on
     facts this site does not ask for. */
  const FEDERAL_AGENCIES = [
    { name:'U.S. Department of Labor — Wage & Hour Division', covers:'Unpaid wages, overtime, minimum wage, family and medical leave.', url:'https://www.dol.gov/agencies/whd/contact/local-offices' },
    { name:'Equal Employment Opportunity Commission (EEOC)', covers:'Discrimination and harassment based on race, sex, religion, national origin, age, disability or genetic information.', url:'https://www.eeoc.gov/filing-charge-discrimination' },
    { name:'OSHA', covers:'Unsafe working conditions, and retaliation for reporting them.', url:'https://www.osha.gov/workers/file-complaint' },
    { name:'National Labor Relations Board (NLRB)', covers:'Being punished for organising, or for discussing pay and conditions with coworkers.', url:'https://www.nlrb.gov/about-nlrb/what-we-do/investigate-charges' },
  ];

  const Agencies = () => {
    const stLabel = stateSel || 'your state';
    const ag = (stateData && stateData.agencies) || {};
    const stateLinks = [
      ag.wageHour && ['Wage & hour', ag.wageHour],
      ag.discrimination && ['Discrimination & harassment', ag.discrimination],
      ag.labor && ['Labor standards', ag.labor],
    ].filter(Boolean).filter(([, a]) => a && safeUrl(a.url));

    const row = (title, covers, url, tone) => (
      <a key={url} href={url} target="_blank" rel="noopener noreferrer" className="hoverfx"
        style={css('display:flex;flex-direction:column;gap:5px;padding:16px 18px;border-radius:14px;border:2px solid #14181F;background:' + tone + ';text-decoration:none;min-height:44px')}>
        <span style={css("font:700 17px/1.3 'Atkinson Hyperlegible',sans-serif;color:#14181F;text-wrap:pretty")}>{title} ↗</span>
        <span style={css("font:400 15px/1.45 'Atkinson Hyperlegible',sans-serif;color:#3A4150")}>{covers}</span>
      </a>
    );

    return (
      <div style={css("padding:6px 22px 34px;display:flex;flex-direction:column;gap:16px")}>
        <div>
          <h1 style={css("margin:0;font:700 28px/1.15 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>Who enforces this</h1>
          <p style={css("margin:10px 0 0;font:400 17px/1.5 'Atkinson Hyperlegible',sans-serif;color:#3A4150")}>Government agencies you can contact yourself, for free, without a lawyer.</p>
        </div>

        {/* Said before the links, not after: complaining is itself protected,
            and someone weighing whether to file needs to know that first. */}
        <div style={css("padding:16px 18px;border-radius:14px;background:#FFF4D6;border:2px solid #14181F;display:flex;flex-direction:column;gap:6px")}>
          <p style={css("margin:0;font:700 16px 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>You are protected from retaliation for speaking up</p>
          <p style={css("margin:0;font:400 15px/1.45 'Atkinson Hyperlegible',sans-serif;color:#3A4150")}>It is illegal for an employer to punish you — fire, demote, cut your hours — for asking about, complaining about, or filing a claim over your rights at work. That protection covers internal and verbal complaints too, not only formal filings.</p>
        </div>

        {stateLinks.length ?
          <div style={css("display:flex;flex-direction:column;gap:10px")}>
            <p style={css("margin:2px 0 0;font:700 15px 'Atkinson Hyperlegible',sans-serif;color:#14181F;letter-spacing:.02em")}>{stLabel.toUpperCase()}</p>
            {stateLinks.map(([covers, a]) => row(a.name, covers, safeUrl(a.url), '#EEF1FF'))}
          </div> : null}
        {stateErr ? <p role="alert" style={css("margin:0;font:700 15px/1.5 'Atkinson Hyperlegible',sans-serif;color:#B3264F")}>Couldn’t load {stLabel} agency links. Check your connection and reopen — the federal agencies below are not the only ones that may apply.</p> : null}

        <div style={css("display:flex;flex-direction:column;gap:10px")}>
          <p style={css("margin:6px 0 0;font:700 15px 'Atkinson Hyperlegible',sans-serif;color:#14181F;letter-spacing:.02em")}>FEDERAL — ANYWHERE IN THE US</p>
          {FEDERAL_AGENCIES.map(a => row(a.name, a.covers, a.url, '#F0EDE5'))}
        </div>

        <div style={css("display:flex;gap:14px;padding:18px;border-radius:16px;border:2px solid #14181F;background:#fff")}>
          <span style={css("flex:none;width:44px;height:44px;border-radius:12px;background:#EEF1FF;border:2px solid #14181F;display:flex;align-items:center;justify-content:center;color:#2B3AA8")}><Icon name="scale" size={22} /></span>
          <div style={css("display:flex;flex-direction:column;gap:6px")}>
            <p style={css("margin:0;font:700 17px 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>Find an employment lawyer</p>
            <p style={css("margin:0;font:400 14px/1.45 'Atkinson Hyperlegible',sans-serif;color:#4A5162")}>You may also want an employment attorney licensed in {stLabel}. WorkLaw does not operate a referral service or recommend firms — your state or local bar association’s lawyer-referral service is a reliable place to start.</p>
          </div>
        </div>

        <p style={css("margin:0;font:400 14px/1.4 'Atkinson Hyperlegible',sans-serif;color:#4A5162")}>This is legal information, not legal advice. Deadlines to file are short and unforgiving — check the Deadlines topic before you wait.</p>
      </div>
    );
  };

  const SCREENS = {
    welcome: Welcome, home: HomeScreen, wizard: Wizard,
    noncompete: NonCompeteChecker, rights: RightsLib, agencies: Agencies
  };
  const Current = SCREENS[screen] || HomeScreen;

  // Home is a single (Standard) layout now — screenBg/statusColor used to
  // branch on homeMode ('action' painted the screen dark-blue, 'plain'
  // white) so a case saved under one of the retired modes wouldn't leave
  // the chrome mismatched against Standard's always-light content.
  const screenBg = '#FFFDF8';
  const statusColor = '#14181F';

  return (
    <div className="device">
      {/* --mode-bg is a raw CSS custom property (not camelCased, so it can't go
          through the css() helper — see css() above) that lets the >=1024px
          desktop tier repaint just the 680px reading column with the mode
          color while .screen itself becomes the beige desk gutter (R2). */}
      <div className={'screen' + (showTabs ? '' : ' no-tabbar')} style={Object.assign(css('background:' + screenBg), { '--mode-bg': screenBg })}>
        <div className="statusbar" aria-hidden="true" style={css('color:' + statusColor)}>
          <span>9:41</span><span style={css("letter-spacing:2px")}>▮▮▮ ᯤ ▰</span>
        </div>
        {/* R3: nav is before main in DOM so keyboard tab order reaches it
            first — matching its visual-first position in the >=1024px rail
            (grid-area placement doesn't depend on DOM order, but tab order
            does). .tabbar's CSS `order:2` keeps it painted LAST (bottom bar)
            at the phone/tablet tiers where it's a flex column, so the
            visual layout there is unchanged. */}
        {showTabs &&
          <nav aria-label="Primary" className="tabbar">
            {TAB_DEFS.map(([k, name, label]) =>
              <button key={k} className="hoverfx tabbar-btn" onClick={nav(k)} aria-current={screen === k ? 'page' : undefined}
                style={css('border:2px solid ' + (screen === k ? '#14181F' : 'transparent') + ';background:' + (screen === k ? '#FFF4D6' : 'transparent') + ';color:#14181F;cursor:pointer')}>
                <Icon name={name} size={22} />
                <span style={css("font:700 12px 'Atkinson Hyperlegible',sans-serif")}>{label}</span>
              </button>
            )}
          </nav>
        }
        <main className="scrollarea" ref={mainRef} tabIndex={-1} style={css("outline:none")}>
          {/* Call the screen as a function (not <Current/>) so it inlines into this
              stable tree instead of remounting on every keystroke — remounting was
              destroying the chat/onboarding/letter inputs and jumping scroll. */}
          {Current()}
          {/* The site collects nothing now — no name, no employer, no pay, no
              incident notes. All it remembers is the state and county picked on
              the map, so say exactly that rather than the old blanket warning
              about a shared computer holding a plaintext case file. */}
          {screen === 'home' &&
            <div style={css("margin:0 22px 30px;padding-top:16px;border-top:1px solid rgba(20,24,31,.14)")}>
              <p style={css("margin:0;font:400 13px/1.5 'Atkinson Hyperlegible',sans-serif;color:#4A5162")}>Nothing you do here is uploaded, and nothing about you is stored — this browser remembers only the state and county you picked, so the law you see is yours.</p>
            </div>
          }
        </main>
      </div>
    </div>
  );
}

// Last-resort catch for a render-time exception that reaches here despite
// loadPrefs()'s shape sanitizing (sanitizePrefs covers the two fields that are
// actually persisted, not necessarily every field a future
// bug or a hand-edited devtools change could corrupt). Without this, ANY
// uncaught render error takes the whole app to a permanently blank #root — the
// in-tree "Delete my case" button included, since it lives inside the tree
// that never mounted — and reload doesn't fix it, since the bad data is never
// rewritten. This gives the user a real way out instead of a dead page.
class ErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state = { hasError:false }; }
  static getDerivedStateFromError(){ return { hasError:true }; }
  componentDidCatch(error, info){
    if (typeof console !== 'undefined' && console.error) console.error('WorkLaw crashed:', error, info);
  }
  render(){
    if (!this.state.hasError) return this.props.children;
    const reloadOnly = () => { if (typeof window !== 'undefined') window.location.reload(); };
    const clearAndReload = () => {
      try { localStorage.removeItem(STORE_KEY); } catch(e) {}
      if (typeof window !== 'undefined') window.location.reload();
    };
    return (
      <div style={css("max-width:480px;margin:60px auto;padding:28px;font-family:'Atkinson Hyperlegible',sans-serif;color:#14181F")}>
        <h1 style={css("font:700 22px 'Atkinson Hyperlegible',sans-serif;margin:0 0 12px")}>Something went wrong</h1>
        <p style={css("font:400 15px/1.5 'Atkinson Hyperlegible',sans-serif;margin:0 0 16px")}>WorkLaw hit an unexpected error. This is usually caused by a saved setting that got corrupted. Your options:</p>
        <div style={css("display:flex;flex-direction:column;gap:10px")}>
          <button onClick={reloadOnly} style={css("min-height:44px;padding:14px 18px;border-radius:12px;border:2px solid #14181F;background:#fff;color:#14181F;font:700 15px 'Atkinson Hyperlegible',sans-serif;cursor:pointer")}>Try reloading</button>
          <button onClick={clearAndReload} style={css("min-height:44px;padding:14px 18px;border-radius:12px;border:2px solid #B3264F;background:#fff;color:#B3264F;font:700 15px 'Atkinson Hyperlegible',sans-serif;cursor:pointer")}>Reset and start over</button>
        </div>
        <p style={css("font:400 13px/1.5 'Atkinson Hyperlegible',sans-serif;color:#4A5162;margin:16px 0 0")}>Resetting forgets the state and county you picked — the only things WorkLaw stores — and starts you again at the map. That is all it holds, and it holds it only in this browser.</p>
      </div>
    );
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
