          links.push(['Federal — EEOC (discrimination)', 'https://www.eeoc.gov/filing-charge-discrimination']);
          const oshaF = factByTopic(fedF, 'deadlines.oshaWhistleblower');
          links.push(['Federal — OSHA whistleblower complaint (safety retaliation)', safeUrl(oshaF && oshaF.sourceUrl) || 'https://www.osha.gov/workers/file-complaint']);
        } else if (cfg.key === 'wage') {
          links.push(['Federal — U.S. DOL Wage & Hour', 'https://www.dol.gov/agencies/whd/contact/local-offices']);
        } else if (cfg.key === 'discrimination' || cfg.key === 'harassment') {
          links.push(['Federal — EEOC (discrimination)', 'https://www.eeoc.gov/filing-charge-discrimination']);
        } else {
          links.push(['Federal — EEOC (discrimination)', 'https://www.eeoc.gov/filing-charge-discrimination']);
          links.push(['Federal — U.S. DOL Wage & Hour', 'https://www.dol.gov/agencies/whd/contact/local-offices']);
        }
        return (
          <div style={css("padding:16px 18px;border-radius:14px;background:#E8F6EE;border:2px solid #14181F;display:flex;flex-direction:column;gap:8px")}>
            <p style={css("margin:0;font:700 16px 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>File directly with the enforcing agencies — free</p>
            <p style={css("margin:0 0 2px;font:400 15px/1.45 'Atkinson Hyperlegible',sans-serif;color:#25302B")}>You can bring a complaint to the government agencies that enforce these laws in {stateLabel}, at no cost:</p>
            {links.map(([label, url], i) => <a key={i} href={url} target="_blank" rel="noopener noreferrer" style={css("display:flex;align-items:center;min-height:44px;font:700 15px 'Atkinson Hyperlegible',sans-serif;color:#136B3C;text-decoration:underline")}>{label} ↗</a>)}
          </div>
        );
      })()}
      <div style={css("padding:16px;border-radius:14px;background:#FFF4D6;border:2px solid #14181F")}>
        <p style={css("margin:0;font:400 15px/1.45 'Atkinson Hyperlegible',sans-serif;color:#3A4150")}>The attorney listings below are <strong>sample examples</strong> showing how a referral would work — not real firms or endorsements. A production version would connect to a licensed-attorney directory for {stateLabel}.</p>
      </div>
      <div style={css("padding:16px;border-radius:14px;background:#E8F6EE;border:2px solid #14181F")}>
        <p style={css("margin:0;font:400 16px/1.45 'Atkinson Hyperlegible',sans-serif;color:#25302B")}>Your case file — timeline, documents, and the exemption analysis — exports as one PDF you control.</p>
      </div>
      <div style={css("display:flex;flex-direction:column;gap:12px")}>
        {LAWYERS.map((l, i) =>
          <div key={i} style={css("padding:18px;border-radius:16px;border:2px solid #14181F;background:#fff;display:flex;flex-direction:column;gap:8px")}>
            <div style={css("display:flex;justify-content:space-between;align-items:baseline;gap:10px")}>
              <span style={css("font:700 19px 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>{l.name}</span>
              <span style={css("padding:6px 10px;border-radius:8px;background:#E8F6EE;border:2px solid #1F8A4C;font:700 13px 'IBM Plex Mono',monospace;color:#136B3C")}>{l.match}</span>
            </div>
            <p style={css("margin:0;font:400 16px/1.45 'Atkinson Hyperlegible',sans-serif;color:#3A4150")}>{l.detail}</p>
            <div style={css("display:flex;gap:8px;flex-wrap:wrap")}>
              <span style={css("padding:7px 11px;border-radius:8px;background:#F0EDE5;font:600 13px 'IBM Plex Mono',monospace;color:#14181F")}>{l.fee}</span>
              <span style={css("padding:7px 11px;border-radius:8px;background:#F0EDE5;font:600 13px 'IBM Plex Mono',monospace;color:#14181F")}>{l.langs}</span>
            </div>
            <button onClick={() => {
              const path = printLetter('WorkLaw case file', buildCaseFile({ youName, employerName, locationLabel, issue, caseOpened, strength, unpaidHours, owedEstimate, entries }));
              setExportPath(path); setConsultSent(l.name);
            }} style={css("margin-top:4px;padding:15px;border-radius:12px;border:none;background:#2B3AA8;color:#fff;font:700 17px 'Atkinson Hyperlegible',sans-serif;cursor:pointer")}>Export case file for this firm</button>
            {consultSent === l.name &&
              <p style={css('margin:2px 0 0;font:400 14px/1.45 \'Atkinson Hyperlegible\',sans-serif;color:' + (exportPath === 'failed' ? '#B3264F' : '#136B3C'))}>
                {exportPath === 'download' ? 'Your case file downloaded as a .txt file (your browser blocked the new-tab preview) — attach it when you contact a firm.'
                  : exportPath === 'failed' ? 'Export did not work in this browser — note your case details from the dashboard manually and share them when you contact a firm.'
                  : 'Your case file opened in a new tab — save it as PDF and attach it when you contact a firm.'}
                {' '}(This is a sample listing; no message was sent.)
              </p>
            }
          </div>
        )}
      </div>
    </div>
  );

  const SCREENS = {
    onboarding: Onboarding, home: HomeScreen, chat: Chat, wizard: Wizard, log: Log,
    doc: Doc, letter: Letter, strength: Strength, rights: RightsLib, lawyers: Lawyers
  };
  const Current = SCREENS[screen] || HomeScreen;

  const altHome = screen === 'home' ? homeMode : null;
  const screenBg = altHome === 'action' ? '#2B3AA8' : altHome === 'plain' ? '#FFFFFF' : '#FFFDF8';
  const statusColor = altHome === 'action' ? '#fff' : '#14181F';

  return (
    <div className="device">
      <div className="screen" style={css('background:' + screenBg)}>
        <div className="statusbar" aria-hidden="true" style={css('color:' + statusColor)}>
          <span>9:41</span><span style={css("letter-spacing:2px")}>▮▮▮ ᯤ ▰</span>
        </div>
        <main className="scrollarea" ref={mainRef} tabIndex={-1} style={css("outline:none")}>
          {/* Call the screen as a function (not <Current/>) so it inlines into this
              stable tree instead of remounting on every keystroke — remounting was
              destroying the chat/onboarding/letter inputs and jumping scroll. */}
          {Current()}
          {screen === 'home' && (() => {
            const dark = altHome === 'action';
            return (
              <div style={css("margin:0 22px 30px;padding-top:16px;border-top:1px solid " + (dark ? 'rgba(255,255,255,.25)' : 'rgba(20,24,31,.14)'))}>
                <p style={css("margin:0 0 10px;font:400 13px/1.5 'Atkinson Hyperlegible',sans-serif;color:" + (dark ? '#DDE2FF' : '#4A5162'))}>Everything you enter stays in this browser on this device — nothing is uploaded. On a shared or work computer, delete your case when you’re done.</p>
                <div style={css("display:flex;gap:10px;flex-wrap:wrap")}>
                  <button onClick={startFreshCase} style={css("padding:12px 16px;border-radius:12px;border:2px solid " + (dark ? 'rgba(255,255,255,.55)' : '#14181F') + ";background:transparent;color:" + (dark ? '#fff' : '#14181F') + ";font:700 15px 'Atkinson Hyperlegible',sans-serif;cursor:pointer;min-height:44px")}>Start a fresh case</button>
                  <button onClick={clearCase} style={css("padding:12px 16px;border-radius:12px;border:2px solid " + (dark ? 'rgba(255,255,255,.55)' : '#B3264F') + ";background:transparent;color:" + (dark ? '#fff' : '#B3264F') + ";font:700 15px 'Atkinson Hyperlegible',sans-serif;cursor:pointer;min-height:44px")}>Delete my case &amp; start over</button>
                </div>
              </div>
            );
          })()}
        </main>
        {showTabs &&
          <nav aria-label="Primary" style={css("flex:none;border-top:2px solid rgba(20,24,31,.14);background:#FFFDF8;padding:10px 12px 26px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px")}>
            {TAB_DEFS.map(([k, icon, label]) =>
              <button key={k} onClick={nav(k)} aria-current={screen === k ? 'page' : undefined} style={css('display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px;border-radius:12px;border:2px solid ' + (screen === k ? '#14181F' : 'transparent') + ';background:' + (screen === k ? '#FFF4D6' : 'transparent') + ';color:#14181F;cursor:pointer;min-height:56px')}>
                <span aria-hidden="true" style={css("font:700 19px 'IBM Plex Mono',monospace")}>{icon}</span>
                <span style={css("font:700 12px 'Atkinson Hyperlegible',sans-serif")}>{label}</span>
              </button>
            )}
          </nav>
        }
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
