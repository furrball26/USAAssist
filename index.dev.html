<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14181F">
<!-- Defense-in-depth CSP for the GitHub Pages dev/source page. 'unsafe-inline'/'unsafe-eval'
     in script-src are required because this file transpiles + runs its app code in-browser via
     Babel standalone (inline <script type="text/babel">, no build step); the production
     index.html is fully self-contained (no CDN, no inline-script execution model change) and its
     head is maintained separately (see build.mjs). frame-ancestors cannot be set via <meta> and
     is handled at the HTTP-header level by the Vercel shell. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://cdn.jsdelivr.net https://raw.githubusercontent.com; object-src 'none'; base-uri 'none';">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232B3AA8'/%3E%3Ctext x='32' y='47' font-size='42' text-anchor='middle' fill='white' font-family='Georgia,serif'%3E%C2%A7%3C/text%3E%3C/svg%3E">
<title>WorkLaw — know your rights at work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:#F3EFE7;
    font-family:'Atkinson Hyperlegible',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    color:#14181F;
  }
  a{color:#2B3AA8}
  a:hover{color:#1B2778}
  button{font-family:inherit}
  input{font-family:inherit}
  ::-webkit-scrollbar{width:0;height:0}
  /* R6: the browser default focus ring (a thin blue outline) is only
     ~1.5:1 against the Action-first home's navy #2B3AA8 background —
     effectively invisible (WCAG 1.4.11 needs >=3:1). A single outline
     color can't clear 3:1 on both a navy hero AND a white/cream screen,
     so use a two-tone "halo" ring — a white inner ring plus a dark outer
     ring — which stays high-contrast against any background this app
     uses (mirrors the .device / .screen ".device" ink-border language). */
  :focus-visible{ outline:3px solid #fff; outline-offset:2px; box-shadow:0 0 0 5px #14181F; }
  /* File inputs render the bare OS-default picker button (unstyled, far under
     the app's 44px hit-target bar) and can't be restyled directly — the .fileInputHidden
     class below visually hides the real <input> (kept focusable/keyboard-operable,
     not display:none) while a styled <label htmlFor> sibling acts as the visible
     44px+ button; clicking or keyboard-activating either opens the file dialog. Put
     the focus ring on that visible label, since the ring on the hidden input itself
     (clipped to 1px) would be imperceptible. */
  .fileInputHidden{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  input.fileInputHidden:focus-visible + label{ outline:3px solid #fff; outline-offset:2px; box-shadow:0 0 0 5px #14181F; }
  /* Doc Review's file input is a CHILD of its label (the whole card), not a
     sibling — :focus-within puts the same ring on the card when the hidden
     input inside it is focused. */
  label.fileInputCard:focus-within{ outline:3px solid #fff; outline-offset:2px; box-shadow:0 0 0 5px #14181F; }
  @keyframes popin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
  /* Welcome illustration (WorkerArt / UsaTileMap). Lives here rather than in
     the component because automation/render-shell.mjs injects THIS style block
     verbatim into the Vercel shell — a keyframe defined anywhere else would
     animate on Pages and sit dead on worklaw.app. */
  @keyframes wlPop{0%{opacity:0;transform:scale(.5)}65%{transform:scale(1.1)}100%{opacity:1;transform:scale(1)}}
  @keyframes wlRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @keyframes wlSway{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
  .wlTile{opacity:0;animation:wlPop .34s cubic-bezier(.34,1.56,.64,1) forwards;transform-origin:center}
  .wlWorker{opacity:0;animation:wlRise .55s ease-out forwards}
  .wlWorker .wlBob{animation:wlSway 3.4s ease-in-out infinite;transform-origin:center bottom}
  /* The intro is decoration on a screen people reach while stressed; motion is
     never load-bearing. Reduced-motion users get the finished frame instantly,
     not a slower version of the same thing. */
  @media (prefers-reduced-motion:reduce){
    .wlTile,.wlWorker,.wlWorker .wlBob{animation:none!important;opacity:1!important;transform:none!important}
  }
  /* State picker — real state outlines (content/geo/_states.json), same
     treatment as the county map below. SVG shapes rather than HTML buttons
     because the shapes ARE the information: a map of tiles is not a map. The
     labelled <select> alongside carries anyone this doesn't serve. */
  .wlUsMap{width:100%;height:auto;display:block;touch-action:manipulation}
  .wlUsMap path{fill:#fff;stroke:#14181F;stroke-width:1.4;cursor:pointer;
    transition:fill .1s ease;vector-effect:non-scaling-stroke}
  .wlUsMap path:hover{fill:#EEF1FF}
  .wlUsMap path[aria-pressed="true"]{fill:#2B3AA8}
  .wlUsMap path:focus{outline:none;fill:#EEF1FF;stroke:#2B3AA8;stroke-width:3.5}
  .wlUsMap path:focus-visible{stroke:#2B3AA8;stroke-width:3.5}
  /* Map labels. Pointer-transparent so a click always reaches the shape under
     them, and drawn after every path so nothing paints over them. */
  .wlMapLabels{pointer-events:none}
  .wlLabel{font:700 26px 'IBM Plex Mono',monospace;fill:#14181F;paint-order:stroke;
    stroke:#FFFDF8;stroke-width:5;stroke-linejoin:round}
  .wlLeader{stroke:#4A5162;stroke-width:1.6;fill:none;vector-effect:non-scaling-stroke}
  .wlLeaderDot{fill:#4A5162}
  /* County names are words, not codes, so they need to be smaller to fit and
     are only drawn where there is room (see lr in content/geo/<ABBR>.json). */
  .wlCountyLabel{font:700 18px 'Atkinson Hyperlegible',sans-serif;fill:#14181F;
    paint-order:stroke;stroke:#FFFDF8;stroke-width:4;stroke-linejoin:round}
  /* Decorative copy on the welcome screen — no pointer, no focus. */
  .wlUsMapDecor path{fill:#EEF1FF;stroke:#14181F;stroke-width:1.6;
    vector-effect:non-scaling-stroke;cursor:default}
  /* County map. Counties are real Census outlines (content/geo/<ABBR>.json),
     so unlike the state grid the targets are whatever shape and size the
     county actually is — San Bernardino is enormous, Bristol RI is a speck.
     That is exactly why the searchable <select> underneath is the primary
     control and this is the enhancement, not the reverse. */
  .wlCountyMap{width:100%;height:auto;display:block;touch-action:manipulation}
  .wlCountyMap path{fill:#fff;stroke:#14181F;stroke-width:1.6;cursor:pointer;
    transition:fill .1s ease;vector-effect:non-scaling-stroke}
  .wlCountyMap path:hover{fill:#EEF1FF}
  .wlCountyMap path[aria-pressed="true"]{fill:#2B3AA8}
  /* The app's global :focus-visible halo is a box-shadow, which SVG shapes
     ignore — give focused counties a real, visible outline of their own. */
  .wlCountyMap path:focus{outline:none;fill:#EEF1FF;stroke:#2B3AA8;stroke-width:4}
  .wlCountyMap path:focus-visible{stroke:#2B3AA8;stroke-width:4}

  /* Device / app shell */
  #root{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
  .device{
    width:410px;height:864px;max-height:calc(100vh - 32px);
    background:#14181F;border-radius:52px;padding:10px;
    box-shadow:0 24px 60px rgba(20,24,31,.28);
  }
  .screen{
    width:100%;height:100%;background:#FFFDF8;border-radius:42px;
    overflow:hidden;position:relative;display:flex;flex-direction:column;
  }
  .statusbar{
    height:54px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 26px 8px;font:700 14px 'IBM Plex Mono',monospace;color:#14181F;
  }
  .scrollarea{flex:1;overflow-y:auto;overflow-x:hidden}
  /* Topic grid on the Laws tab. One column on a phone so each card keeps a
     readable line length; two from 560px up. `auto-fit` rather than a fixed
     count so a translation that runs long (German, Vietnamese) reflows to one
     column on its own instead of squeezing the words. */
  .catgrid{ display:grid; grid-template-columns:1fr; gap:12px; }
  @media (min-width:560px){ .catgrid{ grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); } }
  /* Interaction-state utilities — most interactive elements only had a resting
     state and a keyboard :focus-visible ring, with no hover or pressed feedback
     for a mouse/trackpad user. .hoverfx suits plain white/cream surfaces (it
     swaps the background to the app's light-blue tint). .surfacefx is the
     companion for elements that already carry their OWN inline background
     color (colored cards, selected pills, the translucent LocationPill on a
     navy hero) — a flat background swap would fight that color, so it darkens
     whatever is already there via filter:brightness instead. Both add a
     slightly stronger :active (pressed) state plus a 1px press-down nudge. */
  .hoverfx{transition:background .12s ease, transform .05s ease}
  .hoverfx:hover{background:#EEF1FF !important}
  .hoverfx:active{background:#D9E0FF !important; transform:translateY(1px)}
  .surfacefx{transition:filter .12s ease, transform .05s ease}
  .surfacefx:hover{filter:brightness(.95)}
  .surfacefx:active{filter:brightness(.88); transform:translateY(1px)}
  /* order:2 keeps the tab bar last visually (bottom of the phone/tablet flex
     column) even though it's now first in DOM order (R3) — flex/grid `order`
     only changes paint order, never keyboard tab order, so this restores the
     mobile/tablet look while a screen-reader/keyboard user still reaches the
     nav first, matching its visual-first desktop rail position. */
  .tabbar{ flex:none; order:2; display:grid; grid-template-columns:repeat(3,1fr); gap:4px; padding:10px 12px 26px; border-top:2px solid rgba(20,24,31,.14); background:#FFFDF8; }
  .tabbar-btn{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:9px 2px; min-height:56px; border-radius:12px; cursor:pointer; }

  /* Full-bleed on phones — the real app fills the viewport */
  @media (max-width:520px){
    #root{padding:0}
    .device{width:100vw;height:100vh;height:100dvh;max-height:none;border-radius:0;padding:0;box-shadow:none;background:#FFFDF8}
    .screen{border-radius:0}
    .statusbar{padding-top:env(safe-area-inset-top,0)}
  }

  /* 768–1023px — wide tier: drop the phone bezel/status bar illusion,
     present as a bordered paper card instead of a fake device. */
  @media (min-width:768px) and (max-width:1023.98px){
    #root{ padding:48px 24px; align-items:flex-start; justify-content:center; }
    .device{ width:min(600px,92vw); height:auto; max-height:none; background:transparent; padding:0; border-radius:0; box-shadow:none; }
    .screen{ min-height:calc(100vh - 96px); border-radius:28px; border:2px solid #14181F; box-shadow:0 20px 48px rgba(20,24,31,.14); }
    .statusbar{ visibility:hidden; height:20px; padding:0; }
  }

  /* ≥1024px — desktop tier: full-height app shell, left icon rail replaces
     the bottom tab bar, content column capped for readability. */
  @media (min-width:1024px){
    #root{ padding:0; align-items:stretch; justify-content:stretch; min-height:100vh; }
    .device{ width:100%; height:100vh; height:100dvh; max-height:none; background:transparent; padding:0; border-radius:0; box-shadow:none; }
    .screen{
      display:grid;
      grid-template-columns:104px minmax(0,1fr);
      grid-template-rows:auto 1fr;
      grid-template-areas:"rail status" "rail main";
      border-radius:0; border:none; box-shadow:none;
      height:100%;
      /* R2: at the desktop tier the screen color (set inline as --mode-bg, see
         screenBg in the App component — a fixed cream now that Home is a
         single Standard layout) belongs only on the 680px reading column, not
         flooding the whole viewport. .screen itself becomes the calm beige
         "desk" gutter; !important is required because it overrides the
         same-element inline `background` used at every narrower tier, where
         .screen SHOULD be full-bleed screen-colored. */
      background:#F3EFE7 !important;
    }
    .screen.no-tabbar{ grid-template-columns:1fr; grid-template-areas:"status" "main"; }
    .statusbar{ grid-area:status; visibility:hidden; height:0; padding:0; }
    .scrollarea{ grid-area:main; display:flex; flex-direction:column; align-items:center; padding:48px 40px 64px; }
    /* flex:0 0 auto — at the desktop tier .scrollarea is a fixed-height flex
       column; without this, children default to flex-shrink:1 and get compressed
       below their content height, so a tall screen overflows onto the sibling
       privacy/footer cards. Keep natural height and let .scrollarea scroll instead. */
    .scrollarea > *{ width:100%; max-width:680px; background:var(--mode-bg); flex:0 0 auto; }
    /* design HIGH #8 — a 14%-opacity hairline was the only thing separating the
       rail from the beige desk gutter, unlike every other card/surface boundary
       in the app (buttons, the wide-tier .screen border, etc.), which use a
       solid 2px ink border. That made the desktop tier read as unstyled/
       unfinished rather than an intentional frame. */
    .tabbar{ grid-area:rail; display:flex; flex-direction:column; border-top:none; border-right:2px solid #14181F; padding:28px 8px; gap:10px; background:#FFFDF8; }
    .tabbar-btn{ min-height:64px; padding:10px 4px; }
  }
</style>
<script crossorigin="anonymous" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin="anonymous" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin="anonymous" integrity="sha384-Ux6uBqExf/7ahsSNrA9VI7vuaw6sKjDoVdjdUxmIoL2qdlzFVZ157sTi6JK3Z9Q8" src="https://unpkg.com/@babel/standalone@7.29.8/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect, useCallback } = React;

// Clickjacking defense-in-depth: the GitHub Pages mirror of this app cannot serve
// X-Frame-Options / CSP frame-ancestors HTTP headers (Pages only serves static files),
// so enforce framebusting here in JS before React mounts. This app never legitimately
// frames itself, so any window.top !== window.self means we're embedded by someone
// else's page — break out of the frame. Harmless on worklaw.app, which already blocks
// framing at the header level (belt and suspenders).
if (typeof window !== 'undefined' && window.top !== window.self) {
  window.top.location.href = window.self.location.href;
}

// Base for fetching the content/ dataset. Empty = same-origin (GitHub Pages / local).
// On worklaw.app the Vercel shell sets window.CONTENT_BASE to a jsDelivr URL pinned to the commit.
const CONTENT_BASE = (typeof window !== 'undefined' && window.CONTENT_BASE)
  || (typeof document !== 'undefined' && document.querySelector('meta[name="worklaw-content-base"]') && document.querySelector('meta[name="worklaw-content-base"]').getAttribute('content'))
  || '';
// SHA-pinned fallback source for the same content/ path, tried once if the primary
// CONTENT_BASE fetch fails (network error or non-2xx) before surfacing the error state.
// Bump this SHA as part of routine maintenance so it stays a recent known-good commit.
const CONTENT_FALLBACK_BASE = 'https://raw.githubusercontent.com/furrball26/USAAssist/39d0a0b0a1f33bb31a88c71b341eaccb63f7161b/';
function fetchContentJson(path){
  return fetch(CONTENT_BASE + path)
    .then(r => { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
    .catch(() => fetch(CONTENT_FALLBACK_BASE + path).then(r => { if (!r.ok) throw new Error('http ' + r.status); return r.json(); }));
}

function topicKicker(topic){
  const p = String(topic || '').split('.')[0];
  const m = { overtime:'OVERTIME', minimumWage:'MINIMUM WAGE', discrimination:'DISCRIMINATION',
    disability:'DISABILITY · ADA', retaliation:'RETALIATION', payDiscussion:'PAY TRANSPARENCY',
    payTransparency:'PAY TRANSPARENCY', deadlines:'DEADLINES', leave:'LEAVE', severance:'SEVERANCE',
    wages:'WAGES', termination:'TERMINATION', compensation:'COMPENSATION', nonCompete:'NON-COMPETE' };
  return m[p] || p.replace(/([A-Z])/g, ' $1').replace(/^./, c => c.toUpperCase()).toUpperCase();
}
/* ── Law categories ─────────────────────────────────────────────────
   Plain-language groupings for browsing the dataset, named the way someone
   with a problem would describe it ("Pay & overtime", "Leaving a job") rather
   than the way the data is keyed.

   Mapped by TOPIC PREFIX and curated deliberately, because the prefixes alone
   do not group correctly: age discrimination is spelled four different ways
   across state files (discrimination.age, .ageDiscrimination,
   .protectedClasses.age, .ageCoverage) and tipped minimum wage three
   (minimumWage.tipped, .tippedCash, .tippedCashWage). All of those share a
   prefix, which is why prefix-level grouping is safe here — but anything
   finer would have to reconcile the spellings first, and that is wl-content's
   call, not a rendering decision.

   Every prefix in content/ is claimed by exactly one category (asserted by
   test/law-categories.mjs, which fails if a new prefix ships unmapped or two
   categories claim the same one). Counts today: 492 facts across all eight. */
const US_COUNTY_LABEL = {"Alabama":"COUNTY","Alaska":"BOROUGH","Arizona":"COUNTY","Arkansas":"COUNTY","California":"COUNTY","Colorado":"COUNTY","Connecticut":"COUNTY","Delaware":"COUNTY","Florida":"COUNTY","Georgia":"COUNTY","Hawaii":"COUNTY","Idaho":"COUNTY","Illinois":"COUNTY","Indiana":"COUNTY","Iowa":"COUNTY","Kansas":"COUNTY","Kentucky":"COUNTY","Louisiana":"PARISH","Maine":"COUNTY","Maryland":"COUNTY","Massachusetts":"COUNTY","Michigan":"COUNTY","Minnesota":"COUNTY","Mississippi":"COUNTY","Missouri":"COUNTY","Montana":"COUNTY","Nebraska":"COUNTY","Nevada":"COUNTY","New Hampshire":"COUNTY","New Jersey":"COUNTY","New Mexico":"COUNTY","New York":"COUNTY","North Carolina":"COUNTY","North Dakota":"COUNTY","Ohio":"COUNTY","Oklahoma":"COUNTY","Oregon":"COUNTY","Pennsylvania":"COUNTY","Rhode Island":"COUNTY","South Carolina":"COUNTY","South Dakota":"COUNTY","Tennessee":"COUNTY","Texas":"COUNTY","Utah":"COUNTY","Vermont":"COUNTY","Virginia":"COUNTY","Washington":"COUNTY","West Virginia":"COUNTY","Wisconsin":"COUNTY","Wyoming":"COUNTY"};
const LAW_CATEGORIES = [
  { key:'pay', icon:'money', tint:'#EEF1FF',      label:'Pay & overtime',
    blurb:'Minimum wage, overtime, tips, equal pay, and when you must be paid.',
    prefixes:['minimumWage','overtime','wagePayment','equalPay'] },
  { key:'discrim', icon:'people', tint:'#FFE7EC',    label:'Discrimination & harassment',
    blurb:'Who is protected, what counts, and what an employer must do about it.',
    prefixes:['discrimination','harassment'] },
  { key:'disability', icon:'access', tint:'#E8F6EE',       label:'Disability & accommodations',
    blurb:'Reasonable accommodations and the interactive process.',
    prefixes:['disability'] },
  { key:'retaliation', icon:'megaphone', tint:'#FFF4D6',    label:'Retaliation & speaking up',
    blurb:'Being punished for complaining, whistleblowing, or discussing pay.',
    prefixes:['retaliation','whistleblower','payDiscussion'] },
  { key:'timeoff', icon:'clock', tint:'#F0EDE5',     label:'Time off & breaks',
    blurb:'Family and medical leave, sick time, and meal breaks.',
    prefixes:['leave','mealBreak'] },
  { key:'leaving', icon:'exit', tint:'#EEF1FF',       label:'Leaving a job',
    blurb:'Final paycheck timing, severance agreements, and non-competes.',
    prefixes:['final-pay','severance','nonCompete'] },
  { key:'deadlines', icon:'alarm', tint:'#FFE7EC',     label:'Deadlines to act',
    blurb:'How long you have before a claim expires. These are unforgiving.',
    prefixes:['deadlines'] },
  { key:'remedies', icon:'scale', tint:'#E8F6EE',   label:'What you can recover',
    blurb:'Back pay, damages, attorney’s fees, and where to file.',
    prefixes:['remedies','enforcement'] },
];
// prefix -> category key, built once.
const TOPIC_PREFIX_CATEGORY = (() => {
  const m = {};
  LAW_CATEGORIES.forEach(c => c.prefixes.forEach(p => { m[p] = c.key; }));
  return m;
})();
function topicPrefix(topic){ return String(topic || '').split('.')[0]; }
function categoryOfTopic(topic){ return TOPIC_PREFIX_CATEGORY[topicPrefix(topic)] || null; }
function factsInCategory(facts, catKey){
  return (facts || []).filter(f => categoryOfTopic(f.topic) === catKey);
}

// Only ever render an https:// URL as an href — guards against a malformed/malicious
// javascript:, data:, or other scheme reaching an <a href> from content data.
function safeUrl(u){ return (typeof u === 'string' && /^https:\/\//i.test(u)) ? u : null; }
function factValStr(v){ return Array.isArray(v) ? v.join(', ') : (v == null ? '' : String(v)); }
function factByTopic(facts, topic){ return (facts || []).find(f => f.topic === topic); }
function factsByPrefix(facts, prefix){ return (facts || []).filter(f => String(f.topic || '').split('.')[0] === prefix); }
// First matching fact across a list of candidate topic names, in priority order (varies by state).
function stateFactFor(facts, topics){ for (const t of topics) { const f = factByTopic(facts, t); if (f) return f; } return null; }

// Which deadline topics matter most for a given issue type, grouped into priority
// TIERS (array of arrays). Topics within the same tier are jurisdiction-equivalent —
// e.g. the federal "eeocCharge" fact and a state's own "discriminationComplaint" /
// "fehaComplaint" fact are the SAME deadline concept (the discrimination-charge
// window), just named differently per file. They must therefore compete on equal
// footing (state wins ties), not on keyword-list position, or a federal fact
// earlier in a flat list always beats the state's own same-tier fact.
// If no tier matches, pickDeadlineFact returns null rather than guessing at an
// unrelated deadline — callers fall back to the federal fact/banner.
function deadlineKeywordsFor(issueKey){
  switch (issueKey) {
    case 'wage': return [['wageclaim', 'equalpayact']];
    case 'harassment': return [['eeoccharge', 'discriminationcomplaint', 'fehacomplaint']];
    case 'discrimination': return [['eeoccharge', 'discriminationcomplaint', 'fehacomplaint']];
    case 'termination': return [['eeoccharge', 'discriminationcomplaint', 'fehacomplaint'], ['wageclaim']];
    default: return [];
  }
}
function pickDeadlineFact(facts, issueKey){
  const dl = factsByPrefix(facts, 'deadlines');
  if (!dl.length) return null;
  for (const tier of deadlineKeywordsFor(issueKey)) {
    const hit = dl.find(f => tier.some(kw => String(f.topic || '').toLowerCase().includes(kw)));
    if (hit) return hit;
  }
  return null;
}
// Resolve the single most-relevant deadline across BOTH state and federal facts.
// Tier priority is the OUTER loop so a higher-priority tier (e.g. the
// discrimination-charge window) beats a lower-priority tier in either file (e.g. a
// wage-claim deadline). WITHIN a tier the state's own fact wins over federal — a
// state's "discriminationComplaint"/"fehaComplaint" fact is that state's version of
// the federal "eeocCharge" fact, not a lesser concern, so it must not be hidden
// behind the federal fact merely because "eeoccharge" heads the topic list.
// Without tiering, `pickDeadlineFact(stF) || pickDeadlineFact(fedF)` let a low-priority
// state wage deadline suppress the operative federal discrimination-charge deadline —
// and a flat keyword-priority list let the federal charge fact suppress a state's own
// (same-tier) charge-deadline fact, disagreeing with the Case Strength screen.
function pickDeadlineFactAcross(stateFacts, fedFacts, issueKey){
  const stDl = factsByPrefix(stateFacts, 'deadlines');
  const fedDl = factsByPrefix(fedFacts, 'deadlines');
  for (const tier of deadlineKeywordsFor(issueKey)) {
    const stHit = stDl.find(f => tier.some(kw => String(f.topic || '').toLowerCase().includes(kw)));
    if (stHit) return stHit;
    const fedHit = fedDl.find(f => tier.some(kw => String(f.topic || '').toLowerCase().includes(kw)));
    if (fedHit) return fedHit;
  }
  return null;
}

// on — worded to the concrete event that actually starts each issue's limitations
// clock (a payday, a firing, an incident, receiving a document), not a generic
// "date this happened" for every issue, so the field reads as answerable at a glance.
function eventDateLabelFor(issueKey){
  switch (issueKey) {

    case 'termination': return 'Date you were let go';
    case 'harassment': return 'Date of the most recent incident';

    case 'document': return 'Date you received the document';
    default: return 'Date this happened';
  }
}

// Days-per-unit for the deadline-window parser below. Deliberately coarse (a month is
// always treated as 30 days, a year as 365) — good enough for a conservative estimate,
// and erring slightly short (not long) on a 30/31-day month is the safe direction.
function unitToDays(unit){
  const u = String(unit || '').toLowerCase();
  if (u.indexOf('year') === 0) return 365;
  if (u.indexOf('month') === 0) return 30;
  return 1; // day / days
}

// Parses a deadline fact's `value` text (e.g. "180 days", "2 years (3 if willful)",
// "21 days to consider, 7 days to revoke") into the SHORTEST clearly-stated period, in
// days, that a worker should treat as the operative clock — never the longest or most
// optimistic reading of an ambiguous string. Returns null (never a guess) when the text
// has no clean "<number> <day|month|year>(s)" pattern to anchor on; callers must fall
// back to showing the duration text alone rather than compute a date they can't support.
//
// One exception to "always take the shortest number": an OWBPA-style dual window
// ("X days to consider" / "Y days to revoke") is TWO DIFFERENT clocks for two different
// actions — deciding whether to sign, vs. taking back a signature already given — not
// competing readings of the same deadline. Blindly taking the smaller number there
// (the revocation period, which only starts running AFTER signing) would understate the
// time a worker actually has to decide whether to sign in the first place. When a
// "to consider"/"to review" period is named, that one wins.
function parseDeadlineWindow(factValue){
  const text = String(factValue == null ? '' : factValue).trim();
  if (!text) return null;
  const considerM = text.match(/(\d+(?:\.\d+)?)\s*(day|days|month|months|year|years)\s*(?:to\s+consider|to\s+review|for\s+consideration)\b/i);
  if (considerM) {
    const n = parseFloat(considerM[1]);
    if (isFinite(n) && n > 0) return { days: Math.round(n * unitToDays(considerM[2])) };
  }
  const candidates = [];
  // A chain of numbers sharing ONE trailing unit ("180 or 300 days" — the federal EEOC
  // fact's actual wording) — every number in the chain is a candidate at that unit, not
  // just the one immediately adjacent to the unit word, or the shorter "180" would never
  // be seen at all.
  const consumed = [];
  const chainRe = /(\d+(?:\.\d+)?(?:\s*(?:,|or|and)\s*\d+(?:\.\d+)?)+)\s*(day|days|month|months|year|years)\b/gi;
  let cm;
  while ((cm = chainRe.exec(text))) {
    consumed.push([cm.index, cm.index + cm[0].length]);
    const unitDays = unitToDays(cm[2]);
    cm[1].split(/,|or|and/i).forEach(part => {
      const n = parseFloat(part);
      if (isFinite(n) && n > 0) candidates.push(Math.round(n * unitDays));
    });
  }
  // Standalone "<number> <unit>" pairs not already covered by a chain match above.
  const re = /(\d+(?:\.\d+)?)\s*(day|days|month|months|year|years)\b/gi;
  let m;
  while ((m = re.exec(text))) {
    if (consumed.some(([s, e]) => m.index >= s && m.index < e)) continue;
    const n = parseFloat(m[1]);
    if (!isFinite(n) || n <= 0) continue;
    candidates.push(Math.round(n * unitToDays(m[2])));
  }
  if (!candidates.length) return null;
  return { days: Math.min(...candidates) };
}

// Computes a conservative, date-anchored deadline from an eventDate ("YYYY-MM-DD",
// LOCAL calendar day — same convention as dateInputValue/the Log date fields, so a
// worker west of UTC never sees their trigger date silently shift) and a deadline
// fact's value text. Returns null (never a fabricated date) whenever either input is
// missing, the date string is malformed, or parseDeadlineWindow can't cleanly parse the
// fact text — a screen that can't compute a real date must fall back to the duration
// text alone rather than show a number it can't stand behind.
function computeDeadlineFromEvent(eventDateStr, factValue){
  if (!eventDateStr) return null;
  const win = parseDeadlineWindow(factValue);
  if (!win) return null;
  const parts = String(eventDateStr).split('-').map(Number);
  if (parts.length !== 3 || parts.some(n => !isFinite(n))) return null;
  const [y, mo, d] = parts;
  const target = new Date(y, mo - 1, d + win.days);
  if (isNaN(target.getTime())) return null;
  const now = new Date();
  const todayLocal = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const msPerDay = 24 * 60 * 60 * 1000;
  const daysLeft = Math.round((target.getTime() - todayLocal.getTime()) / msPerDay);
  return { targetDate: target, daysLeft, isPast: daysLeft < 0 };
}
// Human-friendly "File by Mon, Mar 4, 2027" formatting for computeDeadlineFromEvent's targetDate.
function formatDeadlineDate(d){
  try { return d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric', year:'numeric' }); }

}

/* Parse a CSS declaration string into a React style object.
   Lets us reuse the design's exact inline-style strings verbatim. */
function css(str){
  const out = {};
  if(!str) return out;
  str.split(';').forEach(decl => {
    const i = decl.indexOf(':');
    if(i === -1) return;
    const rawProp = decl.slice(0, i).trim();
    const value = decl.slice(i + 1).trim();
    if(!rawProp || value === '') return;
    const prop = rawProp.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
    out[prop] = value;
  });
  return out;
}

              onFocus={() => setHovered(full)} onBlur={() => setHovered(null)} />
          );
        })}
        <g className="wlMapLabels" aria-hidden="true">
          {geo.counties.map(c => {
            // `lab` is decided in automation/build-county-geo.mjs, which rejects
            // labels that don't fit their shape OR collide with a neighbour's.
            if (!c.lab) return null;
            const short = c.name.replace(COUNTY_LABEL_STRIP, '');
            const on = value === c.name;
            return (
              <text key={c.fips} x={c.lx} y={c.ly} className="wlCountyLabel" textAnchor="middle"
                style={on ? { fill: '#fff' } : null}>{short}</text>
            );
          })}
        </g>
      </svg>
      {/* Names are drawn only where the county is big enough to hold one —
          about two-thirds of California's 58, but barely a tenth of Texas's
          254, whose counties run ~60 viewBox units across while a name like
          "Nacogdoches" needs ~89. Labelling the rest anyway would stack
          unreadable text on itself. Whatever is unlabelled is still named
          here on hover or focus, and in the list below. aria-live so a
          screen-reader user tabbing the map hears where they are. */}
      <p aria-live="polite" style={css("margin:0;min-height:24px;text-align:center;font:700 16px 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>{shown}</p>
    </div>
  );
}

// FIND-01 (docs/audit-2026-08-29.md) — the wizard's federal salary-level question
// ("Is your salary at least $684/week?") is a self-report against the FEDERAL floor
// only. Several states set a HIGHER white-collar salary floor (content topic
// 'overtime.salaryFloorWeekly', e.g. CA's ~$1,352/week) — a worker who clears $684
// can still fall below a state's own number, and the salary-basis test is a floor,
// not a duties test: failing it is disqualifying no matter how exempt the duties look.
// This only ever DOWNGRADES a standard white-collar 'ex' verdict (r_exec/r_admin/
// r_prof/r_creative/r_comp) to reflect the user's own stored profile salary against
// the state's own numeric fact — it never invents a fact, never hardcodes a state or
// dollar figure, and never flips a 'non' result to 'ex' (clearing the floor is
// necessary, not sufficient — duties still control, so an at/above-floor salary
// leaves the duties-based verdict exactly as computed). It intentionally does
// nothing when: the result isn't one of these salary-basis exemptions (e.g.
// r_outside/r_hce use different tests with no per-state weekly-floor fact here),
// the worker is paid hourly (a different, already-handled failure mode — see
// r_hourly/r_hourly_comp_no), there is no numeric state floor fact, or no salary is
// on file to compare — all of those fall through unchanged rather than guessing.
const SALARY_BASIS_EXEMPT_RESULTS = new Set(['r_exec', 'r_admin', 'r_prof', 'r_creative', 'r_comp']);
// A state may set a higher weekly salary floor for the white-collar exemptions
// than the federal $684. Below its own floor, a state's overtime law owes
// overtime regardless of duties — so an 'ex' verdict reached purely on the
// federal test can be wrong in that state.
//
// This used to recompute the verdict from a salary the user had typed into
// their case profile. Nothing about the user is stored any more, so it returns
// the state's own floor fact instead and the screen states the rule; the reader
// holds the only salary figure and is the one who can apply it. Null when the
// verdict isn't a salary-basis exemption, or the state records no numeric floor
// — never a guess.
function stateSalaryFloorFact(result, wizNode, stateData){
  if (!result || result.v !== 'ex' || !SALARY_BASIS_EXEMPT_RESULTS.has(wizNode)) return null;
  const f = factByTopic((stateData && stateData.facts) || [], 'overtime.salaryFloorWeekly');
  return (f && Number(f.value) > 0) ? f : null;
}

// follow: a seeded button must actually route to a real answer, not a guess or
// the fallback. Each is worded the way a person actually asks it — "what's the
// minimum wage" — because the router (see the `send` precedence comment near
// isOvertime below) now checks the minimumWage/wageClaimDeadline CHAT_TOPICS

// reaches the correct topic instead of being swallowed by the overtime bucket.

// CHAT_TOPICS — routes a question that missed all six reviewed reply buckets
// above onto the SAME sourced content dataset Rights/the wage estimator/the
// wizards already read (content/_federal.json + content/states/*.json), instead
// of the topic-neutral fallback. Modeled directly on stateFactFor/
// pickDeadlineFactAcross: `stateTopics` lists the fact's possible topic KEYS in
// priority order (a state file's own naming for the same concept varies — see
// deadlineKeywordsFor above), tried against the ACTIVE state's own facts only;
// `fedTopics` is tried against federal facts ONLY when it is genuinely the same
// concept under federal law's own name (e.g. a state's "deadlines.wageClaim" and
// the federal "deadlines.flsaWageClaim" are the same wage-claim-deadline concept
// — a state's non-compete ENFORCEABILITY test is not the same concept as the
// federal FTC rule's STATUS, so nonCompete below has no fedTopics fallback).
// This router NEVER authors legal text: every substantive word in the reply is
// the matched fact's own `summary`, its own `citation`, and its own `sourceUrl`
// — see chatTopicReply. `frame` is a purely navigational lead-in sentence.
// Match patterns are deliberately worded to avoid the trigger words the six
// buckets above already claim (accommodat/ada/disab, wrongful+terminat/discharg/
// fired, retaliat/fired/terminat/pushed out/let go, severance/release agreement/
// release of claims, discriminat/harass/hostile work.../quid pro quo/unwelcome)
// — a message containing any of those words is claimed by that earlier, more
// specific bucket first.
// isOvertime is the ONE exception: its bare `\bwages?\b` stem would otherwise
// swallow the two topics below whose natural phrasing contains the word "wage"
// — minimumWage ("what's the minimum wage") and wageClaimDeadline ("file a
// wage claim") — the same FIND-05 failure mode as the wrongful-termination/
// retaliation stem collision (see the isWrongfulTermination comment in `send`).
// So `send` checks THOSE TWO CHAT_TOPICS entries specifically BEFORE isOvertime,
// and only falls through to isOvertime — then the remaining CHAT_TOPICS entries
// — once neither has matched. The other four topics here (finalPay,
// discriminationDeadline, nonCompete, mealBreak) don't share a trigger word with
// any of the six buckets, so their position after isOvertime is unaffected.
// Seeded quick-reply chips are worded the way a person actually asks (see
// PROMPT_TEXTS_BY_ISSUE) — natural phrasing now reaches the right topic.
const CHAT_TOPICS = [
  { id:'finalPay',
    match: lower => /\b(final|last)\s+pay\s*check\b/.test(lower) || /\bfinal\s+pay\b/.test(lower) || /\blast\s+paycheck\b/.test(lower) || /\bwhen\s+(do|will|does)\s+i\s+(get|receive)\s+(my\s+)?(final|last)\s+(pay|paycheck|check)\b/.test(lower),
    stateTopics:['final-pay', 'final-pay.timing', 'final-pay.wageClaim'],
    fedTopics:[], // the FLSA sets no deadline for issuing a final paycheck — this is a state-only concept, so no federal fallback
    frame: name => `Here's the rule on file for ${name} on your final paycheck:` },
  { id:'minimumWage',
    match: lower => /\bminimum\s+(hourly\s+)?(wage|pay|rate)\b/.test(lower) || /\blowest\s+(hourly\s+)?(pay|wage|rate)\b/.test(lower),
    stateTopics:['minimumWage.hourly'],
    fedTopics:['minimumWage.hourly'], // same concept, same topic name in both files
    frame: name => `Here's the minimum-wage rule on file for ${name}:` },
  { id:'wageClaimDeadline',
    match: lower => /\bwage\s+claim\b/.test(lower) || (/\bunderpaid\b/.test(lower) && /\b(deadline|how long|statute of limitations|file)\b/.test(lower)) || /\blabor\s+(board|department|commissioner)\b.*\b(deadline|how long|file)\b/.test(lower),
    stateTopics:['deadlines.wageClaim'],
    fedTopics:['deadlines.flsaWageClaim'], // same wage-claim-deadline concept, federal file's own name for it
    frame: name => `Here's the filing deadline on file for ${name} on unpaid wages:` },
  { id:'discriminationDeadline',
    match: lower => /\beeoc\s+charge\b/.test(lower) || /\bcharge\s+with\s+(the\s+)?eeoc\b/.test(lower) || /\bfile\s+(a\s+|an\s+)?charge\b/.test(lower),
    stateTopics:['deadlines.discriminationComplaint', 'deadlines.fehaComplaint'],
    fedTopics:['deadlines.eeocCharge'], // same discrimination-charge-deadline concept, federal file's own name
    frame: name => `Here's the filing deadline on file for ${name} on a discrimination charge:` },
  { id:'nonCompete',
    match: lower => /\bnon-?compete\b/.test(lower),
    stateTopics:['nonCompete.enforceability'],
    fedTopics:[], // the federal fact here is the FTC RULE'S STATUS, a different question from a state's own enforceability test — not the same concept, so no fallback
    frame: name => `Here's the non-compete rule on file for ${name}:` },
  { id:'mealBreak',
    match: lower => /\bmeal\s+break\b/.test(lower) || /\blunch\s+break\b/.test(lower) || /\brest\s+break\b/.test(lower),
    stateTopics:['mealBreak'],
    fedTopics:[], // the FLSA does not require meal or rest breaks — state-only concept
    frame: name => `Here's the meal/rest-break rule on file for ${name}:` },
];
// Resolve one CHAT_TOPICS entry against the caller's OWN loaded state facts, then
// (only for topics with a genuine federal equivalent) the federal facts, clearly
// labeled FEDERAL — never a different state's facts, never a federal fact
// presented as if it were state-specific. The reply text is always the fact's own
// `summary` (plus, for a state fact from an unreviewed file, the same "(DRAFT —
// pending attorney review)" note Rights/the wizards already show — see stRev
// elsewhere); a topic with neither a state nor a federal fact on file gets an
// honest no-answer, never a guess and never a citation.
function chatTopicReply(topic, stFacts, fedFacts, stName, stFileReviewed){
  const stFact = stateFactFor(stFacts, topic.stateTopics);
  if (stFact) {
    return {
      text: topic.frame(stName) + ' ' + stFact.summary + (stFileReviewed ? '' : ' (DRAFT — pending attorney review)'),
      cites: stFact.citation ? [stFact.citation] : [],
      source: safeUrl(stFact.sourceUrl) ? { url: safeUrl(stFact.sourceUrl), label: stFact.citation || topic.id } : null,
    };
  }
  const fedFact = topic.fedTopics.length ? stateFactFor(fedFacts, topic.fedTopics) : null;
  if (fedFact) {
    const noStateNote = stName === 'your state' ? 'No state-specific rule is on file for that' : `No ${stName}-specific rule is on file for that`;
    return {
      text: `${noStateNote} — here's the FEDERAL rule: ` + fedFact.summary,
      cites: fedFact.citation ? [fedFact.citation] : [],
      source: safeUrl(fedFact.sourceUrl) ? { url: safeUrl(fedFact.sourceUrl), label: fedFact.citation || topic.id } : null,
    };
  }
  return {
    text: `I don't have a sourced answer for ${stName} on that yet. Check Rights for what is on file, or Agencies for where to ask directly.`,
    cites: [],
    source: null,
    cta: { label:'Open Rights', screen:'rights' },
  };
}

// The only thing this site keeps between visits: which state and county the
// reader picked, so the law it shows is theirs without asking twice. It used
// to hold a whole case (profile, log entries, letters, chat) under
// 'worklaw.case.v2'; that key is deliberately not read any more — a new key
// means an old blob of case data is simply never loaded again, rather than
// being migrated into a site that has nowhere to put it.
const STORE_KEY = 'worklaw.place.v1';
const LEGACY_CASE_KEY = 'worklaw.case.v2';
// Coerce both fields to strings. The App() initializers read them with a bare
// `||` fallback, which catches a falsy value but not a truthy one of the wrong
// type — a non-string stateSel (a future schema change, a browser extension,
// devtools tampering) would otherwise reach US_STATE_ABBR lookups and the geo
// fetch as an object and take the render down.
function sanitizePrefs(raw){
  const c = (raw && typeof raw === 'object' && !Array.isArray(raw)) ? raw : {};
  return {
    stateSel: typeof c.stateSel === 'string' ? c.stateSel : '',
    county:   typeof c.county   === 'string' ? c.county   : '',
  };
}
function loadPrefs(){
  try { return sanitizePrefs(JSON.parse(localStorage.getItem(STORE_KEY))); }
  catch(e){ return sanitizePrefs(null); }
}
function savePrefs(obj){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(obj)); return true; }
  catch(e){ return false; }
}
function forgetPlace(){
  try { localStorage.removeItem(STORE_KEY); } catch(e){}
}
// Best-effort one-time cleanup: the old case blob could hold a name, an
// employer, pay figures and dated incident notes. Nothing reads it now, so
// leaving it sitting in localStorage would keep that data on the device for no
// reason at all. Failure is fine — it only ever means the old key stays put.
function dropLegacyCase(){
  try { localStorage.removeItem(LEGACY_CASE_KEY); } catch(e){}
}

// Whether this device has already seen the welcome illustration. Deliberately
// NOT part of the case blob: clearing a case must not replay the intro (see
// the initial-screen comment in App), and a failed/blocked localStorage read
// should land someone in the app rather than trap them on a splash screen —
// so every failure path here returns "already seen".
const SEEN_WELCOME_KEY = 'worklaw.seenWelcome.v1';
function hasSeenWelcome(){
  try { return localStorage.getItem(SEEN_WELCOME_KEY) === '1'; }
  catch(e){ return true; }
}
function markWelcomeSeen(){
  try { localStorage.setItem(SEEN_WELCOME_KEY, '1'); } catch(e){ /* best-effort; a repeat intro is harmless */ }
}
function money(n){ return '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 }); }
// The date-input (<input type="date">) value for a JS Date, in the browser's LOCAL
// calendar day — not toISOString().slice(0,10), which is UTC and can land on the
// wrong day for users west of UTC. Used both for the "Date worked" field's default
// (today) and its `max` (no future dates), and to pre-fill it from a stored entry.
function dateInputValue(d){
  d = d || new Date();
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

const MONTHS_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function fmtDate(d){ d = d || new Date(); return MONTHS_FULL[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear(); }

// State wage-remedy facts (`remedies.*`) beyond the federal `remedies.liquidatedDamages`
// this app already reads unconditionally for every wage claim. Keyed by TOPIC NAME, not
// by state — so a future state's analogous fact (MA/NY/WA/OR/NM are expected to add
// these same two topics) gets the identical safe framing automatically, with no
// per-state branching anywhere in the app:
//   - remedies.trebleDamages: a GENERAL unpaid-wages civil remedy. Some states (like
//     Arizona) have no state overtime statute, so an overtime-only shortfall is
//     ordinarily a federal FLSA claim, not this state claim — this only ever applies
//     to hours that were paid nothing at all (bd.unpaidRegHrs), never to an overtime
//     premium differential alone. It is also typically DISCRETIONARY ("may recover"),
//     never presented as an automatic multiplier.
//   - remedies.minimumWageDamages: specific to pay that actually fell below the
//     state's own minimum wage. Only surfaced when the user's own logged rate is
//     demonstrably below that floor (never inferred from "some hours were unpaid"
//     alone) — a state's own facts may still mark it MANDATORY language, so unlike
//     trebleDamages it is not hedged with "may"/"at a court's discretion".
// These are two distinct causes of action for the same shortfall, not cumulative —
// when both are applicable the caller must present them as alternative theories
// (see wageRemedyDashboardNote / wageRemedyLetterSentence), never add them together
// or let either read as a promised outcome.
function applicableWageRemedies(stFacts, bd, rateNum, mwFact){
  const out = [];
  const hasUnpaidWagesClaim = !!(bd && bd.unpaidRegHrs > 0);
  if (!hasUnpaidWagesClaim) return out;
  const treble = factByTopic(stFacts, 'remedies.trebleDamages');
  if (treble) out.push({ fact: treble, discretionary: true });
  const minWage = Number(mwFact && mwFact.value);
  const belowMinimumWage = !!(rateNum > 0 && minWage > 0 && rateNum < minWage);
  if (belowMinimumWage) {
    const mwDamages = factByTopic(stFacts, 'remedies.minimumWageDamages');
    if (mwDamages) out.push({ fact: mwDamages, discretionary: false });
  }
  return out;
}
// Short, honestly-hedged dashboard/card copy for applicableWageRemedies() — third
// person, alongside the existing federal figure, never folded into it.
function wageRemedyDashboardNote(stateSel, remedies){
  if (!remedies || !remedies.length) return null;
  const st = stateSel || 'Your state';
  if (remedies.length > 1) {
    const parts = remedies.map(r => (r.discretionary ? 'discretionary' : 'mandatory') + ' damages under ' + r.fact.citation);
    return st + " law may provide additional damages here through more than one legal theory — for example " + parts.join(', or ') + ". Which theory fits your facts, and whether they can be combined, is a question for an attorney.";
  }
  const r = remedies[0];
  return r.discretionary
    ? st + ' law (' + r.fact.citation + ') may also allow a court, at its discretion, to award additional damages on unpaid wages beyond the figure above.'
    : 'Because the pay rate on file is below ' + st + "'s minimum wage, " + st + ' law (' + r.fact.citation + ') requires an additional mandatory amount on top of the unpaid balance.';
}
// First-person sentence appended to the wage-demand letter (real leverage, sent to
// the employer) for applicableWageRemedies() — only when the claim shape (and, for
// the minimum-wage fact, the logged rate) actually triggers it.
function wageRemedyLetterSentence(stateSel, remedies){
  if (!remedies || !remedies.length) return '';
  const st = stateSel || 'State';
  if (remedies.length > 1) {
    const parts = remedies.map(r => (r.discretionary ? 'discretionary' : 'mandatory') + ' damages under ' + r.fact.citation);
    return ' I also note that ' + st + ' law may provide additional damages here — for example ' + parts.join(', or ') + '.';
  }
  const r = remedies[0];
  return r.discretionary
    ? ' I also note that ' + st + ' law (' + r.fact.citation + ') allows a court, at its discretion, to award additional damages on unpaid wages in a civil action.'
    : ' I also note that because the pay rate reflected here is below ' + st + "'s minimum wage, " + st + ' law (' + r.fact.citation + ') requires payment of the unpaid balance plus an additional mandatory amount.';
}

// Converts a 0-based index into an exhibit letter — A, B, C, … Z, AA, AB, … —
// for the EVIDENCE / DOCUMENTS section below. Plain-text export has no bold or
// numbering widget, so "Exhibit A/B/C" is the only stable, attorney-familiar
// way to let the FULL TIMELINE and a demand letter both reference the same
// document without re-describing it.
function exhibitLetter(n){
  let s = '', i = n + 1;
  while (i > 0) { i--; s = String.fromCharCode(65 + (i % 26)) + s; i = Math.floor(i / 26); }
  return s;
}
// "YYYY-MM-DD" (LOCAL calendar day — see dateInputValue/computeDeadlineFromEvent)
// -> "March 1, 2026" for the packet header. Never uses `new Date(str)` directly
// (UTC parsing) since that can print the wrong day for users west of UTC.
function formatLocalDateStr(s){
  if (!s) return null;
  const parts = String(s).split('-').map(Number);
  if (parts.length !== 3 || parts.some(n => !isFinite(n))) return s;
  const d = new Date(parts[0], parts[1] - 1, parts[2]);
  return isNaN(d.getTime()) ? s : fmtDate(d);
}
// Days between two "YYYY-MM-DD" (LOCAL calendar day — same dateInputValue
// convention as everywhere else above) date-input strings. Used by the
// records-request tracker's status line ("no response after N days" /
// "response received N days later") — never a guess: returns null (never a
// fabricated number) if either string doesn't parse cleanly.
function daysBetweenDateStrs(aStr, bStr){
  const pa = String(aStr || '').split('-').map(Number);
  const pb = String(bStr || '').split('-').map(Number);
  if (pa.length !== 3 || pb.length !== 3 || pa.some(n => !isFinite(n)) || pb.some(n => !isFinite(n))) return null;
  const da = new Date(pa[0], pa[1] - 1, pa[2]);
  const db = new Date(pb[0], pb[1] - 1, pb[2]);
  if (isNaN(da.getTime()) || isNaN(db.getTime())) return null;
  return Math.round((db.getTime() - da.getTime()) / 86400000);
}

// Build a portable, attorney/agency-ready case-file packet from the user's real
// inputs — plain text so it stays copy/paste- and print-friendly through
// printLetter() (see below). Organized as clearly labeled sections rather than
// one flat header + chronological dump, so a reader can jump straight to
// "who are the witnesses" or "what is the claimed deadline" instead of reading
// the whole timeline to find it. Every section is still gracefully OMITTED
// (or shown with a plain "none logged yet" line) when its underlying data is
// missing — this must never throw on an old entry, or a profile, saved before
// the structured witness/statement/document fields (or the deadline
// calculator, or per-workweek pay breakdown) existed. FULL TIMELINE at the end
// keeps every entry, structured or not, as the complete chronological record.
function buildCaseFile(ctx){
  const s = ctx.strength || { label: 'Not started', factors: [] };
  const profile = ctx.profile || {};
  const entries = ctx.entries || [];
  const lines = [];

  lines.push('WORKLAW CASE FILE — ATTORNEY / AGENCY PACKET');
  lines.push('Prepared ' + fmtDate(new Date()));

  // 1. HEADER
  lines.push('');
  lines.push('== HEADER ==');
  lines.push('Worker: ' + (ctx.youName || '[not provided]'));
  // profile has no phone/email/address fields today — these stay defensive
  // (never rendered while absent) so a future contact-capture field surfaces
  // here automatically instead of needing another buildCaseFile change.
  const workerContact = [profile.phone, profile.email].filter(Boolean).join(' · ');
  if (workerContact) lines.push('Worker contact: ' + workerContact);
  lines.push('Employer: ' + (ctx.employerName || '[not provided]'));
  if (profile.employerAddress) lines.push('Employer address: ' + profile.employerAddress);
  lines.push('Location: ' + (ctx.locationLabel || '[not provided]'));
  lines.push('Issue type: ' + (ctx.issue || '[not selected]'));
  const eventDateFmt = formatLocalDateStr(profile.eventDate);
  if (eventDateFmt) lines.push(eventDateLabelFor(ctx.cfgKey) + ': ' + eventDateFmt);
  lines.push('Case opened: ' + fmtDate(new Date(ctx.caseOpened)));

  // 2. KEY DEADLINE
  lines.push('');
  lines.push('== KEY DEADLINE ==');
  const dl = ctx.dl;
  if (dl) {
    const computed = profile.eventDate ? computeDeadlineFromEvent(profile.eventDate, dl.value || dl.summary) : null;
    if (computed) {
      const { targetDate, daysLeft, isPast } = computed;
      lines.push(isPast
        ? 'This deadline may have passed — talk to an attorney immediately, some exceptions exist.'
        : 'File by ' + formatDeadlineDate(targetDate) + ' — about ' + daysLeft + (Math.abs(daysLeft) === 1 ? ' day' : ' days') + ' left.');
      lines.push('Limitations period: ' + (dl.value || dl.summary));
      lines.push(DEADLINE_ESTIMATE_CAVEAT);
    } else {
      // No event date on file yet, or the fact text didn't cleanly parse to a
      // number of days — never fabricate a date (see computeDeadlineFromEvent).
      lines.push(dl.summary || dl.value);
      lines.push(profile.eventDate
        ? 'Could not compute an exact date from the date on file — confirm the exact deadline with the agency or an attorney.'
        : 'Add the date this happened on Home to compute an exact "file by" date.');
    }
  } else if (ctx.cfgKey === 'document') {
    // R10 — no jurisdiction "deadlines" fact exists for document/severance
    // review; same OWBPA general-federal-rule fallback shown on Home/Agencies.
    lines.push('21 days to consider, 7 days to revoke, if this document is a release covered by the Older Workers Benefit Protection Act (29 U.S.C. §626(f)) — a general federal rule, not sourced from state-specific facts. Confirm the exact days stated in your copy.');
  } else {
    lines.push('No jurisdiction-specific filing deadline is tracked for this issue type in this app. Confirm the applicable deadline with the enforcing agency or an attorney before you wait.');
  }

  // 3. CLAIM SNAPSHOT
  lines.push('');
  lines.push('== CLAIM SNAPSHOT ==');
  lines.push('Case strength: ' + s.label + ' (' + s.score + '/100)');
  if (ctx.cfgKey === 'wage') {
    const wizResult = RESULTS_WAGE[ctx.wizNode];
    lines.push('Overtime classification: ' + (wizResult ? wizResult.title : 'Not yet checked — run the overtime exemption check.'));
    if (ctx.owedEstimate > 0) lines.push('Estimated overtime owed: ' + money(ctx.owedEstimate));
    else if (ctx.unpaidHours > 0) lines.push('Unpaid hours logged: ' + ctx.unpaidHours + ' (add an hourly rate or salary to estimate the amount owed)');
    const weeks = (ctx.payBreakdown && ctx.payBreakdown.weeks) || [];
    if (weeks.length) {
      lines.push('Per-workweek hours (Sun–Sat):');
      weeks.forEach(w => {
        lines.push('  Week of ' + w.label + ': ' + w.hours + ' hrs total — ' + w.regHours + ' reg + ' + w.otHours + ' OT' +
          (ctx.rateNum > 0 ? ' — ' + money(w.totalPay) : ''));
      });
    }
  } else {
    lines.push('Claim type: ' + (ctx.caseTitle || ctx.issue || 'Employment issue'));
    if (ctx.cfgKey === 'harassment' || ctx.cfgKey === 'discrimination') {
      const wcfg = wizardConfigFor(ctx.cfgKey);
      const wizResult = wcfg.results[ctx.wizNode];
      lines.push((ctx.cfgKey === 'harassment' ? 'Harassment' : 'Discrimination') + ' self-check: ' + (wizResult ? wizResult.title + ' — informational only, not a legal opinion' : 'Not yet run.'));
    }
  }

  // 4. WITNESSES — skip any Witness entry with no name (nothing an attorney
  // could actually contact), including every pre-structured-fields entry.
  lines.push('');
  lines.push('== WITNESSES ==');
  const witnesses = entries.filter(e => e.tag === 'Witness' && e.witnessName && String(e.witnessName).trim());
  if (witnesses.length) {
    witnesses.forEach((e, i) => {
      const employedNote = e.witnessStillEmployed === 'Yes' ? 'still employed'
        : e.witnessStillEmployed === 'No' ? 'no longer employed'
        : e.witnessStillEmployed ? 'employment status: ' + e.witnessStillEmployed : null;
      const willingNote = e.witnessWilling === 'Yes' ? 'willing to be contacted'
        : e.witnessWilling === 'No' ? 'not willing to be contacted'
        : e.witnessWilling ? 'contact willingness: ' + e.witnessWilling : null;
      const bits = [e.witnessRelationship, employedNote, willingNote].filter(Boolean).join(', ');
      const account = e.body && e.body !== ENTRY_PLACEHOLDER_BODY ? e.body : '';
      let line = (i + 1) + '. ' + e.witnessName;
      if (bits) line += ' — ' + bits;
      if (e.witnessContact) line += ' — ' + e.witnessContact;
      if (account) line += ' — saw: ' + account;
      lines.push(line);
    });
  } else {
    lines.push('(no named witnesses logged yet)');
  }

  // 5. EVIDENCE / DOCUMENTS — skip any Records entry with no document type,
  // same backward-compat rule as witnesses above.
  lines.push('');
  lines.push('== EVIDENCE / DOCUMENTS ==');
  const docs = entries.filter(e => e.tag === 'Records' && e.docType);
  if (docs.length) {
    docs.forEach((e, i) => {
      let line = 'Exhibit ' + exhibitLetter(i) + ': ' + e.docType;
      if (e.docDate) line += ' (dated ' + e.docDate + ')';
      if (e.docParties) line += ' — parties: ' + e.docParties;
      const why = e.body && e.body !== ENTRY_PLACEHOLDER_BODY ? e.body : '';
      if (why) line += ' — ' + why;
      if (e.attachment && e.attachment.name) line += ' [attachment on file: ' + e.attachment.name + ']';
      lines.push(line);
    });
  } else {
    lines.push('(no documents logged yet)');
  }

  // 6. STATEMENTS — skip any Statement entry with no speaker name.
  lines.push('');
  lines.push('== STATEMENTS ==');
  const statements = entries.filter(e => e.tag === 'Statement' && e.speakerName && String(e.speakerName).trim());
  if (statements.length) {
    statements.forEach((e, i) => {
      const quote = e.body && e.body !== ENTRY_PLACEHOLDER_BODY ? e.body : '(no quote recorded)';
      let line = (i + 1) + '. ' + e.speakerName;
      if (e.speakerRole) line += ' (' + e.speakerRole + ')';
      if (e.saidWhere) line += ', ' + e.saidWhere;
      if (e.saidWhen) line += ', ' + e.saidWhen;
      line += ': "' + quote + '"';
      if (e.whoElseHeard) line += ' (also heard by ' + e.whoElseHeard + ')';
      lines.push(line);
    });
  } else {
    lines.push('(no employer/manager statements logged yet)');
  }

  // RECORDS REQUEST — records-request follow-through tracker (see
  // RecordsRequestTracker). Only rendered once the user has actually started
  // tracking a request (a sent date on file) — never shown just because the
  // issue happens to be gated to the tool.
  const rr = profile.recordsRequest;
  if (rr && rr.dateSent) {
    lines.push('');
    lines.push('== RECORDS REQUEST ==');
    lines.push('Sent ' + formatLocalDateStr(rr.dateSent) + (rr.method ? ' via ' + rr.method : '') + '.');
    if (rr.noResponseYet === true) {
      const daysSince = daysBetweenDateStrs(rr.dateSent, dateInputValue());
      lines.push('Status: no response yet' + (daysSince != null && daysSince >= 0 ? ' (' + daysSince + (daysSince === 1 ? ' day' : ' days') + ' so far)' : '') + ' — non-response can itself be relevant.');
    } else if (rr.dateReceived) {
      const gap = daysBetweenDateStrs(rr.dateSent, rr.dateReceived);
      lines.push('Response received ' + formatLocalDateStr(rr.dateReceived) + (gap != null ? ' (' + gap + (gap === 1 ? ' day' : ' days') + ' after the request)' : '') + '.');
    } else {
      lines.push('Status: awaiting confirmation of whether a response has come in.');
    }
    if (rr.produced) lines.push('Produced: ' + rr.produced);
    if (rr.missing) lines.push('Still missing: ' + rr.missing);
  }

  // ADA INTERACTIVE PROCESS — profile.adaLog (see AdaProcessTracker), a plain
  // chronological list of interactions in the order the user logged them.
  // Only rendered once at least one interaction has been logged.
  const adaLog = Array.isArray(profile.adaLog) ? profile.adaLog : [];
  if (adaLog.length) {
    lines.push('');
    lines.push('== ADA INTERACTIVE PROCESS ==');
    lines.push(ADA_PROCESS_GOOD_FAITH_NOTE);
    adaLog.forEach((e, i) => {
      const label = ADA_LOG_WHAT_LABELS[e.what] || e.what || 'Update';
      let line = (i + 1) + '. ' + (e.date ? formatLocalDateStr(e.date) + ' — ' : '') + label;
      if (e.notes) line += ': ' + e.notes;
      lines.push(line);
    });
  }

  // 7. TIMELINE / POSSIBLE RETALIATION — pairs each entry the worker marked
  // 'adverse' with the nearest earlier 'protected' entry and the day-gap
  // between them (see causationPairs). Never asserts retaliation occurred —
  // only surfaces the pattern, hedged, for the attorney to evaluate. Omitted
  // entirely when there isn't at least one dated entry of each kind.
  const causation = causationPairs(entries);
  if (causation.length) {
    lines.push('');
    lines.push('== TIMELINE / POSSIBLE RETALIATION ==');
    lines.push('Courts often look at how close in time an employer\'s action was to a worker\'s protected activity — close timing can be evidence of retaliation, but timing alone is not proof. Not legal advice.');
    causation.forEach((p, i) => {
      const gapPhrase = p.gapDays === 0 ? 'the same day' : (p.gapDays + ' day' + (p.gapDays === 1 ? '' : 's') + ' later');
      lines.push((i + 1) + '. Protected activity (' + fmtDate(p.protectedDate) + '): ' + causalEntryLabel(p.protectedEntry));
      lines.push('   Adverse action (' + fmtDate(p.adverseDate) + ', ' + gapPhrase + '): ' + causalEntryLabel(p.adverseEntry));
      if (p.gapDays <= CAUSATION_CLOSE_GAP_DAYS) lines.push('   — Close timing: ' + p.gapDays + (p.gapDays === 1 ? ' day' : ' days') + ' apart.');
    });
  }

  // 8. FULL TIMELINE — the complete chronological record, unchanged from the
  // original flat dump, so nothing in the log — including pre-structured-
  // fields entries with only a title/body — ever goes missing from the export.
  lines.push('');
  lines.push('== FULL TIMELINE (' + entries.length + ' entries) ==');
  entries.forEach(e => {
    lines.push('• [' + e.tag + '] ' + e.date + ' — ' + e.title + (e.hours ? ' (' + e.hours + ' hrs)' : ''));
    if (e.tag === 'Witness' && e.witnessName) {
      const bits = [e.witnessRelationship, e.witnessStillEmployed ? 'still employed: ' + e.witnessStillEmployed : null,
        e.witnessWilling ? 'willing to be contacted: ' + e.witnessWilling : null, e.witnessContact ? 'contact ' + e.witnessContact : null]
        .filter(Boolean).join(', ');
      lines.push('    Witness: ' + e.witnessName + (bits ? ' (' + bits + ')' : ''));
    }
    if (e.tag === 'Statement' && e.speakerName) {
      const bits = [e.speakerRole, e.saidWhere, e.saidWhen ? 'on ' + e.saidWhen : null, e.whoElseHeard ? 'also heard by ' + e.whoElseHeard : null]
        .filter(Boolean).join(', ');
      lines.push('    Said by: ' + e.speakerName + (bits ? ' (' + bits + ')' : ''));
    }
    if (e.tag === 'Records' && e.docType) {
      const bits = [e.docDate, e.docParties].filter(Boolean).join(', ');
      lines.push('    Document: ' + e.docType + (bits ? ' (' + bits + ')' : ''));
    }
    if (e.body) lines.push('    ' + e.body);
    if (e.attachment && e.attachment.name) lines.push('    [attachment: ' + e.attachment.name + ']');
  });
  if (!entries.length) lines.push('• (no entries logged yet)');

  // 9. DISCLAIMER
  lines.push('');
  lines.push('This case file is legal information the worker compiled themselves. It is not legal advice.');
  return lines.join('\n');
}

// Real export: open a clean print window (Save as PDF); fall back to a .txt
// download if the popup is blocked; returns which path was actually taken
// ('tab' | 'download' | 'failed') so callers can phrase their confirmation
// message accurately instead of always claiming "opened in a new tab".
function printLetter(subject, text){
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  try {
    const w = window.open('', '_blank');
    if (!w) throw new Error('popup blocked');
    w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>' + esc(subject) +
      '</title><style>body{font:15px/1.7 Georgia,serif;color:#111;max-width:640px;margin:48px auto;padding:0 24px;white-space:pre-wrap;overflow-wrap:anywhere}@media print{body{margin:0}}</style></head><body>' +
      esc(text) + '</body></html>');
    w.document.close(); w.focus();
    setTimeout(() => { try { w.print(); } catch(e){} }, 300);
    return 'tab';
  } catch(e){
    try {
      const blob = new Blob([text], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = (subject || 'letter').replace(/[^a-z0-9]+/gi, '-').toLowerCase() + '.txt';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      return 'download';
    } catch(_){
      return 'failed';
    }
  }
}
// Shared with Log()'s local PLACEHOLDER_BODY (kept as a top-level constant so
// buildCaseFile's structured WITNESSES/EVIDENCE/STATEMENTS sections can also
// recognize "no real note was ever typed" and omit the placeholder text from
// an attorney-facing packet, instead of quoting boilerplate as if it were the
// worker's own account).
const ENTRY_PLACEHOLDER_BODY = 'No detail added yet — tap to edit while it is fresh.';
// The date a log entry is actually "about", for causation-gap purposes — prefers
// a kind-specific date the user entered for what the entry describes (Statement's
// "when said", Records' document date) over the entry's own iso (when it was
// LOGGED, which for Witness/freetext entries is the only date on file, but for
// Statement/Records is usually just "today" and would understate real gaps).
// Returns a Date or null (never a fabricated one) so callers can skip entries
// with missing/unparseable dates rather than mis-order the timeline.
function causalEntryDate(e){
  const raw = (e.tag === 'Statement' && e.saidWhen) ? e.saidWhen : (e.tag === 'Records' && e.docDate) ? e.docDate : null;
  if (raw) {
    const parts = String(raw).split('-').map(Number);
    if (parts.length === 3 && parts.every(n => isFinite(n))) {
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      if (!isNaN(d.getTime())) return d;
    }
  }
  if (e.iso) { const d = new Date(e.iso); if (!isNaN(d.getTime())) return d; }
  return null;
}
// Short human description of a log entry for the causation summary/export —
// prefers the worker's own note text over the generic kind title, so "You
// complained to HR about my hours" reads better than "Statement recorded".
function causalEntryLabel(e){
  const body = (e.body && e.body !== ENTRY_PLACEHOLDER_BODY) ? String(e.body).trim() : '';
  const text = body || e.title || e.tag || 'entry';
  return text.length > 100 ? text.slice(0, 97) + '…' : text;
}
// Pairs each classified 'adverse' entry with the nearest classified 'protected'
// entry that happened on or before it, computing the day-gap between them —
// the core "protected activity, then adverse action how soon after" pattern a
// retaliation claim turns on. Only pairs protected-before-adverse (an adverse
// action that came BEFORE any protected activity isn't evidence of retaliation
// for that activity); an adverse entry with no earlier protected entry is left
// unpaired rather than paired with a later one. Returns [] whenever there isn't
// at least one dated 'protected' and one dated 'adverse' entry — callers use
// that to decide whether to render the summary at all. Sorted by the protected
// activity's date, oldest first.
function causationPairs(entries){
  entries = entries || [];
  const dated = entries.map(e => ({ e, d: causalEntryDate(e) })).filter(x => x.d);
  const protectedEvents = dated.filter(x => x.e.causalRole === 'protected');
  const adverseEvents = dated.filter(x => x.e.causalRole === 'adverse');
  if (!protectedEvents.length || !adverseEvents.length) return [];
  const pairs = [];
  adverseEvents.forEach(adv => {
    let best = null;
    protectedEvents.forEach(prot => {
      if (prot.d <= adv.d && (!best || prot.d > best.d)) best = prot;
    });
    if (best) {
      const gapDays = Math.round((adv.d.getTime() - best.d.getTime()) / 86400000);
      pairs.push({ protectedEntry: best.e, protectedDate: best.d, adverseEntry: adv.e, adverseDate: adv.d, gapDays });
    }
  });
  pairs.sort((a, b) => a.protectedDate - b.protectedDate);
  return pairs;
}
// A gap this short or shorter gets visually highlighted — informational only,
// not a legal threshold; courts weigh close timing as one factor among many.
const CAUSATION_CLOSE_GAP_DAYS = 30;

/* ── App ──────────────────────────────────────────────────────────── */

function App(){
  const [saved] = useState(loadPrefs); // one-time read of the two things we remember

  // The app used to persist a whole case — profile, log entries, letters, chat.
  // It doesn't any more: this is a law reference, and the only thing worth
  // remembering between visits is where the reader said they work, so the law
  // on screen is theirs. Everything else is browse state that starts fresh.
  const [screen, setScreen] = useState(() => {
    const histScreen = typeof window !== 'undefined' && window.history.state && window.history.state.screen;
    if (typeof histScreen === 'string' && histScreen !== 'welcome') return histScreen;
    // First-ever visit gets the welcome illustration; after that, straight to
    // the law. Gated on its own device-level key (see hasSeenWelcome).
    return hasSeenWelcome() ? 'home' : 'welcome';
  });
  const [stateSel, setStateSel] = useState(() => saved.stateSel || '');
  const [county, setCounty] = useState(() => saved.county || '');
  const [federal, setFederal] = useState(null);
  const [stateData, setStateData] = useState(undefined); // undefined = loading, null = none, object = loaded
  const [contentErr, setContentErr] = useState(false);
  const [stateErr, setStateErr] = useState(false); // true = state dataset fetch failed (distinct from "no extra state rule")
  // Self-check (Wizard) position. Transient: a half-finished "am I exempt?"
  // check is not something to restore three weeks later.
  const [wizNode, setWizNode] = useState('start');
  const [wizPath, setWizPath] = useState([]);
  const [wizKey, setWizKey] = useState(null);
  // Which law category the Laws tab is showing (null = the topic grid).
  // Restored from the history entry for the same reason `screen` is: browsers
  // keep pushState/replaceState `state` across a reload even though React
  // state resets, so a reload returns to the topic being read.
  const [lawCat, setLawCat] = useState(() => {
    const h = typeof window !== 'undefined' && window.history.state && window.history.state.lawCat;
    return typeof h === 'string' ? h : null;
  });
  const [countyQuery, setCountyQuery] = useState(''); // text filter over the county <select>

  const mainRef = useRef(null);
  const firstRender = useRef(true);
  // On navigation, move focus (and scroll) to the top of the main region so
  // keyboard/screen-reader users land on the new screen instead of being stranded
  // where the just-unmounted button was. Skip the initial mount.
  useEffect(() => {
    if (firstRender.current) { firstRender.current = false; return; }
    const el = mainRef.current;
    if (el) { el.scrollTop = 0; el.focus({ preventScroll: true }); }
  }, [screen]);

  // F-history — wire in-app navigation to the browser History API so
  // Back/Forward step through the site instead of leaving it on the very first
  // press. Same URL throughout (no hash/query routing) — only the pushState
  // `state` object changes, which is enough for popstate to restore a position.
  //
  // `lawCat` rides along with `screen`. On a browse-first site, opening a topic
  // is a navigation in every sense that matters to a reader: drilling into
  // "Leaving a job" and pressing Back has to return to the topic grid, not
  // leave the site. It is not a screen change (the Laws tab renders both), so
  // without this the topic would be invisible to history.
  const skipNextPush = useRef(true); // the first effect run just mirrors the mount-time replaceState below — don't double it into a push
  const fromPopState = useRef(false); // true while applying a Back/Forward-driven set*, so that change doesn't itself push a new (redundant) entry
  useEffect(() => {
    // Stamp the CURRENT history entry with the position we're actually
    // rendering (mount-time restore above already picked the screen, if any)
    // so a subsequent Back from here — with nothing of ours pushed below it —
    // leaves the app normally instead of trapping the user in a loop.
    window.history.replaceState({ screen, lawCat }, '');
    const onPop = (e) => {
      if (!e.state || typeof e.state.screen !== 'string') return; // an entry from before this app existed — let the browser's own navigation stand
      fromPopState.current = true;
      setScreen(e.state.screen);
      setLawCat(typeof e.state.lawCat === 'string' ? e.state.lawCat : null);
    };

    return () => window.removeEventListener('popstate', onPop);

  useEffect(() => {
    if (skipNextPush.current) { skipNextPush.current = false; return; }
    if (fromPopState.current) { fromPopState.current = false; return; }
    window.history.pushState({ screen, lawCat }, '');
  }, [screen, lawCat]);

  // Remember the place, and nothing else — and only once there is a place to

  // rather than an empty record announcing they were here.
  useEffect(() => {

  }, [stateSel, county]);

      .then(d => { if (d) setFederal(d); else setContentErr(true); })

  useEffect(() => {
    const ab = US_STATE_ABBR[stateSel];

      .then(d => { if (!ignore) setStateData(d); })

  }, [stateSel]);

  const nav = useCallback(k => () => setScreen(k), []);

  const locationLabel = [county && county !== '—' ? county : '', stateSel].filter(Boolean).join(', ') || 'Nowhere set yet';
  // The welcome illustration is the one screen with no tab bar — it is the
  // orientation before the app, not a destination inside it.
  const showTabs = screen !== 'welcome';

  // The state claim deadline shown elsewhere and this federal FLSA lawsuit
  // statute of limitations are two DIFFERENT clocks. Rendered as its own
  // bordered, labelled block so it never reads as a restatement of the
  // deadline above it.
  //
  // This used to carry a second, dark variant for the retired Action-first
  // home, which composited two translucent layers and needed its own contrast
  // test. There is one surface now, and it is light.
  const FlsaSolNote = () => (

  // Shows where the law on screen is from, and goes back to the map to change

      : "align-self:flex-start;min-height:44px;display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;border:2px solid #14181F;background:#FFF;font:700 15px 'Atkinson Hyperlegible',sans-serif;color:#14181F;cursor:pointer")}><Icon name="location-pin" size={18} /> {locationLabel}</button>
  );

  // wl-ux HIGH #1 — the "{STATE} (DRAFT)" tag appeared with no explanation on the

  // only shown once state data has loaded and is not yet reviewed.
  const DraftStateNotice = ({ stName, extra }) => (
    <div style={css("padding:16px 18px;border-radius:14px;background:#FFF4D6;border:2px solid #14181F")}>
      <p style={css("margin:0 0 4px;font:700 15px 'Atkinson Hyperlegible',sans-serif;color:#14181F")}>Draft — {stName} guidance is pending attorney review</p>
      <p style={css("margin:0;font:400 14px/1.45 'Atkinson Hyperlegible',sans-serif;color:#3A4150")}>These state items are compiled from official sources but not yet verified by counsel.{extra ? ' ' + extra : ''}</p>
    </div>

  /* ── Laws: the whole site's spine ──────────────────────────────────────
     Four stops, in this order: pick a state on the map, pick a county on
     that state's map, choose a plain-language category, read the law.

     Geography leads deliberately. A map is the one part of this interface
     that carries meaning without language — someone who reads no English

  const EXPLAINERS_BY_CAT = {
    pay: [{ label:'Am I exempt from overtime?', desc:"A short Q&A on the federal and state rules for your job.", key:'wage' }],

  const LawsHome = () => {
    const pickState  = st => { setStateSel(st); setCounty(''); setCountyQuery(''); setLawCat(null); };

    const stName = stateSel || '';
    const stAbbr = US_STATE_ABBR[stName] || '';
    const fedFacts = (federal && federal.facts) || [];
    const stFacts = (stateData && stateData.facts) || [];
    const stReviewed = !!(stateData && stateData.reviewed === true);
    const counties = (stName && US_COUNTIES[stName]) || [];

    // ── stop 1 · the country ──

      <div style={css("padding:6px 22px 34px;display:flex;flex-direction:column;gap:18px")}>

          {US_STATE_NAMES.map(n => <option key={n} value={n}>{n}</option>)}
        </select>
        <p style={css("margin:0;font:400 14px/1.45 'Atkinson Hyperlegible',sans-serif;color:#4A5162")}>Legal information, not legal advice. Laws change — confirm anything important with an attorney.</p>

    // ── stop 2 · the county ──
    if (!county && counties.length) return (
      <div style={css("padding:6px 22px 34px;display:flex;flex-direction:column;gap:18px")}>
