  ];
  factors.forEach(f => {
    f.color = f.pct >= 65 ? '#136B3C' : f.pct >= 40 ? '#8A5A00' : '#B3264F';
    f.status = f.pct >= 65 ? 'STRONG' : f.pct >= 40 ? 'PARTIAL' : 'THIN';
  });
  const score = Math.round(factors.reduce((s, f) => s + f.pct, 0) / factors.length);
  const label = n === 0 ? 'Not started' : score < 35 ? 'Early' : score < 55 ? 'Building' : score < 75 ? 'Moderate to strong' : 'Strong';
  return { factors, score, label, count: n };
}

const MONTHS_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function fmtDate(d){ d = d || new Date(); return MONTHS_FULL[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear(); }

// Which letter templates an issue offers. Wage claims get two, in order:
// confirm your classification first, then demand unpaid wages.
const LETTER_LABELS = { 'classification-request':'Classification request', 'wage-demand':'Wage demand', 'complaint':'Complaint letter', 'records-request':'Records request', 'review-time-request':'Request more time', 'accommodation-request':'Accommodation request' };
function letterKindsFor(issueKey, cfgLetterKind){
  let kinds;
  if (issueKey === 'wage') kinds = ['classification-request', 'wage-demand'];
  // The chat's ADA reply promises "I can draft that request from a template" for
  // any accommodation question — make that real for discrimination AND
  // harassment cases (ADA/disability accommodation questions come up under
  // either bucket; see ISSUE_LIST), not just a generic Title VII/complaint
  // letter. Every OTHER issue (wage/termination/document/general) does NOT get
  // an ADA tab here — flow audit finding #4: appending accommodation-request to
  // every issue regardless of fit meant a wage case's Letter screen offered an
  // ADA accommodation tab next to its overtime letters. The chat's ADA reply
  // still honors its promise for those issues via an explicit deep-link CTA
  // (see the chat's adaReply.cta and the Letter screen's activeKind, which
  // renders accommodation-request when explicitly requested even though it is
  // not one of that issue's listed kinds).
  else if (issueKey === 'discrimination') kinds = ['complaint', 'accommodation-request'];
  else if (issueKey === 'harassment') kinds = [cfgLetterKind || 'complaint', 'accommodation-request'];
  else kinds = [cfgLetterKind || 'records-request'];
  return kinds;
}

// Where a given step actually leads, per-step — not a single issue-level letterKind
// check that would send every step (including "log the incident") to the Letter screen.
function stepTarget(cfg, idx){
  const screen = (cfg.stepScreens && cfg.stepScreens[idx]) || cfg.primaryTool;
  const letterType = (cfg.stepLetterTypes && cfg.stepLetterTypes[idx]) || null;
  // Which LOG_KINDS tag a 'log'-screen step should pre-select — e.g. harassment's
  // "identify witnesses" step should open the Log with the Witness form already
  // chosen, not whatever kind was last selected (which defaulted to 'Wage & hour'
  // for every non-wage issue before this existed). Only meaningful when the step
  // actually routes to 'log'; a null/missing entry leaves logKind untouched.
  const logKind = (cfg.stepLogKind && cfg.stepLogKind[idx]) || null;
  return { screen, letterType, logKind };
}

// `done` is keyed by a stable per-step id (cfg.stepIds), not the raw array index —
// so reordering an issue's `steps` (see the wage issue) can't relabel an
// already-checked step as a different one for an in-progress saved case. Falls back
// to the numeric index only if an issue config is missing stepIds.
function stepKey(cfg, idx){
  return (cfg.stepIds && cfg.stepIds[idx]) || idx;
}

// A step can be checked off two ways: the user taps its checkbox (self-report,
// stored in `done`), OR the app can tell from real case data that the step is
// already satisfied — e.g. hours are logged, or the exemption self-check was run
// — so a user who jumps straight to a tool without following the step list isn't
// stuck showing 0 progress on work they actually did. Only applied where the
// signal is unambiguous; every other step still relies on self-report.
function stepAutoDone(id, ctx){
  if (id === 'wage-log-hours') {
    return (ctx.entries || []).some(e => Number(e.hours) > 0 || e.tag === 'Wage & hour');
  }
  if (id === 'wage-exempt-check') {
    return !!RESULTS_WAGE[ctx.wizNode];
  }
  if (id === 'harassment-legal-check') {
    return !!RESULTS_HARASSMENT[ctx.wizNode];
  }
  if (id === 'discrimination-legal-check') {
    return !!RESULTS_DISCRIMINATION[ctx.wizNode];
  }
  if (id === 'termination-track-request') {
    return !!(ctx.profile && ctx.profile.recordsRequest && ctx.profile.recordsRequest.dateSent);
  }
  return false;
}
function isStepDone(cfg, idx, done, ctx){
  const id = stepKey(cfg, idx);
  return !!done[id] || stepAutoDone(id, ctx);
}

// State wage-remedy facts (`remedies.*`) beyond the federal `remedies.liquidatedDamages`
// this app already reads unconditionally for every wage claim. Keyed by TOPIC NAME, not
// by state — so a future state's analogous fact (MA/NY/WA/OR/NM are expected to add
// these same two topics) gets the identical safe framing automatically, with no
// per-state branching anywhere in the app:
//   - remedies.trebleDamages: a GENERAL unpaid-wages civil remedy. Some states (like
//     Arizona) have no state overtime statute, so an overtime-only shortfall is
//     ordinarily a federal FLSA claim, not this state claim — this only ever applies
//     to hours that were paid nothing at all (bd.unpaidRegHrs), never to an overtime
//     premium differential alone. It is also typically DISCRETIONARY ("may recover"),
//     never presented as an automatic multiplier.
//   - remedies.minimumWageDamages: specific to pay that actually fell below the
//     state's own minimum wage. Only surfaced when the user's own logged rate is
//     demonstrably below that floor (never inferred from "some hours were unpaid"
//     alone) — a state's own facts may still mark it MANDATORY language, so unlike
//     trebleDamages it is not hedged with "may"/"at a court's discretion".
// These are two distinct causes of action for the same shortfall, not cumulative —
// when both are applicable the caller must present them as alternative theories
// (see wageRemedyDashboardNote / wageRemedyLetterSentence), never add them together
// or let either read as a promised outcome.
function applicableWageRemedies(stFacts, bd, rateNum, mwFact){
  const out = [];
  const hasUnpaidWagesClaim = !!(bd && bd.unpaidRegHrs > 0);
  if (!hasUnpaidWagesClaim) return out;
  const treble = factByTopic(stFacts, 'remedies.trebleDamages');
  if (treble) out.push({ fact: treble, discretionary: true });
  const minWage = Number(mwFact && mwFact.value);
  const belowMinimumWage = !!(rateNum > 0 && minWage > 0 && rateNum < minWage);
  if (belowMinimumWage) {
    const mwDamages = factByTopic(stFacts, 'remedies.minimumWageDamages');
    if (mwDamages) out.push({ fact: mwDamages, discretionary: false });
  }
  return out;
}
// Short, honestly-hedged dashboard/card copy for applicableWageRemedies() — third
// person, alongside the existing federal figure, never folded into it.
function wageRemedyDashboardNote(stateSel, remedies){
  if (!remedies || !remedies.length) return null;
  const st = stateSel || 'Your state';
  if (remedies.length > 1) {
    const parts = remedies.map(r => (r.discretionary ? 'discretionary' : 'mandatory') + ' damages under ' + r.fact.citation);
    return st + " law may provide additional damages here through more than one legal theory — for example " + parts.join(', or ') + ". Which theory fits your facts, and whether they can be combined, is a question for an attorney.";
  }
  const r = remedies[0];
  return r.discretionary
    ? st + ' law (' + r.fact.citation + ') may also allow a court, at its discretion, to award additional damages on unpaid wages beyond the figure above.'
    : 'Because the pay rate on file is below ' + st + "'s minimum wage, " + st + ' law (' + r.fact.citation + ') requires an additional mandatory amount on top of the unpaid balance.';
}
// First-person sentence appended to the wage-demand letter (real leverage, sent to
// the employer) for applicableWageRemedies() — only when the claim shape (and, for
// the minimum-wage fact, the logged rate) actually triggers it.
function wageRemedyLetterSentence(stateSel, remedies){
  if (!remedies || !remedies.length) return '';
  const st = stateSel || 'State';
  if (remedies.length > 1) {
    const parts = remedies.map(r => (r.discretionary ? 'discretionary' : 'mandatory') + ' damages under ' + r.fact.citation);
    return ' I also note that ' + st + ' law may provide additional damages here — for example ' + parts.join(', or ') + '.';
  }
  const r = remedies[0];
  return r.discretionary
    ? ' I also note that ' + st + ' law (' + r.fact.citation + ') allows a court, at its discretion, to award additional damages on unpaid wages in a civil action.'
    : ' I also note that because the pay rate reflected here is below ' + st + "'s minimum wage, " + st + ' law (' + r.fact.citation + ') requires payment of the unpaid balance plus an additional mandatory amount.';
}

// Generate a self-send letter from the user's real inputs (no fabricated persona).
function buildLetter(ctx){
  const name = (ctx.youName || '').trim() || '[Your name]';
  const emp = (ctx.employerName || '').trim() || '[Employer name]';
  const date = fmtDate(new Date());
  const fed = (ctx.federal && ctx.federal.facts) || [];
  const st = (ctx.stateData && ctx.stateData.facts) || [];
  const cite = (arr, topic, fallback) => { const f = factByTopic(arr, topic); return (f && f.citation) || fallback; };
  const kind = ctx.kind || 'records-request';

  if (kind === 'classification-request') {
    // G4 (docs/flsa-process-gap.md) — this request, like the wage-demand letter below,
    // is protected activity under the FLSA's anti-retaliation provision; say so, matching
    // the retaliation statement the discrimination "complaint" letter already includes.
    const retalCite = cite(fed, 'retaliation.flsa', '29 U.S.C. § 215(a)(3)');
    const subject = 'Request for my FLSA overtime classification';
    const body = date + '\n\n' + emp + '\nAttn: Human Resources / Payroll\n\nRe: ' + subject + '\n\nTo whom it may concern:\n\n' +
      'I am requesting, in writing, the following about my position:\n\n' +
      '1. Whether I am classified as exempt or non-exempt from overtime under the federal Fair Labor Standards Act (29 U.S.C. §§ 201 et seq.).\n' +
      '2. If I am classified as exempt, which exemption the company relies on (for example: executive, administrative, professional, computer, or outside sales) and the basis for it.\n' +
      '3. A copy of the written job description and the job duties the company relies on for that classification.\n\n' +
      'My classification determines whether I am owed overtime for hours worked over 40 in a workweek. Under the FLSA, exempt status turns on my actual salary and job duties, not my job title (29 C.F.R. § 541.2). Please respond in writing within 14 days.\n\n' +
      'Federal law (' + retalCite + ') prohibits retaliation against me for making this request.\n\nSincerely,\n' + name;
    return { title: 'Overtime classification request', subject, body, usesStateLaw: false };
  }

  if (kind === 'review-time-request') {
    const subject = 'Request for time to review before signing';
    const body = date + '\n\n' + emp + '\nAttn: Human Resources\n\nRe: ' + subject + '\n\nTo whom it may concern:\n\n' +
      'I received a document for my review and signature (for example, a severance, separation, or release agreement). I have not yet signed it.\n\n' +
      'I am requesting, in writing:\n\n' +
      '1. Confirmation of the exact deadline I have to consider and sign this document.\n' +
      '2. Confirmation of any period I have to revoke my signature after signing, if applicable.\n' +
      '3. A copy of any attachments referenced in the document (benefit summaries, release scope, etc.) that were not included.\n\n' +
      'I want to fully understand what I am giving up before I sign anything, and I am not agreeing to any deadline shorter than what the document itself provides. Please confirm these dates in writing.\n\nSincerely,\n' + name;
    return { title: 'Request for time to review', subject, body, usesStateLaw: false };
  }

  if (kind === 'wage-demand') {
    const fedCite = cite(fed, 'overtime.basicRule', '29 U.S.C. § 207');
    // FLSA's basic pay requirement (used for hours that never crossed the 40-hr/
    // workweek overtime threshold — those are unpaid straight-time wages, not an
    // overtime violation, and citing § 207 for them would misstate the claim).
    const mwCite = cite(fed, 'minimumWage.hourly', '29 U.S.C. § 206(a)(1)');
    const stOTFacts = factsByPrefix(st, 'overtime');
    const stOT = stOTFacts.find(f => f.topic === 'overtime.daily') || stOTFacts[0];
    // A real state daily-hours overtime trigger (CA/AK's 8-hr/day, CO's 12-hr/day,
    // NV's 24-hour-period rule, etc.) is independent of the FEDERAL 40-hr/WEEK
    // threshold below — it can apply even in a workweek that never reached 40
    // hours, so it must not be gated on bd.otHours.
    const hasRealStateOT = !!(stOT && stOT.citation && stateAddsRealOvertimeProtection(stOTFacts));
    const stClause = hasRealStateOT
      ? ' ' + ctx.stateSel + ' law (' + stOT.citation + ') provides additional overtime protection that may increase what I am owed.'
      : '';
    // FLSA overtime is a PER-WORKWEEK threshold — computeOwedBreakdown only counts
    // hours actually over 40 in their own workweek as overtime (otHours); hours
    // that never crossed 40 that week are unpaid straight-time wages (unpaidRegHrs),
    // not overtime, and must not be described or priced as if they were.
    const bd = computeOwedBreakdown(ctx.entries, ctx.rateNum);
    const hasHours = bd.totalHours > 0 || ctx.unpaidHours > 0;
    const weekPhrase = bd.weekCount > 1 ? 'across ' + bd.weekCount + ' separate workweeks' : 'in a workweek';
    // Describe each priced component separately so the letter never claims "beyond
    // 40 hours" for hours that weren't, and never applies the 1.5x/0.5x overtime
    // multipliers to hours that didn't earn them.
    const claimParts = [];
    if (bd.unpaidOtHrs > 0) claimParts.push(bd.unpaidOtHrs + ' hours worked beyond 40 hours ' + weekPhrase + ' that were paid nothing');
    if (bd.straightOtHrs > 0) claimParts.push(bd.straightOtHrs + ' hours worked beyond 40 hours ' + weekPhrase + ' that were paid only my straight-time rate, without the required overtime premium');
    if (bd.unpaidRegHrs > 0) claimParts.push(bd.unpaidRegHrs + ' hours of straight-time work' + (bd.weekCount > 1 ? ' across ' + bd.weekCount + ' separate workweeks' : '') + ' that were paid nothing at all');
    const claimLine = claimParts.length
      ? 'My records show ' + claimParts.join(', and ') + '.'
      : hasHours
      ? 'My records show ' + (bd.totalHours || ctx.unpaidHours) + ' hours worked that were not paid at the rate required by law.'
      : 'My records show [number] hours worked that were not paid at the rate required by law.';
    // A salaried worker's "regular rate" here is an hourly-equivalent derived from
    // their stated annual salary (see hourlyEquivFromSalary) — say so, since it's
    // an assumption (a standard 40-hour workweek, 29 C.F.R. § 778.113), not a
    // rate the employer already quoted in hourly terms.
    const salaryNote = ctx.payType === 'Salary' && ctx.rateNum > 0
      ? ' (an hourly-equivalent of my salary, assuming a standard 40-hour workweek)'
      : '';
    const compositionParts = [];
    if (bd.unpaidRegHrs > 0) compositionParts.push(bd.unpaidRegHrs + ' hours at my regular rate');
    if (bd.unpaidOtHrs > 0) compositionParts.push(bd.unpaidOtHrs + ' hours at one-and-one-half times my regular rate');
    if (bd.straightOtHrs > 0) compositionParts.push(bd.straightOtHrs + ' hours at one-half times my regular rate, the overtime premium owed on hours already paid straight-time');
    const owedKind = bd.otHours > 0 && bd.unpaidRegHrs > 0 ? 'wages and overtime pay' : bd.otHours > 0 ? 'overtime pay' : 'wages';
    const amountLine = bd.owedEstimate > 0
      ? 'Based on my regular rate of ' + money(ctx.rateNum) + ' per hour' + salaryNote + ', the ' + owedKind + ' owed — ' + compositionParts.join('; ') + ' — totals approximately ' + money(bd.owedEstimate) + '.'
      : 'I request payment for these hours at the rate required by law.';
    // Cite the overtime provision only for hours that actually crossed the 40-hr
    // threshold; cite the basic wage-payment requirement for hours that didn't. A
    // real state daily-OT trigger gets its own sentence when the federal weekly
    // threshold wasn't reached (it's a separate, day-level rule the app's own hours
    // log doesn't evaluate) — it's folded into the federal sentence when it was.
    const legalBasisParts = [];
    if (bd.otHours > 0) legalBasisParts.push('Under the federal Fair Labor Standards Act (' + fedCite + '), hours worked beyond 40 in a workweek must be paid at one-and-one-half times my regular rate of pay, less any straight-time amount already paid for them.' + stClause);
    else if (hasRealStateOT) legalBasisParts.push(ctx.stateSel + ' law (' + stOT.citation + ') provides additional overtime protection for hours worked beyond a daily threshold — separate from, and potentially owed even without reaching, the federal 40-hour weekly threshold — that may increase what I am owed.');
    if (bd.unpaidRegHrs > 0) legalBasisParts.push('The FLSA (' + mwCite + ') also requires that I be paid for all hours worked at my regular rate, whether or not they reach the overtime threshold in a given workweek.');
    const legalBasisLine = legalBasisParts.length ? legalBasisParts.join(' ') : 'Under the federal Fair Labor Standards Act (' + fedCite + '), I must be paid at least my regular rate for all hours worked.' + stClause;
    // G2 (docs/flsa-process-gap.md) — this letter's dollar figure is the straight
    // unpaid premium only; name §216(b) liquidated damages + attorney's fees as real
    // leverage behind the request, not just an internal ask with a self-imposed deadline.
    const liqCite = cite(fed, 'remedies.liquidatedDamages', '29 U.S.C. § 216(b)');
    const liqLine = ' Please note that a private lawsuit under the FLSA (' + liqCite + ') can recover these wages plus an equal amount in liquidated damages, plus attorney\'s fees and costs — I would prefer to resolve this directly with you first.';
    // State remedies.* facts (see applicableWageRemedies) — real leverage in a letter
    // sent to the employer, but only cited when this claim's shape actually triggers
    // them (never for an overtime-only shortfall a state has no overtime statute for)
    // and always worded to match the underlying statute's discretion standard.
    const stRemedies = applicableWageRemedies(st, bd, ctx.rateNum, factByTopic(st, 'minimumWage.hourly'));
    const stRemedyLine = wageRemedyLetterSentence(ctx.stateSel, stRemedies);
    // G4 — same retaliation protection as the classification-request letter above.
    const retalCite = cite(fed, 'retaliation.flsa', '29 U.S.C. § 215(a)(3)');
    const retalLine = ' Federal law (' + retalCite + ') prohibits retaliation against me for making this request.';
    const subject = bd.otHours > 0 ? 'Demand for unpaid overtime wages' : 'Demand for unpaid wages';
    const body = date + '\n\n' + emp + '\nAttn: Payroll / Human Resources\n\nRe: ' + subject + '\n\nTo whom it may concern:\n\n' +
      'I am writing to request payment of wages I earned and was not paid correctly. ' + claimLine + '\n\n' +
      legalBasisLine + '\n\n' +
      amountLine + ' I request payment within 14 days of the date of this letter.' + liqLine + stRemedyLine + retalLine + ' Please contact me to arrange payment.\n\nSincerely,\n' + name;
    return { title: 'Wage demand letter', subject, body, usesStateLaw: hasRealStateOT || stRemedies.length > 0 };
  }

  if (kind === 'complaint') {
    const isHarass = ctx.issueKey === 'harassment';
    const subject = 'Formal complaint of workplace ' + (isHarass ? 'harassment' : 'discrimination');
    const dates = (ctx.entries || []).slice(0, 5).map(e => e.date).filter(Boolean);
    const list = dates.length ? '\n\nDocumented incidents:\n' + dates.map(d => '• ' + d).join('\n') : '';
    const stCite = cite(st, 'discrimination.coverage', cite(st, 'discrimination.protectedClasses', ''));
    const stClause = stCite ? ' and ' + ctx.stateSel + ' law (' + stCite + ')' : '';
    // FIND-11 (docs/audit-2026-08-29.md) — this letter was generic Title VII
    // boilerplate that never mentioned the ADA, disability, or a logged
    // accommodation denial, even when the ADA tracker (profile.adaLog) already
    // recorded exactly that fact — the app asked the user to log it, then the
    // letter ignored it. A denied accommodation is its own, disability-specific
    // legal theory (42 U.S.C. §12112), not just generic Title VII discrimination,
    // so name it and cite the actual denial on file rather than staying silent.
    const adaLog = Array.isArray(ctx.adaLog) ? ctx.adaLog : [];
    const deniedEntry = (adaLog.length && adaLog[adaLog.length - 1].what === 'denied') ? adaLog[adaLog.length - 1] : null;
    const adaFedCite = cite(fed, 'disability.reasonableAccommodation', '42 U.S.C. §12112');
    const adaClause = deniedEntry
      ? (' This also includes the denial of my request for a reasonable accommodation for a disability' + (deniedEntry.date ? ' on ' + formatLocalDateStr(deniedEntry.date) : '') + (deniedEntry.notes ? (' (' + deniedEntry.notes + ')') : '') + ', which I believe violates the Americans with Disabilities Act (' + adaFedCite + ').')
      : '';
    const body = date + '\n\n' + emp + '\nAttn: Human Resources\n\nRe: ' + subject + '\n\nTo whom it may concern:\n\n' +
      'I am formally reporting conduct at work that I believe violates Title VII of the Civil Rights Act of 1964' + stClause + '.' + adaClause + ' I am asking that the conduct stop and that the company promptly and impartially investigate.' + list + '\n\n' +
      'The law prohibits retaliation against me for making this good-faith complaint. I ask that this letter be placed in my personnel file.\n\nSincerely,\n' + name;
    return { title: 'Complaint letter', subject, body, usesStateLaw: !!stCite };
  }

  if (kind === 'accommodation-request') {
    // Copy mirrors ADA_REPLY's promise in chat ("I can draft that request from a
    // template") — see letterKindsFor, which offers this kind for discrimination
    // cases so that promise is real, not just a generic Title VII complaint letter.
    const fedCite = cite(fed, 'disability.reasonableAccommodation', '42 U.S.C. § 12112');
    const stFact = stateFactFor(st, ['disability.accommodation', 'disability.reasonableAccommodation', 'disability.interactiveProcess']);
    const stClause = (stFact && stFact.citation) ? ' ' + ctx.stateSel + ' law (' + stFact.citation + ') may provide additional protection.' : '';
    // FIND-11 (docs/audit-2026-08-29.md) — this letter used to be written in
    // first-ask future tense ("I am requesting... this begins an interactive
    // process") no matter what, even after the ADA tracker (profile.adaLog —
    // see AdaProcessTracker) already logged that the request was made AND
    // denied. Mirrors the wage-demand letter's existing pattern of pulling real
    // facts from a log (there, the hours log) into the letter it generates —
    // here, the ADA interactive-process log — so a denial is reflected, not
    // contradicted, by the letter the app hands the user next. adaLog entries
    // are stored in the order logged (see AdaProcessTracker/buildCaseFile,
    // which use the same array-order convention with no re-sort), so the LAST
    // entry is the process's current status.
    const adaLog = Array.isArray(ctx.adaLog) ? ctx.adaLog : [];
    const requestedEntry = adaLog.find(e => e.what === 'requested');
    const latestEntry = adaLog.length ? adaLog[adaLog.length - 1] : null;
    const wasDenied = !!(latestEntry && latestEntry.what === 'denied');
    const requestedDateStr = requestedEntry && requestedEntry.date ? formatLocalDateStr(requestedEntry.date) : null;
    const deniedDateStr = wasDenied && latestEntry.date ? formatLocalDateStr(latestEntry.date) : null;
    const subject = wasDenied ? 'Follow-up: request for a reasonable accommodation (request denied)' : 'Request for a reasonable accommodation';
    const openingLine = wasDenied
      ? ('I requested a reasonable accommodation for a disability under the Americans with Disabilities Act (' + fedCite + ')' + (requestedDateStr ? ' on ' + requestedDateStr : '') + '.' + stClause + ' I was told this request was denied' + (deniedDateStr ? ' on ' + deniedDateStr : '') + (latestEntry.notes ? (': ' + latestEntry.notes) : '') + '.')
      : ('I am requesting a reasonable accommodation for a disability under the Americans with Disabilities Act (' + fedCite + ').' + stClause);
    const bodyMiddle = wasDenied
      ? ('I am asking the company to reconsider and to continue the interactive process the law requires. If there is a specific reason the requested accommodation cannot be provided, please state it in writing, and let\'s discuss whether an alternative accommodation would work instead.\n\n' +
         'My limitation is: [describe your limitation in plain terms — no legal or medical terms required].\n' +
         'The accommodation I am now requesting is: [describe the accommodation, restated or revised].\n\n' +
         'Please confirm receipt in writing and let me know a good time to talk this week.')
      : ('My limitation is: [describe your limitation in plain terms — no legal or medical terms required].\n' +
         'The change that would help is: [describe the accommodation you are requesting].\n\n' +
         'I understand this begins an interactive process between us to identify an effective accommodation, and I am glad to discuss options. Please confirm receipt in writing and let me know a good time to talk this week.');
    const body = date + '\n\n' + emp + '\nAttn: Human Resources\n\nRe: ' + subject + '\n\nTo whom it may concern:\n\n' + openingLine + '\n\n' + bodyMiddle + '\n\nSincerely,\n' + name;
    return { title: wasDenied ? 'Accommodation request letter (follow-up after denial)' : 'Accommodation request letter', subject, body, usesStateLaw: !!(stFact && stFact.citation) };
  }

  // records-request (termination, document review, or generic)
  // qa MEDIUM #11 — this was fully generic ("within the time required by [state]
  // law") with no cite() call, unlike every other letter kind above, even though
  // the state's own final-pay fact (e.g. TX: 6 calendar days, Tex. Labor Code
  // § 61.014) is already fetched into stateData and just went unused here. Topic
  // name isn't consistent across states (bare "final-pay" in 46 files, dotted
  // variants like "final-pay.timing"/"final-pay.wageClaim" in a few that have no
  // bare "final-pay" fact) — EXCEPT Texas, which has both: a bare "final-pay"
  // (the 6-day final-paycheck timing rule this letter is actually about) and a
  // separate "final-pay.wageRecoveryLimitations" (an unrelated 2-year civil-suit
  // SOL). Prefer the exact bare topic first so TX doesn't pick the wrong one;
  // only prefix-match for the states whose only final-pay fact is dotted.
  const finalPayFact = factByTopic(st, 'final-pay') || factsByPrefix(st, 'final-pay')[0];
  const finalPayUsed = !!(finalPayFact && finalPayFact.citation);
  // A short duration phrase reads naturally after "within..."; a full fact
  // summary does not, so when we have the actual state rule, replace the
  // generic clause with its own sentence instead of splicing the two together.
  const finalPayLine = finalPayUsed
    ? 'Please provide the final pay records promptly. ' + finalPayFact.summary + ' (' + finalPayFact.citation + ')'
    : 'Please provide the records in writing within the time required by ' + ctx.stateSel + ' law';
  const subject = 'Request for personnel file and pay records';
  const body = date + '\n\n' + emp + '\nAttn: Human Resources\n\nRe: ' + subject + '\n\nTo whom it may concern:\n\n' +
    'I request a complete copy of my personnel file, including performance records, disciplinary records, time records, and all final pay records. Many states require an employer to provide these within a set period after a written request.\n\n' +
    finalPayLine + '. I am making this request to keep an accurate record of my employment.\n\nSincerely,\n' + name;
  return { title: 'Records request letter', subject, body, usesStateLaw: finalPayUsed };
}

// Converts a 0-based index into an exhibit letter — A, B, C, … Z, AA, AB, … —
// for the EVIDENCE / DOCUMENTS section below. Plain-text export has no bold or
// numbering widget, so "Exhibit A/B/C" is the only stable, attorney-familiar
// way to let the FULL TIMELINE and a demand letter both reference the same
// document without re-describing it.
function exhibitLetter(n){
  let s = '', i = n + 1;
  while (i > 0) { i--; s = String.fromCharCode(65 + (i % 26)) + s; i = Math.floor(i / 26); }
  return s;
}
// "YYYY-MM-DD" (LOCAL calendar day — see dateInputValue/computeDeadlineFromEvent)
// -> "March 1, 2026" for the packet header. Never uses `new Date(str)` directly
// (UTC parsing) since that can print the wrong day for users west of UTC.
function formatLocalDateStr(s){
  if (!s) return null;
  const parts = String(s).split('-').map(Number);
  if (parts.length !== 3 || parts.some(n => !isFinite(n))) return s;
  const d = new Date(parts[0], parts[1] - 1, parts[2]);
  return isNaN(d.getTime()) ? s : fmtDate(d);
}
// Days between two "YYYY-MM-DD" (LOCAL calendar day — same dateInputValue
// convention as everywhere else above) date-input strings. Used by the
// records-request tracker's status line ("no response after N days" /
// "response received N days later") — never a guess: returns null (never a
// fabricated number) if either string doesn't parse cleanly.
function daysBetweenDateStrs(aStr, bStr){
  const pa = String(aStr || '').split('-').map(Number);
  const pb = String(bStr || '').split('-').map(Number);
  if (pa.length !== 3 || pb.length !== 3 || pa.some(n => !isFinite(n)) || pb.some(n => !isFinite(n))) return null;
  const da = new Date(pa[0], pa[1] - 1, pa[2]);
  const db = new Date(pb[0], pb[1] - 1, pb[2]);
  if (isNaN(da.getTime()) || isNaN(db.getTime())) return null;
  return Math.round((db.getTime() - da.getTime()) / 86400000);
}

// Build a portable, attorney/agency-ready case-file packet from the user's real
// inputs — plain text so it stays copy/paste- and print-friendly through
// printLetter() (see below). Organized as clearly labeled sections rather than
// one flat header + chronological dump, so a reader can jump straight to
// "who are the witnesses" or "what is the claimed deadline" instead of reading
// the whole timeline to find it. Every section is still gracefully OMITTED
// (or shown with a plain "none logged yet" line) when its underlying data is
// missing — this must never throw on an old entry, or a profile, saved before
// the structured witness/statement/document fields (or the deadline
// calculator, or per-workweek pay breakdown) existed. FULL TIMELINE at the end
// keeps every entry, structured or not, as the complete chronological record.
function buildCaseFile(ctx){
  const s = ctx.strength || { label: 'Not started', factors: [] };
  const profile = ctx.profile || {};
  const entries = ctx.entries || [];
  const lines = [];

  lines.push('WORKLAW CASE FILE — ATTORNEY / AGENCY PACKET');
  lines.push('Prepared ' + fmtDate(new Date()));

  // 1. HEADER
  lines.push('');
  lines.push('== HEADER ==');
  lines.push('Worker: ' + (ctx.youName || '[not provided]'));
  // profile has no phone/email/address fields today — these stay defensive
  // (never rendered while absent) so a future contact-capture field surfaces
  // here automatically instead of needing another buildCaseFile change.
  const workerContact = [profile.phone, profile.email].filter(Boolean).join(' · ');
  if (workerContact) lines.push('Worker contact: ' + workerContact);
  lines.push('Employer: ' + (ctx.employerName || '[not provided]'));
  if (profile.employerAddress) lines.push('Employer address: ' + profile.employerAddress);
  lines.push('Location: ' + (ctx.locationLabel || '[not provided]'));
  lines.push('Issue type: ' + (ctx.issue || '[not selected]'));
  const eventDateFmt = formatLocalDateStr(profile.eventDate);
  if (eventDateFmt) lines.push(eventDateLabelFor(ctx.cfgKey) + ': ' + eventDateFmt);
  lines.push('Case opened: ' + fmtDate(new Date(ctx.caseOpened)));

  // 2. KEY DEADLINE
  lines.push('');
  lines.push('== KEY DEADLINE ==');
  const dl = ctx.dl;
  if (dl) {
    const computed = profile.eventDate ? computeDeadlineFromEvent(profile.eventDate, dl.value || dl.summary) : null;
    if (computed) {
      const { targetDate, daysLeft, isPast } = computed;
      lines.push(isPast
        ? 'This deadline may have passed — talk to an attorney immediately, some exceptions exist.'
        : 'File by ' + formatDeadlineDate(targetDate) + ' — about ' + daysLeft + (Math.abs(daysLeft) === 1 ? ' day' : ' days') + ' left.');
      lines.push('Limitations period: ' + (dl.value || dl.summary));
      lines.push(DEADLINE_ESTIMATE_CAVEAT);
    } else {
      // No event date on file yet, or the fact text didn't cleanly parse to a
      // number of days — never fabricate a date (see computeDeadlineFromEvent).
      lines.push(dl.summary || dl.value);
      lines.push(profile.eventDate
        ? 'Could not compute an exact date from the date on file — confirm the exact deadline with the agency or an attorney.'
        : 'Add the date this happened on Home to compute an exact "file by" date.');
    }
  } else if (ctx.cfgKey === 'document') {
    // R10 — no jurisdiction "deadlines" fact exists for document/severance
    // review; same OWBPA general-federal-rule fallback shown on Home/Agencies.
    lines.push('21 days to consider, 7 days to revoke, if this document is a release covered by the Older Workers Benefit Protection Act (29 U.S.C. §626(f)) — a general federal rule, not sourced from state-specific facts. Confirm the exact days stated in your copy.');
  } else {
    lines.push('No jurisdiction-specific filing deadline is tracked for this issue type in this app. Confirm the applicable deadline with the enforcing agency or an attorney before you wait.');
  }

  // 3. CLAIM SNAPSHOT
  lines.push('');
  lines.push('== CLAIM SNAPSHOT ==');
  lines.push('Case strength: ' + s.label + ' (' + s.score + '/100)');
  if (ctx.cfgKey === 'wage') {
    const wizResult = RESULTS_WAGE[ctx.wizNode];
    lines.push('Overtime classification: ' + (wizResult ? wizResult.title : 'Not yet checked — run the overtime exemption check.'));
    if (ctx.owedEstimate > 0) lines.push('Estimated overtime owed: ' + money(ctx.owedEstimate));
    else if (ctx.unpaidHours > 0) lines.push('Unpaid hours logged: ' + ctx.unpaidHours + ' (add an hourly rate or salary to estimate the amount owed)');
    const weeks = (ctx.payBreakdown && ctx.payBreakdown.weeks) || [];
    if (weeks.length) {
      lines.push('Per-workweek hours (Sun–Sat):');
      weeks.forEach(w => {
        lines.push('  Week of ' + w.label + ': ' + w.hours + ' hrs total — ' + w.regHours + ' reg + ' + w.otHours + ' OT' +
          (ctx.rateNum > 0 ? ' — ' + money(w.totalPay) : ''));
      });
    }
  } else {
    lines.push('Claim type: ' + (ctx.caseTitle || ctx.issue || 'Employment issue'));
    if (ctx.cfgKey === 'harassment' || ctx.cfgKey === 'discrimination') {
      const wcfg = wizardConfigFor(ctx.cfgKey);
      const wizResult = wcfg.results[ctx.wizNode];
      lines.push((ctx.cfgKey === 'harassment' ? 'Harassment' : 'Discrimination') + ' self-check: ' + (wizResult ? wizResult.title + ' — informational only, not a legal opinion' : 'Not yet run.'));
    }
  }

  // 4. WITNESSES — skip any Witness entry with no name (nothing an attorney
  // could actually contact), including every pre-structured-fields entry.
  lines.push('');
  lines.push('== WITNESSES ==');
  const witnesses = entries.filter(e => e.tag === 'Witness' && e.witnessName && String(e.witnessName).trim());
  if (witnesses.length) {
    witnesses.forEach((e, i) => {
      const employedNote = e.witnessStillEmployed === 'Yes' ? 'still employed'
        : e.witnessStillEmployed === 'No' ? 'no longer employed'
        : e.witnessStillEmployed ? 'employment status: ' + e.witnessStillEmployed : null;
      const willingNote = e.witnessWilling === 'Yes' ? 'willing to be contacted'
        : e.witnessWilling === 'No' ? 'not willing to be contacted'
        : e.witnessWilling ? 'contact willingness: ' + e.witnessWilling : null;
      const bits = [e.witnessRelationship, employedNote, willingNote].filter(Boolean).join(', ');
      const account = e.body && e.body !== ENTRY_PLACEHOLDER_BODY ? e.body : '';
      let line = (i + 1) + '. ' + e.witnessName;
      if (bits) line += ' — ' + bits;
      if (e.witnessContact) line += ' — ' + e.witnessContact;
      if (account) line += ' — saw: ' + account;
      lines.push(line);
    });
  } else {
    lines.push('(no named witnesses logged yet)');
  }

  // 5. EVIDENCE / DOCUMENTS — skip any Records entry with no document type,
  // same backward-compat rule as witnesses above.
  lines.push('');
  lines.push('== EVIDENCE / DOCUMENTS ==');
  const docs = entries.filter(e => e.tag === 'Records' && e.docType);
  if (docs.length) {
    docs.forEach((e, i) => {
      let line = 'Exhibit ' + exhibitLetter(i) + ': ' + e.docType;
      if (e.docDate) line += ' (dated ' + e.docDate + ')';
      if (e.docParties) line += ' — parties: ' + e.docParties;
      const why = e.body && e.body !== ENTRY_PLACEHOLDER_BODY ? e.body : '';
      if (why) line += ' — ' + why;
      if (e.attachment && e.attachment.name) line += ' [attachment on file: ' + e.attachment.name + ']';
      lines.push(line);
    });
  } else {
    lines.push('(no documents logged yet)');
  }

  // 6. STATEMENTS — skip any Statement entry with no speaker name.
  lines.push('');
  lines.push('== STATEMENTS ==');
  const statements = entries.filter(e => e.tag === 'Statement' && e.speakerName && String(e.speakerName).trim());
  if (statements.length) {
    statements.forEach((e, i) => {
      const quote = e.body && e.body !== ENTRY_PLACEHOLDER_BODY ? e.body : '(no quote recorded)';
      let line = (i + 1) + '. ' + e.speakerName;
      if (e.speakerRole) line += ' (' + e.speakerRole + ')';
      if (e.saidWhere) line += ', ' + e.saidWhere;
      if (e.saidWhen) line += ', ' + e.saidWhen;
      line += ': "' + quote + '"';
      if (e.whoElseHeard) line += ' (also heard by ' + e.whoElseHeard + ')';
      lines.push(line);
    });
  } else {
    lines.push('(no employer/manager statements logged yet)');
  }

  // RECORDS REQUEST — records-request follow-through tracker (see
  // RecordsRequestTracker). Only rendered once the user has actually started
  // tracking a request (a sent date on file) — never shown just because the
  // issue happens to be gated to the tool.
  const rr = profile.recordsRequest;
  if (rr && rr.dateSent) {
    lines.push('');
    lines.push('== RECORDS REQUEST ==');
    lines.push('Sent ' + formatLocalDateStr(rr.dateSent) + (rr.method ? ' via ' + rr.method : '') + '.');
    if (rr.noResponseYet === true) {
      const daysSince = daysBetweenDateStrs(rr.dateSent, dateInputValue());
      lines.push('Status: no response yet' + (daysSince != null && daysSince >= 0 ? ' (' + daysSince + (daysSince === 1 ? ' day' : ' days') + ' so far)' : '') + ' — non-response can itself be relevant.');
    } else if (rr.dateReceived) {
      const gap = daysBetweenDateStrs(rr.dateSent, rr.dateReceived);
      lines.push('Response received ' + formatLocalDateStr(rr.dateReceived) + (gap != null ? ' (' + gap + (gap === 1 ? ' day' : ' days') + ' after the request)' : '') + '.');
    } else {
      lines.push('Status: awaiting confirmation of whether a response has come in.');
    }
    if (rr.produced) lines.push('Produced: ' + rr.produced);
    if (rr.missing) lines.push('Still missing: ' + rr.missing);
  }

  // ADA INTERACTIVE PROCESS — profile.adaLog (see AdaProcessTracker), a plain
  // chronological list of interactions in the order the user logged them.
  // Only rendered once at least one interaction has been logged.
  const adaLog = Array.isArray(profile.adaLog) ? profile.adaLog : [];
  if (adaLog.length) {
    lines.push('');
    lines.push('== ADA INTERACTIVE PROCESS ==');
    lines.push(ADA_PROCESS_GOOD_FAITH_NOTE);
    adaLog.forEach((e, i) => {
      const label = ADA_LOG_WHAT_LABELS[e.what] || e.what || 'Update';
      let line = (i + 1) + '. ' + (e.date ? formatLocalDateStr(e.date) + ' — ' : '') + label;
      if (e.notes) line += ': ' + e.notes;
      lines.push(line);
    });
  }

  // 7. TIMELINE / POSSIBLE RETALIATION — pairs each entry the worker marked
  // 'adverse' with the nearest earlier 'protected' entry and the day-gap
  // between them (see causationPairs). Never asserts retaliation occurred —
  // only surfaces the pattern, hedged, for the attorney to evaluate. Omitted
  // entirely when there isn't at least one dated entry of each kind.
  const causation = causationPairs(entries);
  if (causation.length) {
    lines.push('');
    lines.push('== TIMELINE / POSSIBLE RETALIATION ==');
    lines.push('Courts often look at how close in time an employer\'s action was to a worker\'s protected activity — close timing can be evidence of retaliation, but timing alone is not proof. Not legal advice.');
    causation.forEach((p, i) => {
      const gapPhrase = p.gapDays === 0 ? 'the same day' : (p.gapDays + ' day' + (p.gapDays === 1 ? '' : 's') + ' later');
      lines.push((i + 1) + '. Protected activity (' + fmtDate(p.protectedDate) + '): ' + causalEntryLabel(p.protectedEntry));
      lines.push('   Adverse action (' + fmtDate(p.adverseDate) + ', ' + gapPhrase + '): ' + causalEntryLabel(p.adverseEntry));
      if (p.gapDays <= CAUSATION_CLOSE_GAP_DAYS) lines.push('   — Close timing: ' + p.gapDays + (p.gapDays === 1 ? ' day' : ' days') + ' apart.');
    });
  }

  // 8. FULL TIMELINE — the complete chronological record, unchanged from the
  // original flat dump, so nothing in the log — including pre-structured-
  // fields entries with only a title/body — ever goes missing from the export.
  lines.push('');
  lines.push('== FULL TIMELINE (' + entries.length + ' entries) ==');
  entries.forEach(e => {
    lines.push('• [' + e.tag + '] ' + e.date + ' — ' + e.title + (e.hours ? ' (' + e.hours + ' hrs)' : ''));
    if (e.tag === 'Witness' && e.witnessName) {
      const bits = [e.witnessRelationship, e.witnessStillEmployed ? 'still employed: ' + e.witnessStillEmployed : null,
        e.witnessWilling ? 'willing to be contacted: ' + e.witnessWilling : null, e.witnessContact ? 'contact ' + e.witnessContact : null]
        .filter(Boolean).join(', ');
      lines.push('    Witness: ' + e.witnessName + (bits ? ' (' + bits + ')' : ''));
    }
    if (e.tag === 'Statement' && e.speakerName) {
      const bits = [e.speakerRole, e.saidWhere, e.saidWhen ? 'on ' + e.saidWhen : null, e.whoElseHeard ? 'also heard by ' + e.whoElseHeard : null]
        .filter(Boolean).join(', ');
      lines.push('    Said by: ' + e.speakerName + (bits ? ' (' + bits + ')' : ''));
    }
    if (e.tag === 'Records' && e.docType) {
      const bits = [e.docDate, e.docParties].filter(Boolean).join(', ');
      lines.push('    Document: ' + e.docType + (bits ? ' (' + bits + ')' : ''));
    }
    if (e.body) lines.push('    ' + e.body);
    if (e.attachment && e.attachment.name) lines.push('    [attachment: ' + e.attachment.name + ']');
  });
  if (!entries.length) lines.push('• (no entries logged yet)');

  // 9. DISCLAIMER
  lines.push('');
  lines.push('This case file is legal information the worker compiled themselves. It is not legal advice.');
  return lines.join('\n');
}

// Real export: open a clean print window (Save as PDF); fall back to a .txt
// download if the popup is blocked; returns which path was actually taken
// ('tab' | 'download' | 'failed') so callers can phrase their confirmation
// message accurately instead of always claiming "opened in a new tab".
function printLetter(subject, text){
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  try {
    const w = window.open('', '_blank');
    if (!w) throw new Error('popup blocked');
    w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>' + esc(subject) +
      '</title><style>body{font:15px/1.7 Georgia,serif;color:#111;max-width:640px;margin:48px auto;padding:0 24px;white-space:pre-wrap;overflow-wrap:anywhere}@media print{body{margin:0}}</style></head><body>' +
      esc(text) + '</body></html>');
    w.document.close(); w.focus();
    setTimeout(() => { try { w.print(); } catch(e){} }, 300);
    return 'tab';
  } catch(e){
    try {
      const blob = new Blob([text], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = (subject || 'letter').replace(/[^a-z0-9]+/gi, '-').toLowerCase() + '.txt';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      return 'download';
    } catch(_){
      return 'failed';
    }
  }
}

// Sanity bounds for figures that flow into a sent wage-demand letter. These are
// soft limits — flagged with an inline warning, never silently rejected — wide
// enough to cover real high earners/long logs, but tight enough to catch an
// obvious typo (an extra digit) before it produces an absurd dollar figure in a
// document the user is told to send to their employer.
const RATE_WARN_MAX = 500;    // $/hr — a non-exempt hourly wage-claim rate this high is very rare
const ENTRY_HOURS_WARN_MAX = 100; // hours on a single log entry — well over 2 full workweeks
// F15 — a per-entry file/photo attachment is stored as a base64 data URL
// directly in localStorage (same on-device-only model as everything else in
// the case). A hard cap, not just a warning, because every attachment adds
// real weight against a shared, limited localStorage quota across every
// entry in the case — unlike the rate/hours soft-warning figures above, an
// oversized attachment is rejected outright rather than silently accepted.
const ATTACHMENT_MAX_BYTES = 1.5 * 1024 * 1024; // 1.5MB per attachment
// R12 — the per-attachment cap alone didn't stop several under-the-limit
// attachments (a handful of 1.5MB photos) from together blowing the shared
// localStorage quota (most browsers give ~5-10MB per origin for the WHOLE
// case, not just attachments). Cap the SUM of attachment bytes across every
// logged entry, checked before a new attachment is staged.
const ATTACHMENT_TOTAL_MAX_BYTES = 6 * 1024 * 1024; // 6MB total across the case
// FIND-16 — shared disabled-state pair for primary CTAs that can be not-ready
// (empty required field, etc). Previously only onboarding's Continue button had
// any visual disabled treatment, as an inline one-off; chat's Send looked fully
// solid/clickable even with an empty draft. Kept as plain string constants (this
// codebase has no separate token/theme layer) so every disabled primary button
// pulls the same pair instead of re-inventing its own gray.
const DISABLED_BG = '#E4E1D8';
const DISABLED_FG = '#4A5162';
// wl-security — an attachment is stored and later re-rendered as a data URL (an
// <img src> when its type starts with "image/", or an <a href download>
// otherwise). image/svg+xml is a text/XML format that can carry an inline
// <script>, and .html/.htm can too — either can be crafted to run script if the
// stored data URL is ever opened outside the constrained <img>/download
// contexts this app uses. Defense-in-depth: keep svg out of the file-picker's
// accept list entirely, AND re-check the browser-reported MIME type against
// this allow-list before FileReader ever reads the bytes, so a renamed-extension
// or spoofed-accept file is still rejected rather than silently staged.
const ATTACHMENT_ALLOWED_TYPES = ['image/jpeg', 'image/png', 'image/gif', 'image/webp', 'image/heic', 'image/heif',
  'application/pdf', 'application/msword',
  'application/vnd.openxmlformats-officedocument.wordprocessingml.document', 'text/plain'];
function isAllowedAttachmentType(file){
  // Some browsers report an empty file.type for a handful of legitimate local
  // files (notably .doc/.rtf on some OSes) — fall back to the file extension
  // only in that specific case, never to override a type the browser DID report.
  if (file.type) return ATTACHMENT_ALLOWED_TYPES.includes(file.type);
  return /\.(pdf|docx?|txt|rtf)$/i.test(file.name || '');
}

// Option lists shared by the structured Witness/Statement fields below.
const RELATIONSHIP_OPTIONS = ['Coworker', 'Supervisor or manager', 'Former employee', 'Customer or client', 'Other'];
const YES_NO_UNSURE = ['Yes', 'No', 'Unsure'];
const SAID_WHERE_OPTIONS = ['In person', 'Phone', 'Email', 'Chat/Slack', 'Meeting', 'Other'];
const DOC_TYPE_OPTIONS = ['Pay stub', 'Offer letter or contract', 'Write-up or discipline', 'Performance review', 'Policy or handbook', 'Email or message', 'Termination or severance', 'Other'];
// Shared with Log()'s local PLACEHOLDER_BODY (kept as a top-level constant so
// buildCaseFile's structured WITNESSES/EVIDENCE/STATEMENTS sections can also
// recognize "no real note was ever typed" and omit the placeholder text from
// an attorney-facing packet, instead of quoting boilerplate as if it were the
// worker's own account).
const ENTRY_PLACEHOLDER_BODY = 'No detail added yet — tap to edit while it is fresh.';

// Quick-add kinds for the incident log (shared; optional hours capture for wage claims).
const LOG_KINDS = [
  { label:'+ Hours worked', title:'Unpaid or extra hours', body:'', color:'#EF7B22', tag:'Wage & hour', asksHours:true },
  { label:'+ Something said', title:'Statement recorded', body:'', color:'#2B3AA8', tag:'Statement' },
  { label:'+ A document',    title:'Document saved',     body:'', color:'#7A3AA8', tag:'Records' },
  { label:'+ A witness',     title:'Witness noted',      body:'', color:'#1F8A4C', tag:'Witness' },
];

// Optional causal-role classification for a log entry — "I did X protected thing,
// then the employer did Y adverse thing" is the core fact pattern a retaliation
// claim turns on, but entries were otherwise tag-flat with no way to mark cause
// vs. effect. Stored as entry.causalRole ('protected' | 'adverse' | undefined —
// old entries simply lack the field). Shown only for issues where retaliation
// timing is actually relevant (see CAUSAL_ROLE_ISSUE_KEYS below) — hidden for
// wage/document, where it would just be clutter.
const CAUSAL_ROLE_OPTIONS = [['protected', 'Protected activity'], ['adverse', 'Adverse action']];
const CAUSAL_ROLE_ISSUE_KEYS = ['harassment', 'discrimination', 'termination', 'general'];
// Human labels/colors reused by the entry-list pill and the case-strength
// causation summary below, so the two never describe the same value differently.
const CAUSAL_ROLE_META = {
  protected: { label: 'Protected activity', color: '#136B3C', bg: '#E8F6EE' },
  adverse: { label: 'Adverse action', color: '#B3264F', bg: '#FFE7EC' },
};
// The date a log entry is actually "about", for causation-gap purposes — prefers
// a kind-specific date the user entered for what the entry describes (Statement's
// "when said", Records' document date) over the entry's own iso (when it was
// LOGGED, which for Witness/freetext entries is the only date on file, but for
// Statement/Records is usually just "today" and would understate real gaps).
// Returns a Date or null (never a fabricated one) so callers can skip entries
// with missing/unparseable dates rather than mis-order the timeline.
function causalEntryDate(e){
  const raw = (e.tag === 'Statement' && e.saidWhen) ? e.saidWhen : (e.tag === 'Records' && e.docDate) ? e.docDate : null;
  if (raw) {
    const parts = String(raw).split('-').map(Number);
    if (parts.length === 3 && parts.every(n => isFinite(n))) {
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      if (!isNaN(d.getTime())) return d;
    }
  }
  if (e.iso) { const d = new Date(e.iso); if (!isNaN(d.getTime())) return d; }
  return null;
}
// Short human description of a log entry for the causation summary/export —
// prefers the worker's own note text over the generic kind title, so "You
// complained to HR about my hours" reads better than "Statement recorded".
function causalEntryLabel(e){
  const body = (e.body && e.body !== ENTRY_PLACEHOLDER_BODY) ? String(e.body).trim() : '';
  const text = body || e.title || e.tag || 'entry';
  return text.length > 100 ? text.slice(0, 97) + '…' : text;
}
// Pairs each classified 'adverse' entry with the nearest classified 'protected'
// entry that happened on or before it, computing the day-gap between them —
// the core "protected activity, then adverse action how soon after" pattern a
// retaliation claim turns on. Only pairs protected-before-adverse (an adverse
// action that came BEFORE any protected activity isn't evidence of retaliation
// for that activity); an adverse entry with no earlier protected entry is left
// unpaired rather than paired with a later one. Returns [] whenever there isn't
// at least one dated 'protected' and one dated 'adverse' entry — callers use
// that to decide whether to render the summary at all. Sorted by the protected
// activity's date, oldest first.
function causationPairs(entries){
  entries = entries || [];
  const dated = entries.map(e => ({ e, d: causalEntryDate(e) })).filter(x => x.d);
  const protectedEvents = dated.filter(x => x.e.causalRole === 'protected');
  const adverseEvents = dated.filter(x => x.e.causalRole === 'adverse');
  if (!protectedEvents.length || !adverseEvents.length) return [];
  const pairs = [];
  adverseEvents.forEach(adv => {
    let best = null;
    protectedEvents.forEach(prot => {
      if (prot.d <= adv.d && (!best || prot.d > best.d)) best = prot;
    });
    if (best) {
      const gapDays = Math.round((adv.d.getTime() - best.d.getTime()) / 86400000);
      pairs.push({ protectedEntry: best.e, protectedDate: best.d, adverseEntry: adv.e, adverseDate: adv.d, gapDays });
    }
  });
  pairs.sort((a, b) => a.protectedDate - b.protectedDate);
  return pairs;
}
// A gap this short or shorter gets visually highlighted — informational only,
// not a legal threshold; courts weigh close timing as one factor among many.
const CAUSATION_CLOSE_GAP_DAYS = 30;
// The Log's default quick-add kind on first open, by issue — before this every
// issue defaulted to 'Wage & hour' regardless of what actually made sense (a
// harassment or discrimination user's first tap of "Add to my log" opened an
// hours-worked form). Only used to seed initial state on case load; an
// in-session user pick (setLogKind) is never overwritten by this.
function defaultLogKindForIssueKey(key){
  if (key === 'wage') return 'Wage & hour';
  if (key === 'document') return 'Records';
  return 'Statement'; // harassment, discrimination, termination, general
}

    // Route by question content (word-boundary keyword/phrase match), not by message

    // fragment mis-routes "Where do I sign the timesheet?" (contains "sign"), "Can I
    // exterminate the pests in the breakroom?" (contains "terminat"), or "adapter"
    // (contains "ada") to an unrelated reply, sometimes carrying a real §-citation

    const hasWord = (re) => re.test(lower);
    const isAda = hasWord(/\baccommodat\w*/) || hasWord(/\bada\b/) || hasWord(/\bdisab\w*/);
    // FIND-05 — "wrongful termination/discharge" is a distinct legal theory from
    // retaliation (at-will exceptions in general, not specifically "fired for doing

    const isWrongfulTermination = hasWord(/\bwrongful(?:ly)?\s+(?:terminat\w*|discharg\w*|fired)\b/);

    // I sign the offer letter?", "should I sign a new contract?" — and gave every
    // one of them the OWBPA-specific 21/7-day answer, which is simply wrong outside
    // an age-discrimination severance/release context. "sign" alone is separately
    // still far too broad ("sign the timesheet") to use as a signal on its own.
    const isSeverance = hasWord(/\bseverance\b/) || hasWord(/\b(release|separation) agreement\b/) || hasWord(/\brelease of claims\b/);
    // A message about whether wage-and-hour law even COVERS the person (1099 /
    // independent-contractor / misclassification questions) is a different, prior
    // question from "was I paid correctly for hours I worked" — routing it to the
    // overtime reply (which presupposes employee status) answers a question the
    // user didn't ask, with a citation that reads as authoritative and is not
    // responsive. This app has no dedicated classification content yet (tracked
    // separately), so the honest behavior is the topic-neutral fallback, not a
    // confident wrong answer.
    const isClassificationQuestion = hasWord(/\b(1099|independent contractor|misclassif\w*|self-employed|gig work\w*|freelanc\w*)\b/)
      && (hasWord(/\bcovered\b/) || hasWord(/\bw-?2\b/) || hasWord(/\bemployee\b/));
    const isOvertime = !isClassificationQuestion && (hasWord(/\bovertime\b/) || hasWord(/\bunpaid\b/) || hasWord(/\boff[\s-]the[\s-]clock\b/) || hasWord(/\bwages?\b/));
    // Discrimination/harassment — "discriminat*"/"harass*" and the standard legal
    // terms of art (hostile work environment, quid pro quo, unwelcome conduct) are
    // specific enough to fire on their own. A bare protected-characteristic word
    // (race, religion, sex...) is NOT specific enough on its own — "my religion
    // requires ..." or "we changed the sex-ed policy" are not discrimination
    // questions — so those only route here paired with an adverse-treatment word
    // (denied/passed over/not promoted/paid less/demoted/fired/disciplined/not
    // hired), the same two-word-group pairing isSeverance uses above. This is
    // deliberately checked BEFORE isSeverance/isOvertime (a "denied ... wages"
    // fact pattern should still be free to also hit isOvertime) but AFTER isAda/
    // isRetaliation so it never overrides those two more specific, existing routes.
    const hasDiscHarassWord = hasWord(/\bdiscriminat\w*/) || hasWord(/\bharass\w*/) || hasWord(/\bhostile work(place| environment)?\b/) || hasWord(/\bquid pro quo\b/) || hasWord(/\bunwelcome (conduct|advances?|comments?|touching)\b/);
    const hasProtectedClassWord = hasWord(/\b(race|racial|racist|gender|sexist|religio\w*|national origin|ethnicity|ethnic|pregnan\w*|sexual orientation|gender identity|protected class)\b/);
    const hasAdverseTreatmentWord = hasWord(/\b(denied|passed over|not promoted|treated differently|paid less|demoted|disciplined|not hired|refused to hire|written up)\b/);
    const isDiscrimination = hasDiscHarassWord || (hasProtectedClassWord && hasAdverseTreatmentWord);
    // Cite the caller's actual loaded state law, not a fixed persona's state — fall back to a
    // state-neutral pointer to Rights when no state-specific fact is on file for that topic.
    const stFacts = (stateData && stateData.facts) || [];
    const retaliationFact = stateFactFor(stFacts, ['retaliation', 'retaliation.whistleblower', 'discrimination.retaliation']);
    const adaFact = stateFactFor(stFacts, ['disability.accommodation', 'disability.interactiveProcess']);
    const discFact = stateFactFor(stFacts, ['discrimination.coverage', 'discrimination.protectedClasses']);
    const stateNote = " Check your state's specific rule in Rights.";
    const retaliationReply = {
      text: REPLIES[1].text + (retaliationFact ? '' : stateNote),
      cites: retaliationFact && retaliationFact.citation ? [retaliationFact.citation] : []
    };
    const adaReply = {
      text: ADA_REPLY.text + (adaFact ? '' : stateNote),
      cites: adaFact && adaFact.citation ? ['42 U.S.C. §12112', adaFact.citation] : ['42 U.S.C. §12112'],
      // letterKindsFor only lists accommodation-request as a Letter-screen tab
      // for discrimination/harassment — for every other issue, this CTA is the
      // only way in, so it must exist regardless of issue for ADA_REPLY's "I can
      // draft that request from a template" promise to be true for whoever the
      // chat actually made it to. Deep-links straight past the Letter screen's
      // per-issue tab list (see Letter's activeKind).
      cta: { label:'Draft this letter', letterType:'accommodation-request' }
    };
    const discriminationReply = {
      text: DISCRIMINATION_REPLY.text + (discFact ? '' : stateNote),
      cites: discFact && discFact.citation ? ['42 U.S.C. §2000e-2', discFact.citation] : ['42 U.S.C. §2000e-2']
    };
    const repliesResolved = [REPLIES[0], retaliationReply, REPLIES[2]];
    // Topic-neutral fallback for questions that match none of the known topics.
    // Never attach a statutory citation to an answer we didn't actually match —
    // an off-topic reply carrying a real §-cite reads as authoritative and wrong.
    const fallbackReply = {
      text: "I can only give sample answers on a few topics: unpaid overtime and wages, discrimination and harassment, termination and retaliation, and severance or documents you've been asked to sign. Try rephrasing toward one of those. For anything else, your state labor agency or a local attorney (see Agencies) is the best next step.",
      cites: []
    };
    const matched = isAda ? adaReply : isWrongfulTermination ? WRONGFUL_TERMINATION_REPLY : isRetaliation ? repliesResolved[1] : isDiscrimination ? discriminationReply : isSeverance ? repliesResolved[2] : isOvertime ? repliesResolved[0] : null;
    setMessages(prev => {
      const next = prev.concat([{ role:'user', text }]);
      clearTimeout(timer.current);
      timer.current = setTimeout(() => {
        setTyping(false);
        setMessages(p => p.concat([Object.assign({ role:'ai' }, matched || fallbackReply)]));
      }, 900);
      return next;
    });
    setDraft('');
    setTyping(true);
  };

  const stateAbbr = US_STATE_ABBR[stateSel] || '';
  const stateLabel = stateSel || 'your state'; // fall back when onboarding was skipped without a state
  const locationLabel = county ? county + (stateAbbr ? ', ' + stateAbbr : '') : (stateSel || 'your location');
  const countyShort = county ? county.replace(/\s+(County|Parish|Borough|Census Area|Municipio|Municipality|city)$/i, '') : (stateSel || 'your area');
  const showTabs = screen !== 'onboarding';

  // ── Derived, input-driven case values (no hardcoded persona) ──
  const cfg = issueCfg(issue);
  const openedDays = daysAgo(caseOpened);
  const openedLabel = openedDays === 0 ? 'today' : openedDays === 1 ? 'yesterday' : openedDays + ' days ago';
  const evidenceCount = entries.length;
  // Salaried users never had a way to enter a rate, so owedEstimate was always 0
  // for them — even though the exemption wizard exists specifically to catch
  // misclassified SALARIED workers. Derive an hourly-equivalent from their stated
  // annual salary (see hourlyEquivFromSalary) when payType is Salary.
  const rateNum = profile.payType === 'Salary' ? hourlyEquivFromSalary(profile.salary) : (Number(profile.rate) || 0);
  // Owed-amount estimate: distinguishes hours paid $0 (1.5×) from hours already
  // paid straight-time but denied the overtime premium (0.5× differential), and
  // groups logged hours by workweek — see computeOwedBreakdown.
  const owedBreakdown = computeOwedBreakdown(entries, rateNum);
  const unpaidHours = owedBreakdown.totalHours;
  const owedEstimate = owedBreakdown.owedEstimate;
  const strength = caseStrength(entries);
  // Show 0 filled bars when nothing is logged. Each strength dimension floors at
  // pct 12, so score is ~12 even with no evidence — Math.round(12/20) would light
  // one bar under the "Not started" label. Only fill bars once there's real evidence.
  const strengthFill = evidenceCount > 0 ? Math.max(1, Math.round(strength.score / 20)) : 0;
  const doneCtx = { entries, wizNode, profile };
  const doneCount = cfg.steps.filter((_, i) => isStepDone(cfg, i, done, doneCtx)).length;
  // The hero's "current step" must be the FIRST NOT-done step, not doneCount —
  // doneCount assumes completed steps are a contiguous prefix, but stepAutoDone
  // (above) can auto-complete a MIDDLE step (e.g. 'log hours' auto-dones as soon
  // as any entry exists, even before the earlier exemption-check step is done).
  // When that happens doneCount over-counts, Math.min(doneCount, len-1) points
  // at a step that's already done, and "Mark it done" no-ops forever because
  // isStepDone was already true — the hero gets stuck. findIndex instead finds
  // the first incomplete step regardless of which steps auto-completed out of
  // order; falls back to the last step once everything is done.
  const currentStepIdx = (() => {
    const idx = cfg.steps.findIndex((_, i) => !isStepDone(cfg, i, done, doneCtx));
    return idx === -1 ? cfg.steps.length - 1 : idx;
  })();
  // F4 — surface the much shorter OSHA §11(c) whistleblower deadline (30 days)
  // alongside the regular termination deadline for the subset of termination
  // cases the user's own words identify as safety-retaliation. See
  // isSafetyRetaliationCase for the detection rule.
  const safetyRetaliation = isSafetyRetaliationCase(cfg.key, entries, messages);
  const oshaFact = safetyRetaliation ? factByTopic((federal && federal.facts) || [], 'deadlines.oshaWhistleblower') : null;
  const youName = (profile.name || '').trim();
  const employerName = (profile.employer || '').trim();

  // F4 — the OSHA whistleblower deadline card, shown ALONGSIDE (never instead
  // of) the regular Deadline Watch card so a user who also has a discrimination
  // angle still sees that longer window too. Clearly labeled and visually
  // distinct (red) so the much shorter 30-day clock isn't mistaken for the
  // slower EEOC one above it.
  const OshaWatch = ({ dark }) => {
    if (!oshaFact) return null;
    return (
      <button onClick={nav('strength')} className="surfacefx" style={css(dark
        ? "text-align:left;padding:14px 16px;border-radius:12px;border:2px solid #FFB4C4;background:rgba(179,38,79,.35);cursor:pointer;display:flex;flex-direction:column;gap:4px"
        : "text-align:left;padding:16px 18px;border-radius:14px;border:2px solid #B3264F;background:#FFE7EC;cursor:pointer;display:flex;flex-direction:column;gap:4px")}>
        <span style={css("font:700 " + (dark ? '12px' : '13px') + " 'IBM Plex Mono',monospace;color:" + (dark ? '#FFE3EA' : '#8A1438') + ";letter-spacing:.04em;display:inline-flex;align-items:center;gap:6px")}><Icon name="alert" size={dark ? 13 : 14} /> OSHA WHISTLEBLOWER DEADLINE</span>
        <span style={css("font:700 " + (dark ? '16px/1.3' : '18px/1.3') + " 'Atkinson Hyperlegible',sans-serif;color:" + (dark ? '#fff' : '#14181F'))}>{oshaFact.value || oshaFact.summary}</span>
        <span style={css("font:400 " + (dark ? '13px/1.4' : '14px/1.4') + " 'Atkinson Hyperlegible',sans-serif;color:" + (dark ? '#FFE3EA' : '#5A1330'))}>Reporting a safety hazard? This OSHA complaint deadline is much shorter than the discrimination-charge window above.</span>
      </button>
    );
  };

  // R10 — a document/severance issue has no jurisdiction "deadlines" fact
  // (deadlineKeywordsFor returns [] for 'document'), so pickDeadlineFactAcross
  // is always null and these users got NO Home Deadline Watch card at all,
  // unlike every other issue type. The Older Workers Benefit Protection Act's
  // 21-day-to-consider / 7-day-to-revoke window (29 U.S.C. §626(f)) is a
  // general federal rule for age-related release agreements — true regardless
  // of state, so it is deliberately NOT sourced from stateData/federal facts
  // and is labeled "general federal rule" rather than jurisdiction-specific.
  const DocDeadlineWatch = ({ dark }) => {
    if (cfg.key !== 'document') return null;
    return (
      <button onClick={nav('strength')} className="surfacefx" style={css(dark
        ? "text-align:left;padding:14px 16px;border-radius:12px;border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);cursor:pointer;display:flex;flex-direction:column;gap:4px"
        : "text-align:left;padding:16px 18px;border-radius:14px;border:2px solid #14181F;background:#F0EDE5;cursor:pointer;display:flex;flex-direction:column;gap:4px")}>
        <span style={css("font:700 " + (dark ? '12px' : '13px') + " 'IBM Plex Mono',monospace;color:" + (dark ? '#DDE2FF' : '#14181F') + ";letter-spacing:.04em;display:inline-flex;align-items:center;gap:6px")}><Icon name="deadline-clock" size={dark ? 13 : 14} /> DEADLINE WATCH · GENERAL FEDERAL RULE</span>
        <span style={css("font:700 " + (dark ? '16px/1.3' : '18px/1.3') + " 'Atkinson Hyperlegible',sans-serif;color:" + (dark ? '#fff' : '#14181F'))}>21 days to consider, 7 days to revoke</span>
        <span style={css("font:400 " + (dark ? '13px/1.4' : '14px/1.4') + " 'Atkinson Hyperlegible',sans-serif;color:" + (dark ? '#DDE2FF' : '#3A4150'))}>If your document is a release covered by the Older Workers Benefit Protection Act (29 U.S.C. §626(f)), this is the standard federal window — not sourced from {stateLabel}'s own facts. Confirm the exact days stated in your copy.</span>
      </button>
    );
  };

  // wl-ux HIGH #7 — the state claim deadline shown in a Deadline Watch card and
  // this federal FLSA lawsuit statute of limitations are two DIFFERENT clocks.
  // Previously the SOL note was appended as a plain inline span right after the
  // state value with no visual break, so "This 2–3 year deadline" read as a
  // restatement of the value just above it. This renders it as its own bordered,
  // labeled sub-block — same pattern as OshaWatch's distinct card — everywhere
  // FLSA_SOL_TIMING_NOTE is shown for a wage case.
  const FlsaSolNote = ({ dark }) => (
    <div style={css((dark
      ? "padding:10px 12px;border-radius:0 8px 8px 0;border:none;border-left:4px solid rgba(255,227,166,.7);background:#626DBF"
      : "padding:10px 12px;border-radius:0 8px 8px 0;border:none;border-left:4px solid #14181F;background:#FFF4D6") + ";display:flex;flex-direction:column;gap:3px")}>
      <span style={css("font:700 12px 'IBM Plex Mono',monospace;color:" + (dark ? '#FFFEF0' : '#8A5A00') + ";letter-spacing:.04em")}>SEPARATE CLOCK · FEDERAL LAWSUIT DEADLINE</span>
      {/* FIND-09 (docs/audit-2026-08-29.md) — the previous "wl-ux contrast fix" comment here
          assumed a SINGLE rgba(255,255,255,.14) composite (~rgb(73,86,180)). Wrong: in
          Action-first mode this note renders INSIDE the Deadline Watch surfacefx button,
          which is ITSELF rgba(255,255,255,.14) over the #2B3AA8 screen — so this dark
          variant's old rgba(255,255,255,.14) background was a SECOND translucent layer
          stacking on the first, actually compositing to rgb(98,109,191). #FFE3A6/#FFF4D6
          against that real value measured 3.76:1 / 4.29:1 — both under the 4.5:1 AA floor
          for 12px/14px bold text (bold text needs ~18.66px to count as "large"). Fixed by
          baking the composite in as an OPAQUE #626DBF background (no more stacked alpha to
          drift), and using #FFFEF0 for both label and body, which measures 4.64:1 against
          #626DBF — verified with a walk-the-ancestor-chain script, see
          test/nested-translucency-contrast.mjs. */}
      <span style={css("font:700 14px/1.4 'Atkinson Hyperlegible',sans-serif;color:" + (dark ? '#FFFEF0' : '#6B4B00'))}>{FLSA_SOL_TIMING_NOTE}</span>
    </div>
  );

  // Date-anchored Deadline Calculator (non-interactive content only — this renders
  // INSIDE the existing Deadline Watch card, which is itself a <button>; nesting a
  // second interactive control in there would be invalid HTML and steal/duplicate
  // clicks, so the "add a date" prompt below is a separate sibling component instead).
  // Shows a computed target date + countdown ONLY when the user has entered a trigger
  // date AND parseDeadlineWindow can cleanly read a period from the fact text — never a
  // guessed date. Urgency styling (amber under 30 days, red once past) mirrors the
  // existing OshaWatch/FlsaSolNote sub-block pattern so it reads as the same design
  // language, not a new one-off.
  const DeadlineComputedBlock = ({ dark, dl }) => {
    if (!dl || !profile.eventDate) return null;
    const computed = computeDeadlineFromEvent(profile.eventDate, dl.value || dl.summary);
    if (!computed) return null; // fact text didn't cleanly parse — never fabricate a date
    const { targetDate, daysLeft, isPast } = computed;
    const urgent = !isPast && daysLeft < 30;
    const tone = isPast ? 'past' : urgent ? 'urgent' : 'ok';
    // FIND-09 (docs/audit-2026-08-29.md) — same double-translucency bug as FlsaSolNote:
    // dark's `bg` here renders INSIDE the Deadline Watch surfacefx button (itself
    // rgba(255,255,255,.14) over the #2B3AA8 screen), so a second rgba(...) layer was
    // compositing to a color no one had measured. Baked in as opaque hex — the ACTUAL
    // composite for each tone, walked ancestor-by-ancestor — so contrast is against a
    // known value instead of an accident of stacking:
    //   urgent rgba(255,255,255,.14)-on-layer1  -> rgb(98,109,191)  = #626DBF
    //   past   rgba(179,38,79,.35)-on-layer1     -> rgb(110,69,145) = #6E4591
    //   ok     rgba(255,255,255,.1)-on-layer1    -> rgb(91,103,188) = #5B67BC
    // Measured pairs (test/nested-translucency-contrast.mjs): urgent #FFFEF0 on #626DBF
    // = 4.64:1; past #FFE3EA on #6E4591 = 5.96:1 (already compliant, unchanged); ok
    // #F3F5FF on #5B67BC = 4.70:1 (old #DDE2FF measured only 3.99:1 — also a real,
    // previously-unflagged failure).
    const border = { past: dark ? 'rgba(255,180,196,.9)' : '#B3264F', urgent: dark ? 'rgba(255,227,166,.7)' : '#14181F', ok: dark ? 'rgba(255,255,255,.4)' : '#14181F' }[tone];
    const bg = { past: dark ? '#6E4591' : '#FFE7EC', urgent: dark ? '#626DBF' : '#FFF4D6', ok: dark ? '#5B67BC' : '#F0EDE5' }[tone];
    const labelColor = { past: dark ? '#FFE3EA' : '#8A1438', urgent: dark ? '#FFFEF0' : '#8A5A00', ok: dark ? '#F3F5FF' : '#14181F' }[tone];
    const bodyColor = { past: dark ? '#FFE3EA' : '#5A1330', urgent: dark ? '#FFFEF0' : '#6B4B00', ok: dark ? '#F3F5FF' : '#3A4150' }[tone];
    const daysWord = Math.abs(daysLeft) === 1 ? 'day' : 'days';
    const headline = isPast
      ? 'This deadline may have passed — talk to an attorney immediately, some exceptions exist.'
      : 'File by ' + formatDeadlineDate(targetDate) + ' — about ' + daysLeft + ' ' + daysWord + ' left.';
    return (
      <div style={css('padding:10px 12px;border-radius:0 8px 8px 0;border:none;border-left:4px solid ' + border + ';background:' + bg + ";display:flex;flex-direction:column;gap:3px")}>

        <span style={css("font:400 12px/1.4 'Atkinson Hyperlegible',sans-serif;color:" + bodyColor)}>{DEADLINE_ESTIMATE_CAVEAT}</span>
      </div>
    );
  };
  // The sibling "add a date" prompt — rendered OUTSIDE the Deadline Watch card button
  // (see DeadlineComputedBlock) whenever a deadline fact exists but no trigger date has
  // been entered yet, so a user only ever sees the static duration text until they add
  // one. Jumps straight to onboarding step 4 (see openEditFlowAtDate) instead of the
  // full state/county/issue flow.
  const AddDeadlineDatePrompt = ({ dark, dl }) => {
    if (!dl || profile.eventDate) return null;
    return (
      <button onClick={openEditFlowAtDate} className="hoverfx" style={css("align-self:flex-start;min-height:44px;display:inline-flex;align-items:center;padding:8px 4px;margin:-6px 0 0;background:none;border:none;cursor:pointer;text-align:left;font:700 14px/1.4 'Atkinson Hyperlegible',sans-serif;color:" + (dark ? '#FFE3A6' : '#2B3AA8') + ";text-decoration:underline")}>Add the date this happened to see your actual deadline</button>
    );
  };
  // FIND-06 (docs/audit-2026-08-29.md) — onboarding's "Skip to dashboard" leaves
  // stateSel/issue unset, so pickDeadlineFactAcross has nothing to key off and every
  // Home mode rendered NO Deadline Watch card and no indication anything was
  // missing — silently dropping the app's most time-critical widget for exactly the
