name: verify

on:
  push:
    branches: [main, auto/agents]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Provision headless Chrome for Puppeteer suites
        run: npx --yes @puppeteer/browsers install chrome-headless-shell@stable

      - name: Run full verify (build + validators + Puppeteer suites)
        run: npm run verify
