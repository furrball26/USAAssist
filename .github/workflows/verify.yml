name: verify

on:
  push:
    branches: [main, auto/agents]
  pull_request:
    # CONTRIBUTING.md requires every change to land on auto/agents first, so PRs
    # targeting auto/agents must be gated too — listing only main left the repo's
    # own documented flow with no pre-merge CI at all.
    branches: [main, auto/agents]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Provision headless Chrome for Puppeteer suites
        # --path . installs the browser to ./chrome-headless-shell, exactly where the
        # Puppeteer suites' `find` call looks (see test/smoke.mjs). Without it the browser
        # lands in the default cache and every browser-driven suite fails in CI.
        run: npx --yes @puppeteer/browsers install chrome-headless-shell@stable --path .

      - name: Run full verify (build + validators + Puppeteer suites)
        run: npm run verify
