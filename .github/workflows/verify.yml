name: verify

on:
  push:
    # claude/** is covered too: PRs from these branches have repeatedly produced
    # no pull_request check run at all (PR #6 saw three pushes with zero runs
    # while pushes to main/auto-agents ran normally), leaving the repo's own
    # working branches unverified. Gating the push keeps them covered whatever
    # the pull_request event does.
    branches: [main, auto/agents, 'claude/**']
  pull_request:
    # CONTRIBUTING.md requires every change to land on auto/agents first, so PRs
    # targeting auto/agents must be gated too — listing only main left the repo's
    # own documented flow with no pre-merge CI at all.
    branches: [main, auto/agents]

# A PR from a claude/** branch into main/auto/agents matches BOTH triggers above for
# the SAME commit (push, because claude/** is gated; pull_request, because it targets
# main/auto/agents) — doubling CI time on every push. Key the concurrency group on the
# actual commit being verified so both runs collapse into one instead of removing
# either trigger's coverage.
#
# `github.sha` is NOT that commit for a pull_request event — GitHub sets it to the
# ephemeral merge commit on refs/pull/N/merge, which differs from the push event's
# `github.sha` for the identical head commit and would defeat the dedup. Use the PR's
# actual head SHA when present (pull_request) and fall back to `github.sha` otherwise
# (push, where it already IS the commit being verified).
#
# Grouping is per-commit, so this can only ever collapse runs that are verifying the
# EXACT same commit (this push+pull_request duplicate, or the fast-forward main==
# auto/agents deploy pushing the same SHA to two branches — also a legitimate
# duplicate, since re-verifying identical content is redundant regardless of which
# ref it landed on). It can never cancel a run for a genuinely different commit —
# a different SHA always produces a different group — so an in-progress push run for
# an earlier, distinct main/auto/agents commit is never at risk here.
concurrency:
  group: verify-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Provision headless Chrome for Puppeteer suites
        # --path . installs the browser to ./chrome-headless-shell, exactly where the
        # Puppeteer suites' `find` call looks (see test/smoke.mjs). Without it the browser
        # lands in the default cache and every browser-driven suite fails in CI.
        run: npx --yes @puppeteer/browsers install chrome-headless-shell@stable --path .

      - name: Run full verify (build + validators + Puppeteer suites)
        run: npm run verify
